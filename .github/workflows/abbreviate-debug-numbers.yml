name: Abbreviate debug numbers

on:
  push:
    paths:
      - 'scripts/abbreviate_debug_numbers.py'
      - '.github/workflows/abbreviate-debug-numbers.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: python scripts/abbreviate_debug_numbers.py
      - run: npm install
      - run: npm run build
      - name: Verify page JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          html=Path('index.html').read_text()
          assert "const compactText=" in html
          assert "toLowerCase()" in html
          start=html.index('<script>')+len('<script>')
          end=html.rindex('</script>')
          Path('/tmp/page.js').write_text(html[start:end])
          PY
          node --check /tmp/page.js
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Abbreviate large numbers in battle debug logs"
            git push
          fi
