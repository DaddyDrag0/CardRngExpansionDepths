name: Add Ranked Conqueror

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/add-conqueror-ranked.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Add Conqueror and expose it to player team picker
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          cards_path = Path('src/data/cards-1.json')
          cards = json.loads(cards_path.read_text())
          if not any(c.get('name') == 'Conqueror' for c in cards):
              cards.append({
                  'name': 'Conqueror',
                  'imageAssetId': 130423117999240,
                  'rarity': 25000,
                  'statMultiplier': 1,
                  'hpMultiplier': 1,
                  'ability': 'Dominate',
                  'weather': None,
                  'pack': None,
                  'boss': False,
                  'unobtainable': True,
                  'expires': False,
              })
              cards.sort(key=lambda c: c['name'].casefold())
          cards_path.write_text(json.dumps(cards, ensure_ascii=False, separators=(',', ':')) + '\n')

          index_path = Path('index.html')
          text = index_path.read_text()
          old = "shown=state.cards.filter(c=>!c.unobtainable).filter(c=>!q||c.name.toLowerCase().includes(q)||(c.ability||'').toLowerCase().includes(q))"
          new = "shown=state.cards.filter(c=>!c.unobtainable||c.name==='Conqueror').filter(c=>!q||c.name.toLowerCase().includes(q)||(c.ability||'').toLowerCase().includes(q))"
          if old not in text:
              raise SystemExit('Player team library filter anchor not found')
          text = text.replace(old, new, 1)
          index_path.write_text(text)
          PY
          grep -F '"name":"Conqueror"' src/data/cards-1.json
          grep -F "!c.unobtainable||c.name==='Conqueror'" index.html
      - name: Install dependencies
        run: npm ci
      - name: Build and test
        run: |
          npm run build
          npm run test:engine
          npm run test:depths
          npm run test:player
      - name: Rebuild browser worker
        run: npx --no-install esbuild src/browser-worker.ts --bundle --format=iife --platform=browser --target=es2020 --minify --outfile=browser/depths-worker.js
      - name: Commit final Conqueror fix
        shell: bash
        run: |
          rm .github/workflows/add-conqueror-ranked.yml
          git config user.name "Drago"
          git config user.email "dragoidc3@gmail.com"
          git add src/data/cards-1.json index.html browser/depths-worker.js .github/workflows/add-conqueror-ranked.yml
          git commit -m "Add ranked Conqueror to player team picker"
          git push
