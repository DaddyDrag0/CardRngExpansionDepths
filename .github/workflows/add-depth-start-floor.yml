name: Add Depth Start Floor

on:
  push:
    branches: [main]
    paths:
      - "scripts/apply-depth-start-floor.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: depth-start-floor-update
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply start-floor feature
        run: python scripts/apply-depth-start-floor.py
      - name: Install dependencies
        run: npm ci
      - name: Run full checks
        run: npm run check
      - name: Rebuild browser workers
        run: npm run build:workers
      - name: Verify start-floor wiring
        run: |
          grep -q 'id="startFloorInput"' index-base.html
          grep -q 'startFloor:state.startFloor' index-base.html
          grep -q 'startFloor' browser/depths-worker.js
      - name: Publish update
        run: |
          git config user.name "Depths Calculator Updater"
          git config user.email "actions@users.noreply.github.com"
          git add src/browser-worker.ts index-base.html browser/depths-worker.js scripts/validate-ui.mjs site-version.json
          if git diff --cached --quiet; then
            echo "No start-floor changes needed."
            exit 0
          fi
          git commit -m "Add selectable Depths start floor"
          git push origin HEAD:main
