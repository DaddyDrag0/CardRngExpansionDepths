name: Add site themes

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-site-themes.yml'
      - '.github/theme-patch.py'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply theme patch
        run: python3 .github/theme-patch.py
      - run: npm ci
      - run: npm run check
      - name: Bump site version
        run: printf '{"version":"%s"}\n' "$(date -u +%Y%m%d-%H%M%SZ)" > site-version.json
      - name: Publish theme update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/add-site-themes.yml .github/theme-patch.py
          git add -A
          git commit -m "Add Default Scarlet and Slate site themes"
          git pull --rebase origin main
          git push origin HEAD:main
