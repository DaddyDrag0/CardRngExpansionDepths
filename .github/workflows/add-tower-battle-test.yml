name: Build Tower battle test

on:
  push:
    paths:
      - '.github/workflows/add-tower-battle-test.yml'
      - 'scripts/add_tower_battle_test.py'
      - 'src/engine/tower.ts'
      - 'src/tower-worker.ts'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: python scripts/add_tower_battle_test.py
      - run: npx tsc --noEmit
      - name: Build Tower worker
        run: npx esbuild src/tower-worker.ts --bundle --format=iife --platform=browser --target=es2020 --outfile=browser/tower-worker.js
      - name: Smoke test Tower engine
        run: |
          cat > /tmp/tower-smoke.ts <<'TS'
          import { simulateTowerBatch } from '${{ github.workspace }}/src/engine/tower.ts'
          const loadout={cards:[
            {cardName:'Parallax',borders:[]},
            {cardName:'Judgment Day',borders:[]},
            {cardName:'Judgment Day',borders:[]},
            {cardName:'Judgment Day',borders:[]},
          ]}
          const result=simulateTowerBatch(loadout,['Boreas','Wind Spirit','Wind Spirit','Wind Spirit'],55,'Impossible',10,12345)
          if(result.runs!==10)throw new Error('Tower batch did not run 10 battles')
          console.log(result)
          TS
          npx tsx /tmp/tower-smoke.ts
          node --check browser/tower-worker.js
          python - <<'PY'
          from pathlib import Path
          html=Path('index.html').read_text()
          assert 'Simulate ${full(state.towerRuns)}' in html
          assert "towerDifficulty:'Impossible'" in html
          assert "new Worker('./browser/tower-worker.js')" in html
          print('Tower battle-test UI assertions passed.')
          PY
      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html browser/tower-worker.js
          if git diff --cached --quiet; then
            echo "No generated changes."
          else
            git commit -m "Add 1000-run Tower battle test"
            git push
          fi
