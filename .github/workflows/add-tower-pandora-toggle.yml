name: Add Tower Pandora toggle

on:
  push:
    paths:
      - '.github/workflows/add-tower-pandora-toggle.yml'
      - 'scripts/add_tower_pandora_toggle.py'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: python scripts/add_tower_pandora_toggle.py
      - name: Verify
        run: |
          python - <<'PY'
          from pathlib import Path
          html=Path('index.html').read_text()
          assert "towerOverrides:['','','','']" in html
          assert 'data-tower-pandora' in html
          assert "state.towerOverrides[i]||p.pick" in html
          assert "Manual Pandora swap" in html
          start=html.index('<script>')+len('<script>')
          end=html.rindex('</script>')
          Path('/tmp/page.js').write_text(html[start:end])
          print('Tower Pandora toggle assertions passed.')
          PY
          node --check /tmp/page.js
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Add per-slot Pandora swaps to Tower"
            git push
          fi
