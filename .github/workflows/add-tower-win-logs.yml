  1,
  'Normal',
  25,
  424242,
)
assert.equal(loggingBatch.wins, 25, 'Easy Tower batch should win every test battle')
assert.ok(loggingBatch.winningLogs.length > 0, 'Winning Tower battles should create representative logs')
assert.ok(loggingBatch.winningLogs.length <= MAX_TOWER_WIN_LOGS, 'Tower winning logs must stay capped')
assert.ok(loggingBatch.winningLogs[0].debug.events.length > 0, 'Representative winning log should contain battle events')
assert.equal(loggingBatch.winningLogs[0].debug.initialAllies.length, 4, 'Winning log should capture the starting player team')
assert.ok(loggingBatch.winningLogs.every((log) => log.occurrences >= 1), 'Each stored win pattern should track how often it occurred')

"""+marker
          if marker not in s: raise SystemExit('tower regression console anchor missing')
          s=s.replace(marker,extra,1)
