name: Add Tower winning-run logs

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-tower-win-logs.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: npm ci

      - name: Validate full project
        run: |
          npm run check
          npm run test:video-game
          npx tsx scripts/tower-win-logs-regression.ts
          node --check src/tower-win-logs-ui.js

      - name: Build worker bundles
        run: npm run build:workers

      - name: Verify generated logging bundle
        run: |
          grep -q "simulateTowerBatchLogged" src/tower-worker.ts
          grep -q "winningLogs" browser/tower-worker.js
          grep -q "tower-win-logs-ui.js" index.html
          grep -q "Winning run logs" src/tower-win-logs-ui.js
          test "$(node -e \"const fs=require('fs');const j=JSON.parse(fs.readFileSync('site-version.json','utf8'));process.stdout.write(j.version)\")" = "20260907-tower-win-logs-1"

      - name: Publish built worker
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/add-tower-win-logs.yml
          git add -A
          git commit -m "Add representative winning logs to Tower cheese simulator"
          git pull --rebase origin main
          git push origin HEAD:main
