name: Add Tower winning-run logs

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-tower-win-logs.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply selective win-log patch
        env:
          PATCH_ZLIB_B64: 
        run: |
          python3 - <<'PY'
          import os,base64,zlib
          data=base64.b64decode(os.environ['PATCH_ZLIB_B64'])
          exec(zlib.decompress(data).decode(),{'__name__':'__main__'})
          PY

      - name: Install dependencies
        run: npm ci

      - name: Validate full project
        run: |
          npm run check
          npm run test:video-game

      - name: Build worker bundles
        run: npm run build:workers

      - name: Verify generated logging bundle
        run: |
          grep -q "winningLogs" src/engine/tower.ts
          grep -q "Winning run logs" index-base.html
          grep -q "Tower winning-run diagnostics" src/styles-base.css
          grep -q "winningLogs" browser/tower-worker.js
          test "$(node -e \"const fs=require('fs');const j=JSON.parse(fs.readFileSync('site-version.json','utf8'));process.stdout.write(j.version)\")" = "20260907-tower-win-logs-1"

      - name: Publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/add-tower-win-logs.yml
          git add -A
          git commit -m "Add representative winning logs to Tower cheese simulator"
          git pull --rebase origin main
          git push origin HEAD:main
