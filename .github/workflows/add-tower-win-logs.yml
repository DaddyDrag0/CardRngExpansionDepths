name: Add Tower winning-run logs

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-tower-win-logs.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add selective winning-run logging
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # --- Tower engine: collect cheap win signatures, then replay only representative wins with debug. ---
          p=Path('src/engine/tower.ts')
          s=p.read_text()
          old="import type { BattleResult, DepthsEnemy, TeamCard, TeamLoadout } from '../types'"
          new="import type { BattleDebug, BattleResult, DepthsEnemy, TeamCard, TeamLoadout } from '../types'"
          if old not in s: raise SystemExit('tower.ts import anchor missing')
          s=s.replace(old,new,1)

          old="""export interface TowerBatchResult {
  runs: number
  wins: number
  losses: number
  draws: number
  winRate: number
  averageTurns: number
  minTurns: number
  maxTurns: number
  trusted: boolean
  unsupportedAbilities: string[]
}
"""
          new="""export const MAX_TOWER_WIN_LOGS = 8

export interface TowerWinningLog {
  seed: number
  turns: number
  occurrences: number
  signature: string
  survivingAllies: string[]
  fallenAllies: string[]
  debug: BattleDebug
}

export interface TowerBatchResult {
  runs: number
  wins: number
  losses: number
  draws: number
  winRate: number
  averageTurns: number
  minTurns: number
  maxTurns: number
  trusted: boolean
  unsupportedAbilities: string[]
  winningLogs: TowerWinningLog[]
  winningPatternCount: number
  winningLogsTruncated: boolean
}
"""
          if old not in s: raise SystemExit('TowerBatchResult anchor missing')
          s=s.replace(old,new,1)

          old="""export function simulateTowerBatch(
  loadout: TeamLoadout,
  enemyNames: string[],
  floor: number,
  difficulty: TowerDifficulty,
  runs = 1_000,
  seed = 1,
  onProgress?: (completed: number, total: number) => void,
): TowerBatchResult {
"""
          new="""function towerWinPattern(battle: BattleResult): {
  signature: string
  survivingAllies: string[]
  fallenAllies: string[]
} {
  const survivingAllies = battle.state.teams.Allies.map((card) => card.definition.name)
  const fallenAllies = battle.state.fallen.Allies.map((card) => card.definition.name)
  const survivorState = battle.state.teams.Allies.map((card) => {
    const hpBucket = card.maxHp > 0 ? Math.max(0, Math.min(10, Math.round((card.hp / card.maxHp) * 10))) : 0
    return `${card.definition.name}:${hpBucket}`
  })
  return {
    signature: `${battle.turns}|alive:${survivorState.join('>')}|fallen:${fallenAllies.join('>')}`,
    survivingAllies,
    fallenAllies,
  }
}

export function simulateTowerBatch(
  loadout: TeamLoadout,
  enemyNames: string[],
  floor: number,
  difficulty: TowerDifficulty,
  runs = 1_000,
  seed = 1,
  onProgress?: (completed: number, total: number) => void,
): TowerBatchResult {
"""
          if old not in s: raise SystemExit('simulateTowerBatch anchor missing')
          s=s.replace(old,new,1)

          old="""  let maxTurns = 0

  for (let index = 0; index < total; index++) {
    const battleSeed = Math.floor(seedRng.next() * 0x7fffffff) || index + 1
    const battle = simulateBattleV2(loadout, enemies, battleSeed, 2_000, true, false)
    if (battle.winner === 'Allies') wins += 1
    else if (battle.winner === 'Enemies') losses += 1
    else draws += 1
"""
          new="""  let maxTurns = 0
  const winPatterns = new Map<string, {
    count: number
    seed: number
    turns: number
    signature: string
    survivingAllies: string[]
    fallenAllies: string[]
  }>()

  for (let index = 0; index < total; index++) {
    const battleSeed = Math.floor(seedRng.next() * 0x7fffffff) || index + 1
    const battle = simulateBattleV2(loadout, enemies, battleSeed, 2_000, true, false)
    if (battle.winner === 'Allies') {
      wins += 1
      const pattern = towerWinPattern(battle)
      const existing = winPatterns.get(pattern.signature)
      if (existing) existing.count += 1
      else winPatterns.set(pattern.signature, {
        count: 1,
        seed: battleSeed,
        turns: battle.turns,
        signature: pattern.signature,
        survivingAllies: pattern.survivingAllies,
        fallenAllies: pattern.fallenAllies,
      })
    }
    else if (battle.winner === 'Enemies') losses += 1
    else draws += 1
"""
          if old not in s: raise SystemExit('Tower batch loop anchor missing')
          s=s.replace(old,new,1)

          old="""  return {
    runs: total,
    wins,
    losses,
    draws,
    winRate: wins / total,
    averageTurns: totalTurns / total,
    minTurns: Number.isFinite(minTurns) ? minTurns : 0,
    maxTurns,
    trusted: unsupported.size === 0,
    unsupportedAbilities: [...unsupported].sort(),
  }
}
"""
          new="""  // Full debug capture is deliberately deferred until after the batch. The 10k simulation loop above
  // remains cheap. We then replay only a tiny representative sample of exact winning seeds.
  const patterns = [...winPatterns.values()]
  const byFrequency = [...patterns].sort((a, b) => b.count - a.count || a.turns - b.turns || a.signature.localeCompare(b.signature))
  const selected = byFrequency.slice(0, Math.min(6, MAX_TOWER_WIN_LOGS))
  if (patterns.length) {
    const fastest = [...patterns].sort((a, b) => a.turns - b.turns || b.count - a.count)[0]
    const slowest = [...patterns].sort((a, b) => b.turns - a.turns || b.count - a.count)[0]
    for (const edge of [fastest, slowest]) {
      if (selected.length >= MAX_TOWER_WIN_LOGS) break
      if (edge && !selected.some((entry) => entry.signature === edge.signature)) selected.push(edge)
    }
  }
  for (const entry of byFrequency) {
    if (selected.length >= MAX_TOWER_WIN_LOGS) break
    if (!selected.some((item) => item.signature === entry.signature)) selected.push(entry)
  }
  const winningLogs: TowerWinningLog[] = []
  for (const entry of selected) {
    const replay = simulateBattleV2(loadout, enemies, entry.seed, 2_000, true, true)
    if (replay.winner !== 'Allies' || !replay.debug) continue
    winningLogs.push({
      seed: entry.seed,
      turns: entry.turns,
      occurrences: entry.count,
      signature: entry.signature,
      survivingAllies: entry.survivingAllies,
      fallenAllies: entry.fallenAllies,
      debug: replay.debug,
    })
  }
  winningLogs.sort((a, b) => b.occurrences - a.occurrences || a.turns - b.turns || a.signature.localeCompare(b.signature))

  return {
    runs: total,
    wins,
    losses,
    draws,
    winRate: wins / total,
    averageTurns: totalTurns / total,
    minTurns: Number.isFinite(minTurns) ? minTurns : 0,
    maxTurns,
    trusted: unsupported.size === 0,
    unsupportedAbilities: [...unsupported].sort(),
    winningLogs,
    winningPatternCount: patterns.length,
    winningLogsTruncated: patterns.length > winningLogs.length,
  }
}
"""
