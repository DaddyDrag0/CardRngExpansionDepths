/* Tower winning-run diagnostics */
.tower-win-logs{margin-top:12px;border:1px solid var(--line-strong);background:var(--surface-2);border-radius:11px;padding:10px}.tower-win-log-head{display:flex;justify-content:space-between;align-items:center;gap:10px}.tower-win-log-head b{display:block;font-size:10px;color:#c2cedb}.tower-win-log-head small{display:block;margin-top:3px;color:#657487;font-size:8px;line-height:1.4}.tower-win-log-head button{border:1px solid var(--line-strong);background:var(--surface-3);color:#94a2b3;border-radius:8px;padding:6px 8px;font-size:8px;cursor:pointer}.tower-win-log-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:6px;margin-top:9px}.tower-win-log-list>button{display:flex;align-items:center;justify-content:space-between;gap:9px;text-align:left;border:1px solid var(--line-soft);background:var(--surface-3);color:#9aa8b8;border-radius:9px;padding:8px;cursor:pointer}.tower-win-log-list>button:hover{border-color:var(--accent-line);background:var(--surface-hover)}.tower-win-log-list b{display:block;color:#c8d3df;font-size:9px}.tower-win-log-list small{display:block;margin-top:2px;color:#718094;font-size:7px}.tower-win-log-list em{max-width:48%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-style:normal;color:var(--accent);font-size:7px;text-align:right}.tower-win-log-note,.tower-win-log-empty{margin-top:8px;color:#647286;font-size:8px;line-height:1.5}.tower-log-dialog{width:min(1000px,96vw);height:min(850px,94vh);padding:0;border:1px solid #2a394a;border-radius:14px;background:#070c12;color:#d2dbe5;box-shadow:0 25px 90px rgba(0,0,0,.7)}.tower-log-dialog::backdrop{background:rgba(0,0,0,.76)}.tower-log-shell{height:100%;display:flex;flex-direction:column}.tower-log-dialog-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;border-bottom:1px solid #1f2a37;background:#0a1119}.tower-log-dialog-head span{display:block;color:#70cfc0;font-size:7px;font-weight:850;letter-spacing:.12em}.tower-log-dialog-head b{display:block;margin-top:3px;color:#e0e7ef;font-size:12px}.tower-log-dialog-head small{display:block;margin-top:3px;color:#6d7b8c;font-size:8px}.tower-log-dialog-head>div:last-child{display:flex;gap:6px}.tower-log-dialog-head button{border:1px solid #2b3949;background:#101823;color:#aeb9c6;border-radius:8px;padding:6px 9px;font-size:8px;cursor:pointer}.tower-log-dialog pre{flex:1;overflow:auto;margin:0;padding:14px;white-space:pre-wrap;word-break:break-word;color:#aeb9c6;font:9px/1.55 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;background:#070c12}@media(max-width:620px){.tower-win-log-head,.tower-log-dialog-head{align-items:flex-start;flex-direction:column}.tower-win-log-list{grid-template-columns:1fr}}
"""
