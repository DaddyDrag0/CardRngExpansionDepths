          # --- Regression: verify winning runs produce detailed logs and stay capped. ---
          p=Path('scripts/tower-cheese-search-regression.ts')
          s=p.read_text()
          old="import { isTowerCheeseCandidateLegal, towerCheeseAnchors, towerCheeseCandidatePool, towerCheeseIntensivePlan } from '../src/engine/tower'"
          new="import { isTowerCheeseCandidateLegal, MAX_TOWER_WIN_LOGS, simulateTowerBatch, towerCheeseAnchors, towerCheeseCandidatePool, towerCheeseIntensivePlan } from '../src/engine/tower'"
          if old not in s: raise SystemExit('tower regression import anchor missing')
          s=s.replace(old,new,1)
          marker="console.log(`Tower cheese search regression passed with ${pool.length} candidates.`)"
          extra="""const loggingBatch = simulateTowerBatch(
  {
    cards: Array.from({ length: 4 }, () => ({ cardName: 'Behemoth', borders: [] })),
    statAura: null,
    abilityAura: null,
  },
