          old="""      const rerollWarning=sim&&!fixed&&sim.runs===10000&&sim.wins<50?`<div class=\"tower-reroll-warning\"><b>Very low success rate.</b> You might want to reroll this Tower team.</div>`:'';
      const simBody=sim?.error?`<div class=\"tower-sim-error\">${esc(sim.error)}</div>`:sim?`<div class=\"tower-sim-results\"><div><span>Wins</span><b>${full(sim.wins)} / ${full(sim.runs)}</b></div><div><span>Win rate</span><b>${(sim.winRate*100).toFixed(2)}%</b></div><div><span>Losses</span><b>${full(sim.losses)}</b></div><div><span>Avg turns</span><b>${one(sim.averageTurns)}</b></div></div><div class=\"tower-winbar\"><i style=\"width:${Math.max(0,Math.min(100,sim.winRate*100))}%\"></i></div><div class=\"tower-sim-note\">${sim.draws?`${full(sim.draws)} draws · `:''}${sim.elapsedMs<1000?`${Math.round(sim.elapsedMs)} ms`:`${(sim.elapsedMs/1000).toFixed(2)} s`} compute${sim.unsupportedAbilities?.length?` · Unsupported: ${esc(sim.unsupportedAbilities.join(', '))}`:''}</div>${rerollWarning}`:'';
"""
          new="""      const rerollWarning=sim&&!fixed&&sim.runs===10000&&sim.wins<50?`<div class=\"tower-reroll-warning\"><b>Very low success rate.</b> You might want to reroll this Tower team.</div>`:'';
      const winLogs=Array.isArray(sim?.winningLogs)?sim.winningLogs:[];
      const winLogHtml=sim&&!sim.error?`<div class=\"tower-win-logs\"><div class=\"tower-win-log-head\"><div><b>Winning run logs</b><small>${sim.wins?`${winLogs.length} detailed pattern${winLogs.length===1?'':'s'} saved from ${full(sim.wins)} wins · ${full(sim.winningPatternCount||winLogs.length)} unique outcome pattern${Number(sim.winningPatternCount||winLogs.length)===1?'':'s'}`:'No wins to log'}</small></div>${winLogs.length?'<button type=\"button\" data-copy-tower-win-logs>Copy all logs</button>':''}</div>${winLogs.length?`<div class=\"tower-win-log-list\">${winLogs.map((log,i)=>`<button type=\"button\" data-tower-win-log=\"${i}\"><span><b>Win pattern ${i+1}</b><small>Seen ×${full(log.occurrences||1)} · ${full(log.turns||0)} turns</small></span><em>${esc((log.survivingAllies||[]).join(' / ')||'No survivor summary')}</em></button>`).join('')}</div><div class=\"tower-win-log-note\">Only winning runs are logged. Duplicate outcomes are grouped. The simulator stores at most 8 full logs: the most common patterns plus fastest/slowest wins, then replays only those exact seeds with debug enabled.${sim.winningLogsTruncated?' More unique win patterns existed but were intentionally not expanded into full logs.':''}</div>`:'<div class=\"tower-win-log-empty\">No winning runs were recorded, so there are no logs.</div>'}</div>`:'';
      const simBody=sim?.error?`<div class=\"tower-sim-error\">${esc(sim.error)}</div>`:sim?`<div class=\"tower-sim-results\"><div><span>Wins</span><b>${full(sim.wins)} / ${full(sim.runs)}</b></div><div><span>Win rate</span><b>${(sim.winRate*100).toFixed(2)}%</b></div><div><span>Losses</span><b>${full(sim.losses)}</b></div><div><span>Avg turns</span><b>${one(sim.averageTurns)}</b></div></div><div class=\"tower-winbar\"><i style=\"width:${Math.max(0,Math.min(100,sim.winRate*100))}%\"></i></div><div class=\"tower-sim-note\">${sim.draws?`${full(sim.draws)} draws · `:''}${sim.elapsedMs<1000?`${Math.round(sim.elapsedMs)} ms`:`${(sim.elapsedMs/1000).toFixed(2)} s`} compute${sim.unsupportedAbilities?.length?` · Unsupported: ${esc(sim.unsupportedAbilities.join(', '))}`:''}</div>${rerollWarning}${winLogHtml}`:'';
"""
