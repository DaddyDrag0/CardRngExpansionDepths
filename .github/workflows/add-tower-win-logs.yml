"""
          new="""    root.querySelector('[data-sim-tower]')?.addEventListener('click',runTowerSimulation);
    root.querySelectorAll('[data-tower-win-log]').forEach(el=>el.addEventListener('click',()=>showTowerWinLog(Number(el.dataset.towerWinLog))));
    root.querySelector('[data-copy-tower-win-logs]')?.addEventListener('click',async()=>{const logs=state.towerSim?.winningLogs||[];if(!logs.length)return;const text=logs.map((log,i)=>towerWinLogText(log,i)).join('\\n\\n'+('=').repeat(72)+'\\n\\n');try{await navigator.clipboard.writeText(text);const button=root.querySelector('[data-copy-tower-win-logs]');if(button){button.textContent='Copied!';setTimeout(()=>{if(button.isConnected)button.textContent='Copy all logs'},900)}}catch(_){prompt('Copy Tower winning logs:',text)}});
  }
  function towerWinLogText(log,index){
    const d=log?.debug||{},lines=[];
    lines.push(`TOWER WIN LOG ${index+1}`);
    lines.push(`Seen: ×${Number(log?.occurrences||1).toLocaleString('en-US')} · Turns: ${Number(log?.turns||0).toLocaleString('en-US')} · Seed: ${log?.seed||0}`);
    lines.push(`Survivors: ${(log?.survivingAllies||[]).join(' / ')||'none'}`);
    lines.push(`Fallen allies: ${(log?.fallenAllies||[]).join(' / ')||'none'}`);
    if(d.initialAllies?.length){lines.push('', 'YOUR TEAM');for(const card of d.initialAllies)lines.push(`  ${card.name} · ${card.ability||'No ability'} · ${Math.ceil(card.hp)} HP · ${Math.ceil(card.damage)} ATK`)}
    if(d.initialEnemies?.length){lines.push('', 'ENEMY TEAM');for(const card of d.initialEnemies)lines.push(`  ${card.name} · ${card.ability||'No ability'} · ${Math.ceil(card.hp)} HP · ${Math.ceil(card.damage)} ATK`)}
    let lastTurn=null;
    for(const event of d.events||[]){if(event.turn!==lastTurn){lastTurn=event.turn;lines.push('',`TURN ${event.turn}`)}lines.push(`  [${event.team==='Allies'?'PLAYER':'ENEMY'} ${String(event.type||'event').toUpperCase()}] ${event.card}: ${event.detail||''}`)}
    if(d.finalAllies?.length){lines.push('', 'FINAL PLAYER CARDS');for(const card of d.finalAllies)lines.push(`  ${card.name} · ${Math.ceil(card.hp)}/${Math.ceil(card.maxHp)} HP · ${Math.ceil(card.damage)} ATK`)}
    if(d.finalEnemies?.length){lines.push('', 'FINAL ENEMY CARDS');for(const card of d.finalEnemies)lines.push(`  ${card.name} · ${Math.ceil(card.hp)}/${Math.ceil(card.maxHp)} HP · ${Math.ceil(card.damage)} ATK`)}
    return lines.join('\\n');
  }
  function showTowerWinLog(index){
    const log=state.towerSim?.winningLogs?.[index];if(!log)return;
    const dialog=document.createElement('dialog');dialog.className='tower-log-dialog';
    dialog.innerHTML=`<div class=\"tower-log-shell\"><div class=\"tower-log-dialog-head\"><div><span>WINNING RUN DEBUG</span><b>Pattern ${index+1} · seen ×${full(log.occurrences||1)}</b><small>${full(log.turns||0)} turns · seed ${log.seed||0}</small></div><div><button type=\"button\" data-tower-log-copy>Copy log</button><button type=\"button\" data-tower-log-close>Close</button></div></div><pre data-tower-log-text></pre></div>`;
    document.body.appendChild(dialog);dialog.querySelector('[data-tower-log-text]').textContent=towerWinLogText(log,index);dialog.showModal();
    const close=()=>{dialog.close();dialog.remove()};dialog.querySelector('[data-tower-log-close]').addEventListener('click',close);dialog.addEventListener('cancel',()=>dialog.remove());dialog.querySelector('[data-tower-log-copy]').addEventListener('click',async e=>{try{await navigator.clipboard.writeText(towerWinLogText(log,index));e.currentTarget.textContent='Copied!'}catch(_){}});
  }
