name: Add True Prophet Tower bridge

on:
  push:
    paths:
      - '.github/workflows/add-true-prophet-bridge.yml'
      - 'scripts/add_true_prophet_bridge.py'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: python scripts/add_true_prophet_bridge.py
      - name: Verify
        run: |
          python - <<'PY'
          from pathlib import Path
          html=Path('index.html').read_text()
          assert "TOWER_TRUE_PROPHET_BRIDGES=new Set(['Limitless'])" in html
          assert "pick='True Prophet'" in html
          assert 'prophetFollowupIndex' in html
          assert 'unresolvedBlockers' in html
          start=html.index('<script>')+len('<script>')
          end=html.rindex('</script>')
          Path('/tmp/page.js').write_text(html[start:end])
          print('True Prophet bridge assertions passed.')
          PY
          node --check /tmp/page.js
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Use True Prophet to preserve Parallax in Tower"
            git push
          fi
