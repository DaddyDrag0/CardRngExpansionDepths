name: Apply Admiral Ice Stats

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply-admiral-ice-stats.mjs'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Correct Admiral Ice stats
        run: node scripts/apply-admiral-ice-stats.mjs
      - name: Run full checks
        run: npm run check
      - name: Build browser workers
        run: npm run build:workers
      - name: Remove one-time migration files
        run: rm -f scripts/apply-admiral-ice-stats.mjs .github/workflows/apply-admiral-ice-stats.yml
      - name: Publish Admiral Ice correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Correct Admiral Ice stat multiplier"
          git push
