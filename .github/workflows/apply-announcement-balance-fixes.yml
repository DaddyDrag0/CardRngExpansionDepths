name: Apply Announcement Balance Fixes

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/apply-announcement-balance-fixes.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply patch
        run: python3 scripts/apply-announcement-balance-fixes.py
      - name: Install dependencies
        run: npm ci
      - name: Build and test
        run: |
          npm run build
          npm run test:engine
          npm run test:depths
          npm run test:player
      - name: Rebuild browser worker
        run: npx --no-install esbuild src/browser-worker.ts --bundle --format=iife --platform=browser --target=es2020 --minify --outfile=browser/depths-worker.js
      - name: Commit final fixes
        run: |
          rm .github/workflows/apply-announcement-balance-fixes.yml
          rm scripts/apply-announcement-balance-fixes.py
          git config user.name "Drago"
          git config user.email "dragoidc3@gmail.com"
          git add src/engine/battle-v2.ts src/data/abilities-4.json package.json scripts/announcement-balance-regression.ts browser/depths-worker.js .github/workflows/apply-announcement-balance-fixes.yml scripts/apply-announcement-balance-fixes.py
          git commit -m "Apply announcement-backed card balance fixes"
          git push
