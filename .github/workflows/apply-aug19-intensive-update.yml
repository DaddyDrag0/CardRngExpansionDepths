name: Apply Aug 19 intensive calculator update

on:
  push:
    branches: [aug19-intensive-cheese-update]
    paths:
      - .github/workflows/apply-aug19-intensive-update.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: aug19-intensive-cheese-update
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply source update
        run: python3 scripts/apply-aug19-intensive-update.py
      - run: npm ci
      - name: Validate calculator
        run: npm run check
      - name: Build browser workers
        run: npm run build:workers
      - name: Publish branch update
        run: |
          printf '{"version":"%s"}\n' "$(date -u +%Y%m%d-%H%M%SZ)" > site-version.json
          rm -f scripts/apply-aug19-intensive-update.py .github/workflows/apply-aug19-intensive-update.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add intensive Tower search and Aug 19 balance update"
          git push origin HEAD:aug19-intensive-cheese-update
