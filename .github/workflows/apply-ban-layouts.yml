name: Apply Depth Ban Layouts

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-ban-layouts.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Normalize migration-script quote escapes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/apply-ban-layouts.mjs')
          s = p.read_text()
          s = s.replace('\\\\"', '\\"')
          p.write_text(s)
          PY
      - run: node scripts/apply-ban-layouts.mjs
      - run: npm run check
      - run: npm run build:workers
      - name: Publish tested update
        run: |
          rm .github/workflows/apply-ban-layouts.yml scripts/apply-ban-layouts.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add four Depth ban layouts and sharing"
          git push
