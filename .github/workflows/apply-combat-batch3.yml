name: Apply Combat Batch 3

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-combat-batch3.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Fix third exact combat batch runner'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: python scripts/apply-combat-batch3.py
      - run: npm install
      - run: npm run build
      - run: npm run test:engine
      - name: Remove one-time patch files and commit
        run: |
          rm .github/workflows/apply-combat-batch3.yml scripts/apply-combat-batch3.py
          git config user.name "Drago"
          git config user.email "dragoidc3@gmail.com"
          git add src/engine/battle-v2.ts src/engine/support.ts .github/workflows/apply-combat-batch3.yml scripts/apply-combat-batch3.py
          git commit -m "Port third exact combat batch"
          git push
