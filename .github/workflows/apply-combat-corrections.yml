name: Apply combat corrections

on:
  push:
    paths:
      - 'scripts/apply-combat-corrections.mjs'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: node scripts/apply-combat-corrections.mjs
      - run: npm run build
      - run: npm run test:engine
      - run: npm run test:depths
      - run: npm run test:player
      - run: npx --no-install tsx scripts/combat-corrections-regression.ts
      - run: npx --no-install esbuild src/browser-worker.ts --bundle --format=iife --platform=browser --target=es2020 --minify --outfile=browser/depths-worker.js
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src browser/depths-worker.js scripts/combat-corrections-regression.ts
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Fix Erosion Zombie Dragon Pandora and Shuten balance"
            git push
          fi
