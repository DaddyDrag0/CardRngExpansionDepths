name: Apply Final Depths Ability Patch

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-combat-final.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Repair final Depths patch runner'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Repair and validate patch script
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/apply-combat-final.py')
          s = p.read_text()
          start = s.index('# Pandora is explicitly an RNG ability')
          end = s.index('# Make zero remaining abilities a CI invariant.', start)
          replacement = (
              "# Pandora is explicitly an RNG ability; Black Cat / Unlucky needs to recognize it.\n"
              "p = Path('src/engine/combat-data.ts')\n"
              "s = p.read_text()\n"
              "if \"Pandora's Box\" not in s:\n"
              "    marker = 'export const RNG_ABILITIES = new Set(['\n"
              "    idx = s.index(marker) + len(marker)\n"
              "    s = s[:idx] + \"\\n  \\\"Pandora's Box\\\",\" + s[idx:]\n"
              "p.write_text(s)\n\n"
          )
          p.write_text(s[:start] + replacement + s[end:])
          PY
          python -m py_compile scripts/apply-combat-final.py
      - name: Apply final combat patch
        run: python scripts/apply-combat-final.py
      - run: npm install
      - run: npm run build
      - run: npm run test:engine
      - name: Remove temporary inspection and patch files
        run: |
          rm -f .github/workflows/apply-combat-final.yml scripts/apply-combat-final.py
          rm -f debug/astraeus.png debug/astraeus-preview.b64
          rmdir debug 2>/dev/null || true
          git config user.name "Drago"
          git config user.email "dragoidc3@gmail.com"
          git add -A
          git commit -m "Complete Depths ability engine"
          git push
