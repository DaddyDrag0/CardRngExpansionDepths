name: Apply Combat Exactness Patch

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-combat-patch.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Queue battle v2 exactness patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Patch battle engine
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/engine/battle-v2.ts')
          s = p.read_text()

          def rep(old, new):
              global s
              if old not in s:
                  raise SystemExit('Patch anchor not found:\n' + old[:300])
              s = s.replace(old, new, 1)

          rep(
              "import { getAttack, getHealth, getPower } from './stats'",
              "import { getAttack, getHealth, getPower, rarityWithBorders } from './stats'\nimport { DEMON_CARDS, DRAGON_CARDS, IMP_BOOSTED_CARDS, RNG_ABILITIES, UNDEAD_CARDS } from './combat-data'",
          )

          rep(
              "  'Third Eye', 'Influence', 'Art of War', 'Dominate', 'Lightning Slash', 'True Fang',\n])",
              "  'Third Eye', 'Influence', 'Art of War', 'Dominate', 'Lightning Slash', 'True Fang',\n  'Book of Death', 'Holy Wrath', 'Telekinesis', 'Unlucky', 'Dragon Slayer', 'Outrank',\n  'Golden Bell Shield', 'Frozen Wrath', 'Immortal', 'Haste', 'Tonic', 'Destiny Sight',\n  'Eternal Devotion', \"Unpaid 'Interns'\", 'Infectious',\n])",
          )

          rep(
              "    case 'Fire World':\n      for (const target of runtime.state.teams[enemyTeam]) target.status.burn = 100\n      break",
              "    case 'Fire World':\n      for (const target of runtime.state.teams[enemyTeam]) target.status.burn = 100\n      break\n    case 'Book of Death':\n      enemy.counters.death = 2\n      break",
          )

          rep(
              "    case 'Infectious':\n      enemy.damage *= enemy.boss ? 0.85 : 0.5\n      enemy.hp *= enemy.boss ? 0.85 : 0.5\n      break",
              "    case 'Infectious':\n      enemy.damage *= enemy.boss ? 0.85 : 0.5\n      enemy.hp *= enemy.boss ? 0.85 : 0.5\n      break\n    case 'Dragon Slayer':\n      card.damage *= 1.75\n      break",
          )

          rep(
              "    case 'Super Strength':\n      card.damage *= 1.25\n      card.maxHp *= 1.25\n      card.hp = card.maxHp\n      break",
              "    case 'Super Strength':\n      card.damage *= 1.25\n      card.maxHp *= 1.25\n      card.hp = card.maxHp\n      break\n    case 'Immortal':\n      card.maxHp *= 3.5\n      card.hp *= 3.5\n      break",
          )

          rep(
              "    'Dirty Claw','Heart Hunter','Chainsaw','Firepower','Rapid Blows','Behavioral Therapy',\n  ].includes(name)) special = true",
              "    'Dirty Claw','Heart Hunter','Chainsaw','Firepower','Rapid Blows','Behavioral Therapy',\n    'Holy Wrath','Unlucky','Dragon Slayer','Frozen Wrath',\n  ].includes(name)) special = true",
          )

          rep(
              "  switch (name) {\n    case 'True Strike': if (rand(runtime, attacker.team) > 0.5) damage *= 2; break",
              "  switch (name) {\n    case 'True Strike': if (rand(runtime, attacker.team) > 0.5) damage *= 2; break\n    case 'Holy Wrath': if (UNDEAD_CARDS.has(target.definition.name)) damage *= 2; break\n    case 'Unlucky': if (target.definition.ability && RNG_ABILITIES.has(target.definition.ability)) damage *= 2; break",
          )

          rep(
              "    case 'Telekinesis':\n      attacker.counters.telekinesis = (attacker.counters.telekinesis || 0) % 2 + 1\n      damage *= attacker.counters.telekinesis === 1 ? 2 : 4\n      break",
              "    case 'Telekinesis':\n      attacker.counters.telekinesis = (attacker.counters.telekinesis || 0) % 2 + 1\n      damage *= attacker.counters.telekinesis === 1 ? 2 : 4\n      break\n    case 'Dragon Slayer': if (DRAGON_CARDS.has(target.definition.name)) damage *= 2; break\n    case 'Frozen Wrath': target.counters.frostbite = 1; break",
          )

          rep(
              "    case 'Armor': damage = Math.max(0, damage - target.maxHp * 0.1); break",
              "    case 'Armor': damage = Math.max(0, damage - target.maxHp * 0.1); break\n    case 'Dragon Slayer': if (DRAGON_CARDS.has(attacker.definition.name)) damage *= 0.5; break\n    case 'Outrank':\n      if (rarityWithBorders(attacker.definition, attacker.borders) < rarityWithBorders(target.definition, target.borders)) damage *= 0.5\n      break\n    case 'Golden Bell Shield': if (DEMON_CARDS.has(attacker.definition.name) || IMP_BOOSTED_CARDS.has(attacker.definition.name)) damage /= 3; break\n    case 'Frozen Wrath': if ((attacker.counters.frostbite || 0) > 0) damage *= 0.5; break",
          )

          rep(
              "function statusEnd(attacker: CombatCard) {",
              "function statusEnd(runtime: Runtime, attacker: CombatCard) {",
          )

          rep(
              "  if ((attacker.counters.bleed || 0) > 0) {\n    attacker.hp -= attacker.maxHp * 0.15\n    attacker.counters.bleed -= 1\n  }",
              "  if ((attacker.counters.bleed || 0) > 0) {\n    attacker.hp -= attacker.maxHp * 0.15\n    attacker.counters.bleed -= 1\n  }\n  if ((attacker.counters.frostbite || 0) > 0) {\n    attacker.counters.frostbite -= 1\n    if (runtime.rng.next() <= 0.5) {\n      attacker.status.stunned = Math.max(1, attacker.status.stunned)\n      attacker.hp -= attacker.maxHp * 0.2\n    }\n  }\n  if ((attacker.counters.death || 0) > 0 && ability(attacker) !== 'Erosion') {\n    attacker.counters.death -= 1\n    if (attacker.counters.death <= 0) attacker.hp = 0\n  }\n  if (ability(attacker) === 'Final Tail') {\n    attacker.counters.finalTail = (attacker.counters.finalTail || 0) + 1\n    if (attacker.counters.finalTail >= 3) attacker.hp = 0\n  }",
          )

          rep(
              "  statusEnd(attacker)\n  resolveDeaths(runtime)",
              "  statusEnd(runtime, attacker)\n  resolveDeaths(runtime)",
          )

          p.write_text(s)

      - name: Remove one-time patch workflow
        run: rm .github/workflows/apply-combat-patch.yml
      - name: Commit patch
        run: |
          git config user.name "Drago"
          git config user.email "dragoidc3@gmail.com"
          git add src/engine/battle-v2.ts .github/workflows/apply-combat-patch.yml
          git commit -m "Port additional original combat abilities"
          git push
