name: Apply Depths pool update

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-depths-pool-update.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply source and UI changes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=None):
              p = Path(path)
              text = p.read_text()
              hits = text.count(old)
              if hits == 0:
                  raise SystemExit(f'Missing expected text in {path}: {old!r}')
              if count is not None and hits != count:
                  raise SystemExit(f'Expected {count} matches in {path}, found {hits}: {old!r}')
              p.write_text(text.replace(old, new))

          replace(
              'src/engine/depths.ts',
              "const HARD_EXCLUSIONS = new Set([\n  'Samurai', 'Seraphim', 'Vampire Lord', 'Loki', 'Fuxi', 'Parallax',\n  'Nán Fāng Zhū Què', 'Brachiosaurus', 'Jersey Devil',\n])",
              "const HARD_EXCLUSIONS = new Set(['Vampire Lord'])",
              1,
          )
          replace('src/engine/depths.ts', 'export const MAX_DEPTH_BANS = 10', 'export const MAX_DEPTH_BANS = 12', 1)

          replace('index.html', 'const MAX_DEPTH_BANS=10;', 'const MAX_DEPTH_BANS=12;', 1)
          replace(
              'index.html',
              "const DEPTHS_DEFAULT_BANS=new Set(['Samurai','Seraphim','Vampire Lord','Loki','Fuxi','Parallax','Nán Fāng Zhū Què','Brachiosaurus','Jersey Devil']);",
              "const DEPTHS_DEFAULT_BANS=new Set(['Vampire Lord']);",
              1,
          )
          replace('index.html', 'Choose anywhere from 0 to 10.', 'Choose anywhere from 0 to 12.', 1)
          replace('index.html', "'10/10 bans selected'", "'12/12 bans selected'", 1)

          p = Path('scripts/depths-regression.ts')
          text = p.read_text()
          text = text.replace('// They are optional (0..10), while the game\'s built-in hard exclusions always stay excluded.', '// They are optional (0..12), while the game\'s built-in hard exclusions always stay excluded.')
          old = """  const elevenBans = eligibleNames.slice(0, 11)\n  const cappedPool = getDepthsPool(floor, elevenBans).map((entry) => entry.card.name)\n  for (const name of elevenBans.slice(0, MAX_DEPTH_BANS)) {\n    assert(!cappedPool.includes(name), `Expected capped player ban to remove ${name}`)\n  }\n  assert(cappedPool.includes(elevenBans[MAX_DEPTH_BANS]), 'Player Depth bans must cap at 10')"""
          new = """  const overCapBans = eligibleNames.slice(0, MAX_DEPTH_BANS + 1)\n  const cappedPool = getDepthsPool(floor, overCapBans).map((entry) => entry.card.name)\n  for (const name of overCapBans.slice(0, MAX_DEPTH_BANS)) {\n    assert(!cappedPool.includes(name), `Expected capped player ban to remove ${name}`)\n  }\n  assert(cappedPool.includes(overCapBans[MAX_DEPTH_BANS]), 'Player Depth bans must cap at 12')"""
          if old not in text:
              raise SystemExit('Missing expected Depth-ban regression block')
          text = text.replace(old, new)
          if 'assert(representatives.size === 176' not in text:
              raise SystemExit('Missing expected Depths ability-count regression')
          text = text.replace('assert(representatives.size === 176, `Expected 176 Depths abilities, found ${representatives.size}`)', 'assert(representatives.size === 184, `Expected 184 Depths abilities, found ${representatives.size}`)')
          p.write_text(text)
          PY
      - run: npm ci
      - run: npm run check
      - run: npm run build:workers
      - name: Commit update and generated workers
        shell: bash
        run: |
          rm .github/workflows/apply-depths-pool-update.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Update Depths bans and enemy pool"
          git push origin HEAD:main

# trigger
