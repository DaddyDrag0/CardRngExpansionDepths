name: Apply Depths potion reward update

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-depths-potion-rewards.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: python3 scripts/apply-depths-potion-rewards.py
      - run: npm ci
      - run: npm run check
      - run: npm run build:workers
      - name: Publish tested update
        run: |
          rm .github/workflows/apply-depths-potion-rewards.yml scripts/apply-depths-potion-rewards.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add Depths potion reward estimates"
          git pull --rebase origin main
          git push origin HEAD:main

# trigger
