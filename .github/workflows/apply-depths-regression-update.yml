name: Apply Depths regression update

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-depths-regression-update.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: python3 scripts/update-depths-regression.py
      - run: npm ci
      - run: npm run test:depths
      - name: Publish tested regression update
        run: |
          rm .github/workflows/apply-depths-regression-update.yml scripts/update-depths-regression.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Update Depths regression coverage"
          git pull --rebase origin main
          git push origin HEAD:main
