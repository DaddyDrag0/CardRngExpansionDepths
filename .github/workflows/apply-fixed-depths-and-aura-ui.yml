name: Apply Fixed Depths Pool And Aura UI

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-fixed-depths-and-aura-ui.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Queue fixed Depths pool and aura UI cleanup'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove custom enemy filters and improve Stat Aura details
        shell: python
        run: |
          from pathlib import Path
          import re

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'{label} anchor missing')
              return text.replace(old, new, 1)

          # Depths enemy generation: fixed game pool only.
          p = Path('src/engine/depths.ts')
          s = p.read_text()
          s = replace_once(s,
              "\nexport interface DepthsPoolSelection {\n  excludedCardNames?: readonly string[]\n  selectedCardNames?: readonly string[]\n}\n",
              "",
              'DepthsPoolSelection interface')
          s = re.sub(
              r"\nfunction isSelectedForCalculator\(card: CardDefinition, selection: DepthsPoolSelection\): boolean \{.*?\n\}\n",
              "",
              s,
              count=1,
              flags=re.S,
          )
          s = replace_once(s,
              "export function getDepthsPool(floor: number, selection: DepthsPoolSelection = {}) {\n  return cards\n    .filter((card) => isUnlockedAtFloor(card, floor) && isSelectedForCalculator(card, selection))",
              "export function getDepthsPool(floor: number) {\n  return cards\n    .filter((card) => isUnlockedAtFloor(card, floor))",
              'getDepthsPool')
          s = replace_once(s,
              "export function generateDepthsTeam(floor: number, seed = floor, selection: DepthsPoolSelection = {}): DepthsEnemy[] {\n  const pool = getDepthsPool(floor, selection)",
              "export function generateDepthsTeam(floor: number, seed = floor): DepthsEnemy[] {\n  const pool = getDepthsPool(floor)",
              'generateDepthsTeam')
          p.write_text(s)

          # Simulation API: no calculator-only enemy selection options.
          p = Path('src/engine/simulation.ts')
          s = p.read_text()
          s = replace_once(s,
              "import { generateDepthsTeam, type DepthsPoolSelection } from './depths'",
              "import { generateDepthsTeam } from './depths'",
              'simulation import')
          s = replace_once(s,
              "export interface DepthsSimulationOptions extends DepthsPoolSelection {",
              "export interface DepthsSimulationOptions {",
              'simulation options')
          s = re.sub(
              r"\n  const poolSelection: DepthsPoolSelection = \{\n    excludedCardNames: options\.excludedCardNames,\n    selectedCardNames: options\.selectedCardNames,\n  \}\n",
              "\n",
              s,
              count=1,
          )
          s = replace_once(s,
              "const enemies = generateDepthsTeam(floor, floorSeed, poolSelection)",
              "const enemies = generateDepthsTeam(floor, floorSeed)",
              'simulation generator call')
          s = replace_once(s,
              "      seed: runSeed,\n      excludedCardNames: options.excludedCardNames,\n      selectedCardNames: options.selectedCardNames,\n",
              "      seed: runSeed,\n",
              'simulation batch options')
          p.write_text(s)

          # Browser worker: accept only real simulation inputs.
          p = Path('src/browser-worker.ts')
          s = p.read_text()
          s = replace_once(s,
              "  seed: number\n  excludedCardNames?: string[]\n  selectedCardNames?: string[]\n}",
              "  seed: number\n}",
              'worker request fields')
          s = replace_once(s,
              "      seed: request.seed,\n      excludedCardNames: request.excludedCardNames,\n      selectedCardNames: request.selectedCardNames,\n",
              "      seed: request.seed,\n",
              'worker call fields')
          p.write_text(s)

          # Regression: the nine owner-disabled cards are permanently excluded.
          p = Path('scripts/depths-regression.ts')
          s = p.read_text()
          old = """const selectedPoolCard = strongest[0].cardName
          const selectedPoolTeam = generateDepthsTeam(50_000, 445566, { selectedCardNames: [selectedPoolCard] })
          assert(selectedPoolTeam.length === 4, 'Selected enemy pool did not generate four enemies')
          assert(selectedPoolTeam.every((enemy) => enemy.card.name === selectedPoolCard), 'Selected enemy pool generated an unselected card')
          const emptyFilteredPool = generateDepthsTeam(50_000, 445566, { selectedCardNames: [selectedPoolCard], excludedCardNames: [selectedPoolCard] })
          assert(emptyFilteredPool.length === 0, 'Excluded card remained in the selected enemy pool')
          """
          new = """const fixedDepthsExclusions = [
            'Samurai',
            'Seraphim',
            'Vampire Lord',
            'Loki',
            'Fuxi',
            'Parallax',
            'Nán Fāng Zhū Què',
            'Brachiosaurus',
            'Jersey Devil',
          ]
          for (const name of fixedDepthsExclusions) {
            const card = cardByName(name)
            assert(!isDepthsSourceEligible(card), `${name} must remain excluded from Depths enemy generation`)
          }
          """
          s = replace_once(s, old, new, 'fixed Depths exclusions regression')
          p.write_text(s)

          # Live page cleanup + clearer Stat Aura information.
          p = Path('index.html')
          s = p.read_text()

          old_css = ".aura-exact{margin-top:9px;border-top:1px solid #1c2633;padding-top:8px;color:#9aa7b7;font-size:9px;line-height:1.5}.aura-exact b{color:#cfeee8}"
          new_css = ".aura-exact{margin-top:9px;border-top:1px solid #1c2633;padding-top:9px;color:#9aa7b7;font-size:9px;line-height:1.5}.aura-stat-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}.aura-stat{border:1px solid #223040;background:#0d141d;border-radius:9px;padding:8px 9px}.aura-stat span{display:block;color:#6f7e90;font-size:8px;text-transform:uppercase;letter-spacing:.07em}.aura-stat b{display:block;color:#cfeee8;font-size:17px;line-height:1.1;margin-top:3px}.aura-stat small{display:block;color:#8593a4;font-size:8px;margin-top:3px}.aura-stat.boosted{border-color:#355e5a;background:rgba(135,216,202,.06)}.aura-scope{margin-top:7px;border:1px solid #223040;background:#0b1119;border-radius:9px;padding:8px 9px}.aura-scope span{display:block;color:#6f7e90;font-size:8px;text-transform:uppercase;letter-spacing:.07em;margin-bottom:4px}.aura-scope b{display:block;color:#b7c5d4;font-size:9px;font-weight:650;line-height:1.55}"
          s = replace_once(s, old_css, new_css, 'aura CSS')

          s = re.sub(
              r"\.library-tabs\{.*?\.library-mode-note b\{color:#b6c2cf\}",
              "",
              s,
              count=1,
              flags=re.S,
          )

          s = replace_once(s,
              "const state={cards:[],auras:[],abilities:{},thumbs:{},teams:Array.from({length:5},blankTeam),activeTeam:0,activeSlot:0,libraryMode:'cards',excludedCards:[],selectedPool:[],query:'',runs:15,cap:50000,seed:1000,running:false,runningLabel:'',workerReady:false};",
              "const state={cards:[],auras:[],abilities:{},thumbs:{},teams:Array.from({length:5},blankTeam),activeTeam:0,activeSlot:0,query:'',runs:15,cap:50000,seed:1000,running:false,runningLabel:'',workerReady:false};",
              'page state')

          old_aura = "function auraSummary(aura,border){if(!aura)return '';const value=auraValue(aura,border);if(aura.type==='Skill')return resolveStatText(aura.description,value);if(aura.name==='General Sun Tzu')return `All allied cards: <b>+${pct(value)}% HP</b>.`;const boost=Number(aura.boostMult)||0,pack=AURA_PACK[aura.name],weather=AURA_WEATHER[aura.name],listed=(aura.boostedCards||[]).filter(Boolean);let out=`All allied cards: <b>+${pct(value)}% HP & ATK</b>.`;if(boost){const scopes=[];if(pack)scopes.push(`${pack} Pack cards`);if(weather)scopes.push(`${weather} cards`);if(listed.length)scopes.push(listed.length<=3?listed.join(', '):`${listed.length} specifically boosted cards`);if(scopes.length)out+=` ${scopes.join(' + ')}: <b>+${pct(value*boost)}% HP & ATK</b>.`}return out}"
          new_aura = """function auraSummary(aura,border){
            if(!aura)return '';
            const value=auraValue(aura,border);
            if(aura.type==='Skill')return resolveStatText(aura.description,value);
            if(aura.name==='General Sun Tzu')return `<div class=\"aura-stat-grid\"><div class=\"aura-stat\"><span>All allied cards</span><b>+${pct(value)}%</b><small>HP</small></div></div>`;
            const boost=Number(aura.boostMult)||0,pack=AURA_PACK[aura.name],weather=AURA_WEATHER[aura.name],listed=(aura.boostedCards||[]).filter(Boolean),scopes=[];
            if(pack)scopes.push(`${pack} Pack cards`);
            if(weather)scopes.push(`${weather} cards`);
            for(const name of listed)if(!scopes.includes(name))scopes.push(name);
            let out=`<div class=\"aura-stat-grid\"><div class=\"aura-stat\"><span>All allied cards</span><b>+${pct(value)}%</b><small>HP & ATK</small></div>`;
            if(boost&&scopes.length)out+=`<div class=\"aura-stat boosted\"><span>Extra boost group</span><b>+${pct(value*boost)}%</b><small>HP & ATK</small></div>`;
            out+='</div>';
            if(boost&&scopes.length)out+=`<div class=\"aura-scope\"><span>Extra stat buff applies to</span><b>${scopes.map(esc).join(' · ')}</b></div>`;
            return out;
          }"""
          s = replace_once(s, old_aura, new_aura, 'aura summary')

          library_pattern = r'<article class="panel library">.*?</article><article class="panel simulation">'
          library_replacement = """<article class="panel library"><div class="panel-head"><div><span class="kicker">CARD LIBRARY</span><h3>Slot ${state.activeSlot+1}</h3></div><small>${shown.length} shown</small></div><input class="search" id="cardSearch" value="${esc(state.query)}" placeholder="Search card or ability…" autocomplete="off"><div class="library-list">${shown.length?shown.map(card=>`<button data-card="${esc(card.name)}" data-tooltip-card="${esc(card.name)}" class="${team.cards[state.activeSlot]?.cardName===card.name?'selected':''}">${portrait(card)}<span><b>${esc(card.name)}</b><small>${esc(card.ability||'No ability')}</small></span><em>1 / ${compact(card.rarity)}</em></button>`).join(''):'<div class="empty-state">No matching cards.</div>'}</div></article><article class="panel simulation">"""
          s, count = re.subn(library_pattern, library_replacement, s, count=1, flags=re.S)
          if count != 1:
              raise SystemExit('library panel anchor missing')

          filter_note = "${state.excludedCards.length||state.selectedPool.length?`<p><b>Calculator-only enemy filters:</b> ${state.excludedCards.length} excluded · ${state.selectedPool.length?`${state.selectedPool.length} selected-pool cards`:'normal game pool'}</p>`:''}"
          s = replace_once(s, filter_note, "", 'simulation filter note')

          bind_pattern = r"  function bindEvents\(\)\{.*?\}\n  function bindTooltips"
          bind_new = """  function bindEvents(){root.querySelectorAll('[data-team-tab]').forEach(el=>el.addEventListener('click',()=>{state.activeTeam=Number(el.dataset.teamTab);state.activeSlot=0;persist();render()}));root.querySelector('[data-duplicate]')?.addEventListener('click',()=>{const dst=(state.activeTeam+1)%5,src=current();state.teams[dst]={...blankTeam(),cards:src.cards.map(s=>({cardName:s.cardName,borders:[...s.borders]})),statAura:src.statAura,statAuraBorder:src.statAuraBorder,abilityAura:src.abilityAura,abilityAuraBorder:src.abilityAuraBorder};state.activeTeam=dst;state.activeSlot=0;persist();render()});root.querySelector('[data-copy-team]')?.addEventListener('click',async()=>{const code=encodeTeam(current());try{await navigator.clipboard.writeText(code);const button=root.querySelector('[data-copy-team]');if(button){button.textContent='Copied!';setTimeout(()=>{if(button.isConnected)button.textContent='Copy code'},900)}}catch(_){prompt('Copy this team code:',code)}});root.querySelector('[data-import-team]')?.addEventListener('click',()=>{const code=prompt('Paste a CRE1 team code:');if(!code)return;try{state.teams[state.activeTeam]=decodeTeam(code);state.activeSlot=0;persist();render()}catch(error){alert(`Could not import team: ${error.message||error}`)}});root.querySelector('[data-clear-team]')?.addEventListener('click',()=>{state.teams[state.activeTeam]=blankTeam();state.activeSlot=0;persist();render()});root.querySelector('[data-clear-results]')?.addEventListener('click',()=>{state.teams.forEach(t=>{t.result=null;t.elapsedMs=0;t.lastError=''});render()});root.querySelectorAll('[data-slot]').forEach(el=>el.addEventListener('click',e=>{if(e.target.closest('[data-border]'))return;state.activeSlot=Number(el.dataset.slot);render()}));root.querySelectorAll('[data-border]').forEach(el=>el.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();const slot=current().cards[Number(el.dataset.borderSlot)],b=el.dataset.border;slot.borders=slot.borders.includes(b)?slot.borders.filter(x=>x!==b):[...slot.borders,b];current().result=null;persist();render()}));root.querySelectorAll('[data-card]').forEach(el=>el.addEventListener('click',()=>{current().cards[state.activeSlot].cardName=el.dataset.card;current().result=null;persist();render()}));const search=root.querySelector('#cardSearch');search?.addEventListener('input',()=>{state.query=search.value;render();requestAnimationFrame(()=>{const n=root.querySelector('#cardSearch');n?.focus();n?.setSelectionRange(n.value.length,n.value.length)})});root.querySelectorAll('[data-aura-select]').forEach(el=>el.addEventListener('change',()=>{current()[el.dataset.auraSelect]=el.value;current().result=null;persist();render()}));root.querySelectorAll('[data-aura-border]').forEach(el=>el.addEventListener('click',()=>{current()[el.dataset.auraBorderKey]=el.dataset.auraBorder;current().result=null;persist();render()}));root.querySelectorAll('[data-runs]').forEach(el=>el.addEventListener('click',()=>{state.runs=Number(el.dataset.runs);persist();render()}));root.querySelector('#capInput')?.addEventListener('change',e=>{state.cap=Math.min(50000,Math.max(1,Number(e.target.value)||50000));persist();render()});root.querySelector('#seedInput')?.addEventListener('change',e=>{state.seed=Number(e.target.value)||1;persist();render()});root.querySelector('[data-run-active]')?.addEventListener('click',()=>runTeams([state.activeTeam]));root.querySelector('[data-run-ready]')?.addEventListener('click',()=>runTeams(state.teams.map((t,i)=>complete(t)?i:-1).filter(i=>i>=0)))}
          function bindTooltips"""
          s, count = re.subn(bind_pattern, bind_new, s, count=1, flags=re.S)
          if count != 1:
              raise SystemExit('bindEvents anchor missing')

          s = replace_once(s,
              ",seed:state.seed>>>0,excludedCardNames:[...state.excludedCards],selectedCardNames:[...state.selectedPool]",
              ",seed:state.seed>>>0",
              'worker UI payload')

          # Old saved filter values are deliberately ignored and removed on next save.
          s = replace_once(s,
              ",seed:state.seed,excludedCards:state.excludedCards,selectedPool:state.selectedPool",
              ",seed:state.seed",
              'persisted filter values')
          s = re.sub(
              r";state\.excludedCards=Array\.isArray\(s\.excludedCards\).*?;state\.selectedPool=Array\.isArray\(s\.selectedPool\).*?:\[\]",
              "",
              s,
              count=1,
          )

          if any(token in s for token in ['data-library-mode', 'state.libraryMode', 'state.excludedCards', 'state.selectedPool']):
              raise SystemExit('Custom Bans/Pool UI references still remain')
          p.write_text(s)

      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - run: npm run test:engine
      - run: npm run test:depths
      - run: npm run test:player

      - name: Bundle current browser worker
        run: npx esbuild src/browser-worker.ts --bundle --platform=browser --format=iife --target=es2020 --minify --outfile=browser/depths-worker.js

      - name: Validate live page JavaScript and fixed Depths exclusions
        run: |
          node <<'NODE'
          const fs = require('fs')
          const html = fs.readFileSync('index.html', 'utf8')
          const scripts = [...html.matchAll(/<script>([\s\S]*?)<\/script>/g)].map((m) => m[1])
          if (!scripts.length) throw new Error('No inline live-page script found')
          for (const script of scripts) new Function(script)
          for (const bad of ['data-library-mode', 'selectedPool', 'excludedCards']) {
            if (html.includes(bad)) throw new Error(`Removed enemy-filter UI still present: ${bad}`)
          }
          if (!html.includes('Extra stat buff applies to')) throw new Error('Stat Aura scope details missing')
          const depths = fs.readFileSync('src/engine/depths.ts', 'utf8')
          for (const name of ['Samurai','Seraphim','Vampire Lord','Loki','Fuxi','Parallax','Nán Fāng Zhū Què','Brachiosaurus','Jersey Devil']) {
            if (!depths.includes(`'${name}'`)) throw new Error(`Fixed Depths exclusion missing: ${name}`)
          }
          console.log('Live page and fixed Depths exclusion checks passed.')
          NODE

      - name: Commit cleanup
        run: |
          rm .github/workflows/apply-fixed-depths-and-aura-ui.yml
          git config user.name "Drago"
          git config user.email "dragoidc3@gmail.com"
          git add -A
          git commit -m "Use fixed Depths exclusions and improve Stat Aura details"
          git push
