name: Apply Fuxi Shuten Fix

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply-fuxi-shuten-fix.mjs'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply source corrections
        run: node scripts/apply-fuxi-shuten-fix.mjs
      - name: Run full checks
        run: npm run check
      - name: Build browser workers
        run: npm run build:workers
      - name: Remove one-time migration files
        run: rm -f scripts/apply-fuxi-shuten-fix.mjs .github/workflows/apply-fuxi-shuten-fix.yml
      - name: Commit corrected engine and worker
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Fix Fuxi suppression and restore Shuten kill growth"
          git push
