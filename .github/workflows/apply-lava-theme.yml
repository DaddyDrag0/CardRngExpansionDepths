name: Apply Lava Theme

on:
  push:
    branches: [main]
    paths:
      - scripts/apply-lava-theme.mjs
      - .github/workflows/apply-lava-theme.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: node scripts/apply-lava-theme.mjs
      - run: npm ci
      - run: npm run check
      - name: Commit Lava theme integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html index-base.html src/styles.css
          if git diff --cached --quiet; then
            echo "No Lava integration changes to commit."
            exit 0
          fi
          git commit -m "Integrate Lava theme into calculator"
          git push
