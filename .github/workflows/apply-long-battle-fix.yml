name: Apply Long Battle Fix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-long-battle-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/fix-battle-cutoff.mjs
      - run: sed -i 's/battle.turns <= 2_000/battle.turns <= 100_000/' scripts/depths-regression.ts
      - run: npm install
      - run: npm run build
      - run: npm run test:engine
      - run: npm run test:depths
      - run: npm run test:player
      - run: npx esbuild src/browser-worker.ts --bundle --platform=browser --format=iife --target=es2020 --minify --outfile=browser/depths-worker.js
      - name: Commit validated files
        run: |
          rm .github/workflows/apply-long-battle-fix.yml .github/workflows/fix-battle-cutoff.yml scripts/fix-battle-cutoff.mjs
          git config user.name "Drago"
          git config user.email "dragoidc3@gmail.com"
          git add -A
          git commit -m "Correct long battle handling and Fate support"
          git push
