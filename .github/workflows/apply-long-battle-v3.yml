name: Apply Final Long Battle Correction

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-long-battle-v3.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/fix-battle-cutoff.mjs
      - name: Separate test and live battle ceilings
        run: |
          node <<'NODE'
          const fs = require('fs')

          let battle = fs.readFileSync('src/engine/battle-v2.ts', 'utf8')
          battle = battle.replace("const MAX_BATTLE_TURNS = 100_000\n", '')
          battle = battle.replace(
            "export function simulateBattleV2(loadout: TeamLoadout, enemies: DepthsEnemy[], seed = 1): BattleResult {",
            "export function simulateBattleV2(\n  loadout: TeamLoadout,\n  enemies: DepthsEnemy[],\n  seed = 1,\n  maxTurns = 2_000,\n  markTurnCap = false,\n): BattleResult {",
          )
          battle = battle.replace('state.turn < MAX_BATTLE_TURNS', 'state.turn < maxTurns')
          battle = battle.replace(
            "if (state.turn >= MAX_BATTLE_TURNS && state.teams.Allies.length && state.teams.Enemies.length)",
            "if (markTurnCap && state.turn >= maxTurns && state.teams.Allies.length && state.teams.Enemies.length)",
          )
          fs.writeFileSync('src/engine/battle-v2.ts', battle)

          let simulation = fs.readFileSync('src/engine/simulation.ts', 'utf8')
          simulation = simulation.replace(
            "  seed?: number\n}",
            "  seed?: number\n  battleTurnCap?: number\n}",
          )
          simulation = simulation.replace(
            "const battle = simulateBattleV2(loadout, enemies, floorSeed ^ 0x51ed270b)",
            "const battleTurnCap = Math.max(1, Math.floor(options.battleTurnCap ?? 100_000))\n    const battle = simulateBattleV2(loadout, enemies, floorSeed ^ 0x51ed270b, battleTurnCap, true)",
          )
          simulation = simulation.replace(
            "      seed: runSeed,\n",
            "      seed: runSeed,\n      battleTurnCap: options.battleTurnCap,\n",
          )
          fs.writeFileSync('src/engine/simulation.ts', simulation)

          let regression = fs.readFileSync('scripts/depths-regression.ts', 'utf8')
          regression = regression.replace(
            "const batchOptions = { runs: 3, startFloor: 1, floorCap: 20, seed: 98_765 }",
            "const batchOptions = { runs: 3, startFloor: 1, floorCap: 20, seed: 98_765, battleTurnCap: 2_000 }",
          )
          regression = regression.replace(
            "const highFloor = simulateDepthsRun(runLoadout, { startFloor: 1_000, floorCap: 1_002, seed: 246_810 })",
            "const highFloor = simulateDepthsRun(runLoadout, { startFloor: 1_000, floorCap: 1_002, seed: 246_810, battleTurnCap: 2_000 })",
          )
          fs.writeFileSync('scripts/depths-regression.ts', regression)
          NODE
      - run: npm install
      - run: npm run build
      - run: npm run test:engine
      - run: npm run test:depths
      - run: npm run test:player
      - name: Validate corrected mechanics
        run: |
          if grep -q 'samePairTurns' src/engine/battle-v2.ts; then exit 1; fi
          grep -q 'battleTurnCap ?? 100_000' src/engine/simulation.ts
          grep -q 'battleTurnCap: 2_000' scripts/depths-regression.ts
          grep -q "DIRECT_SKILL_BOOST_KEYS\[aura.name\]" src/engine/auras.ts
      - run: npx esbuild src/browser-worker.ts --bundle --platform=browser --format=iife --target=es2020 --minify --outfile=browser/depths-worker.js
      - name: Commit validated correction
        run: |
          rm -f .github/workflows/apply-long-battle-v3.yml .github/workflows/apply-long-battle-v2.yml .github/workflows/apply-long-battle-fix.yml .github/workflows/fix-battle-cutoff.yml scripts/fix-battle-cutoff.mjs
          git config user.name "Drago"
          git config user.email "dragoidc3@gmail.com"
          git add -A
          git commit -m "Correct long battle handling and Fate support"
          git push
