name: Apply Manga Update

on:
  push:
    branches: [main]
    paths:
      - scripts/apply-manga-update.mjs
      - scripts/apply-manga-support.mjs
      - .github/workflows/apply-manga-update.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: node scripts/apply-manga-update.mjs
      - run: node scripts/apply-manga-support.mjs
      - run: npm ci
      - run: npm run check
      - run: npm run build:workers
      - name: Commit Manga update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No Manga update changes to commit."
            exit 0
          fi
          git commit -m "Apply Manga weather gameplay update"
          git push
