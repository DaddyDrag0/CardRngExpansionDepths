name: Apply Parallax Limit

on:
  push:
    branches: [agent/tower-parallax-limit]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/tower-parallax-limit
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/patch-parallax-limit.mjs
      - run: npm run build:workers
      - run: npm run check
      - name: Commit final tested tree
        run: |
          rm -f .github/workflows/apply-parallax-limit.yml scripts/patch-parallax-limit.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Limit Tower cheese Parallax copies"
          git push origin HEAD:agent/tower-parallax-limit
