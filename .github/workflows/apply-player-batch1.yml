name: Apply Player Ability Batch 1

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-player-batch1.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Queue first selectable player ability batch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: python -m py_compile scripts/apply-player-batch1.py
      - run: python scripts/apply-player-batch1.py
      - run: npm install
      - run: npm run build
      - run: npm run test:engine
      - run: npm run test:depths
      - run: npm run test:player
      - name: Remove one-time patch files and commit
        run: |
          rm .github/workflows/apply-player-batch1.yml scripts/apply-player-batch1.py
          git config user.name "Drago"
          git config user.email "dragoidc3@gmail.com"
          git add -A
          git commit -m "Port first selectable player ability batch"
          git push
