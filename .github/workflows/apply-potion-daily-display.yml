name: Apply daily potion reward display

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-potion-daily-display.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: python3 scripts/apply-potion-daily-display.py
      - run: npm ci
      - run: npm run test:ui
      - name: Publish update
        run: |
          printf '{"version":"%s"}\n' "$(date -u +%Y%m%d-%H%M%SZ)" > site-version.json
          rm .github/workflows/apply-potion-daily-display.yml scripts/apply-potion-daily-display.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Show daily potion reward estimates"
          git pull --rebase origin main
          git push origin HEAD:main
