name: Run Depths potion rewards patch

on:
  push:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: python3 scripts/fix-potion-patch.py
      - run: python3 scripts/apply-depths-potion-rewards.py
      - run: npm ci
      - run: npm run build:workers
      - name: Commit potion reward support
        run: |
          rm -f .github/workflows/apply-potions-now.yml .github/workflows/apply-depths-potion-rewards.yml scripts/apply-depths-potion-rewards.py scripts/fix-potion-patch.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add Depths potion reward estimates"
          git pull --rebase origin main
          git push origin HEAD:main
