name: Apply Live Progress UI

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-progress-ui.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/apply-progress-ui-once.mjs
      - run: npm install
      - run: npm run build
      - run: npm run test:engine
      - run: npm run test:depths
      - run: npm run test:player
      - name: Validate progress UI
        run: |
          node -e "const fs=require('fs');const h=fs.readFileSync('index.html','utf8');new Function([...h.matchAll(/<script>([\s\S]*?)<\/script>/g)][0][1]);if(!h.includes('data-cancel-run')||!h.includes(\"e.data.kind==='progress'\")||!h.includes('[1,3,8,15,30,50]'))process.exit(1)"
      - name: Commit live page
        run: |
          rm .github/workflows/apply-progress-ui.yml scripts/add-progress-ui.mjs scripts/apply-progress-ui-once.mjs
          git config user.name "Drago"
          git config user.email "dragoidc3@gmail.com"
          git add index.html .github/workflows/apply-progress-ui.yml scripts/add-progress-ui.mjs scripts/apply-progress-ui-once.mjs
          git commit -m "Show live simulation floor progress and cancel"
          git push
