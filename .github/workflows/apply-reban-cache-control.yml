name: Apply reban and cache refresh update

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-reban-cache-control.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: python3 scripts/apply-reban-cache-control.py
      - run: npm ci
      - run: npm run check
      - run: npm run build:workers
      - name: Publish tested update
        run: |
          printf '{"version":"%s"}\n' "$(date -u +%Y%m%d-%H%M%SZ)" > site-version.json
          rm .github/workflows/apply-reban-cache-control.yml scripts/apply-reban-cache-control.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add legacy Depth reban toggle and site refresh control"
          git pull --rebase origin main
          git push origin HEAD:main
