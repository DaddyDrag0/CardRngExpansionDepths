name: Apply accent-insensitive card search

on:
  push:
    branches:
      - main
    paths:
      - scripts/apply-search-normalization.mjs
      - .github/workflows/apply-search-normalization.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/apply-search-normalization.mjs
      - run: npm run check
      - name: Publish tested search update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f scripts/apply-search-normalization.mjs .github/workflows/apply-search-normalization.yml
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Make card search accent insensitive"
          git pull --rebase origin main
          git push origin HEAD:main
