name: Apply Storm Spirit and Triceratops fix

on:
  push:
    branches: [fix-storm-triceratops]
    paths:
      - 'scripts/apply-storm-triceratops-fix.py'
      - '.github/workflows/apply-storm-triceratops-fix.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-storm-triceratops
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply battle fixes
        run: python3 scripts/apply-storm-triceratops-fix.py
      - run: npm ci
      - run: npm run check
      - name: Build browser workers
        run: npm run build:workers
      - name: Bump site version
        run: printf '{"version":"%s"}\n' "$(date -u +%Y%m%d-%H%M%SZ)" > site-version.json
      - name: Publish tested fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f scripts/apply-storm-triceratops-fix.py .github/workflows/apply-storm-triceratops-fix.yml
          git add -A
          git commit -m "Fix Storm Spirit kill proc and Triceratops overkill"
          git push origin HEAD:fix-storm-triceratops
