name: Apply Team Code Sharing UI

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-team-codes-ui.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Queue team code sharing UI'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add team export and import controls
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()

          css_old = ".text-button{border:0;background:transparent;color:#7e8c9e;font-size:10px;cursor:pointer;padding:4px}.text-button:hover{color:#c8d3df}"
          css_new = ".text-button{border:0;background:transparent;color:#7e8c9e;font-size:10px;cursor:pointer;padding:4px}.text-button:hover{color:#c8d3df}.panel-actions{display:flex;align-items:center;gap:5px;flex-wrap:wrap;justify-content:flex-end}.panel-actions .text-button{border:1px solid #243141;border-radius:8px;padding:5px 7px;background:#0b1119}.panel-actions .danger-lite{border-color:#3a2930;color:#9d7b83}"
          if css_old not in s:
              raise SystemExit('panel action CSS anchor not found')
          s = s.replace(css_old, css_new, 1)

          helper_anchor = "  const complete=team=>team.cards.length===4&&team.cards.every(slot=>Boolean(slot.cardName));"
          helper_new = '''  const complete=team=>team.cards.length===4&&team.cards.every(slot=>Boolean(slot.cardName));
          function encodeTeam(team){
            const payload={v:1,c:team.cards.map(slot=>[slot.cardName,[...slot.borders]]),s:[team.statAura,team.statAuraBorder],a:[team.abilityAura,team.abilityAuraBorder]};
            const bytes=new TextEncoder().encode(JSON.stringify(payload));
            let binary='';for(const byte of bytes)binary+=String.fromCharCode(byte);
            return 'CRE1-'+btoa(binary).replace(/=+$/,'').replace(/\+/g,'-').replace(/\//g,'_');
          }
          function decodeTeam(code){
            const clean=String(code||'').trim();if(!clean.startsWith('CRE1-'))throw new Error('Not a CRE1 team code');
            let raw=clean.slice(5).replace(/-/g,'+').replace(/_/g,'/');while(raw.length%4)raw+='=';
            const binary=atob(raw),bytes=Uint8Array.from(binary,ch=>ch.charCodeAt(0)),payload=JSON.parse(new TextDecoder().decode(bytes));
            if(payload.v!==1||!Array.isArray(payload.c)||payload.c.length!==4)throw new Error('Unsupported team code');
            const team=blankTeam();
            team.cards=payload.c.map(slot=>({cardName:String(slot?.[0]||''),borders:Array.isArray(slot?.[1])?slot[1].filter(border=>CARD_BORDERS.includes(border)):[]}));
            team.statAura=String(payload.s?.[0]||'');team.statAuraBorder=AURA_BORDERS.includes(payload.s?.[1])?payload.s[1]:'';
            team.abilityAura=String(payload.a?.[0]||'');team.abilityAuraBorder=AURA_BORDERS.includes(payload.a?.[1])?payload.a[1]:'';
            for(const slot of team.cards)if(slot.cardName&&!cardByName(slot.cardName))throw new Error(`Unknown card: ${slot.cardName}`);
            if(team.statAura&&!auraByName(team.statAura))throw new Error(`Unknown Stat Aura: ${team.statAura}`);
            if(team.abilityAura&&!auraByName(team.abilityAura))throw new Error(`Unknown Ability Aura: ${team.abilityAura}`);
            return team;
          }'''
          if helper_anchor not in s:
              raise SystemExit('complete helper anchor not found')
          s = s.replace(helper_anchor, helper_new, 1)

          head_old = '<div class="panel-head"><div><span class="kicker">LOADOUT</span><h3>Team ${state.activeTeam+1}</h3></div><button class="text-button" data-clear-team>Clear team</button></div>'
          head_new = '<div class="panel-head"><div><span class="kicker">LOADOUT</span><h3>Team ${state.activeTeam+1}</h3></div><div class="panel-actions"><button class="text-button" data-copy-team>Copy code</button><button class="text-button" data-import-team>Import code</button><button class="text-button danger-lite" data-clear-team>Clear team</button></div></div>'
          if head_old not in s:
              raise SystemExit('loadout heading anchor not found')
          s = s.replace(head_old, head_new, 1)

          bind_anchor = "root.querySelector('[data-clear-team]')?.addEventListener('click',()=>{state.teams[state.activeTeam]=blankTeam();state.activeSlot=0;persist();render()});"
          bind_new = """root.querySelector('[data-copy-team]')?.addEventListener('click',async()=>{const code=encodeTeam(current());try{await navigator.clipboard.writeText(code);const button=root.querySelector('[data-copy-team]');if(button){button.textContent='Copied!';setTimeout(()=>{if(button.isConnected)button.textContent='Copy code'},900)}}catch(_){prompt('Copy this team code:',code)}});root.querySelector('[data-import-team]')?.addEventListener('click',()=>{const code=prompt('Paste a CRE1 team code:');if(!code)return;try{state.teams[state.activeTeam]=decodeTeam(code);state.activeSlot=0;persist();render()}catch(error){alert(`Could not import team: ${error.message||error}`)}});root.querySelector('[data-clear-team]')?.addEventListener('click',()=>{state.teams[state.activeTeam]=blankTeam();state.activeSlot=0;persist();render()});"""
          if bind_anchor not in s:
              raise SystemExit('event binding anchor not found')
          s = s.replace(bind_anchor, bind_new, 1)

          p.write_text(s)
      - name: Validate live page JavaScript
        run: |
          node <<'NODE'
          const fs = require('fs')
          const html = fs.readFileSync('index.html', 'utf8')
          for (const match of html.matchAll(/<script>([\s\S]*?)<\/script>/g)) new Function(match[1])
          if (!html.includes('CRE1-') || !html.includes('data-copy-team') || !html.includes('data-import-team')) throw new Error('Team code UI incomplete')
          NODE
      - name: Commit team code UI
        run: |
          rm .github/workflows/apply-team-codes-ui.yml
          git config user.name "Drago"
          git config user.email "dragoidc3@gmail.com"
          git add -A
          git commit -m "Add shareable team codes"
          git push
