name: Apply Tower 100k Limit

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply-tower-100k.mjs'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Raise Tower floor cap
        run: node scripts/apply-tower-100k.mjs
      - name: Run checks
        run: npm run check
      - name: Remove one-time migration files
        run: rm -f scripts/apply-tower-100k.mjs .github/workflows/apply-tower-100k.yml
      - name: Publish Tower limit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Raise Tower floor limit to 100000"
          git pull --rebase origin main
          git push origin HEAD:main
