name: Apply turn-limit battle ending

on:
  push:
    paths:
      - 'scripts/apply-turn-limit-ending.mjs'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: node scripts/apply-turn-limit-ending.mjs
      - run: npm run build
      - run: npm run test:engine
      - run: npm run test:depths
      - run: npm run test:player
      - name: Bundle browser worker
        run: npx --no-install esbuild src/browser-worker.ts --bundle --format=iife --platform=browser --target=es2020 --minify --outfile=browser/depths-worker.js
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src browser/depths-worker.js index.html scripts/engine-smoke.ts scripts/stall-regression.ts
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "End battles on turn limit and report culprit enemies"
            git push
          fi
