name: Apply Turn Timing Calibration

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply-turn-timing-calibration.mjs'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply timing calibration and sequencing regressions
        run: node scripts/apply-turn-timing-calibration.mjs
      - name: Run full checks
        run: npm run check
      - name: Rebuild browser workers
        run: npm run build:workers
      - name: Remove one-time migration files
        run: rm -f scripts/apply-turn-timing-calibration.mjs .github/workflows/apply-turn-timing-calibration.yml
      - name: Commit calibrated simulator
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Calibrate Depths run time and lock turn sequencing"
          git push
