name: Calibrate Depths delay to 0.85s

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/calibrate-depths-delay-085.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply 0.85s calibration
        run: |
          node - <<'NODE'
          const fs = require('fs')
          let time = fs.readFileSync('src/engine/depths-time.ts','utf8')
          time = time.replace('currently set to 0.75 seconds per', 'currently set to 0.85 seconds per')
          time = time.replace('INTER_FLOOR_OVERHEAD_SECONDS = 0.75', 'INTER_FLOOR_OVERHEAD_SECONDS = 0.85')
          fs.writeFileSync('src/engine/depths-time.ts', time)

          let test = fs.readFileSync('scripts/depths-time-regression.ts','utf8')
          test = test.replace("estimateBattleSeconds(1, 1, true), 1.15", "estimateBattleSeconds(1, 1, true), 1.25")
          fs.writeFileSync('scripts/depths-time-regression.ts', test)
          NODE
      - run: npm run check
      - run: npm run build:workers
      - name: Publish tested calibration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/calibrate-depths-delay-085.yml
          git add -A
          git commit -m "Calibrate Depths floor delay to 0.85s"
          git pull --rebase origin main
          git push origin HEAD:main
