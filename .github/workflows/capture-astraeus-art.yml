name: Capture Astraeus Art

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/capture-astraeus-art.yml

permissions:
  contents: write

jobs:
  capture:
    if: github.event.head_commit.message == 'Capture Astraeus card art'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download thumbnail
        run: |
          mkdir -p debug
          JSON=$(curl -fsSL 'https://thumbnails.roblox.com/v1/assets?assetIds=98285077991323&returnPolicy=PlaceHolder&size=420x420&format=Png&isCircular=false')
          echo "$JSON"
          URL=$(python -c 'import json,sys; print(json.load(sys.stdin)["data"][0]["imageUrl"])' <<< "$JSON")
          curl -fsSL "$URL" -o debug/astraeus.png
          file debug/astraeus.png
      - name: Commit card art for inspection
        run: |
          rm .github/workflows/capture-astraeus-art.yml
          git config user.name "Drago"
          git config user.email "dragoidc3@gmail.com"
          git add debug/astraeus.png .github/workflows/capture-astraeus-art.yml
          git commit -m "Temporarily capture Astraeus art"
          git push
