name: Compare Floor 80 cheese

on:
  push:
    paths:
      - '.github/workflows/compare-floor80-cheese.yml'
      - 'scripts/compare-floor80-cheese.ts'

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx tsx scripts/compare-floor80-cheese.ts
