name: Complete ability tracing

on:
  push:
    paths:
      - 'scripts/complete-ability-tracing.py'
      - '.github/workflows/complete-ability-tracing.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install --no-audit --no-fund
      - name: Apply completion patch
        run: python3 scripts/complete-ability-tracing.py
      - name: Typecheck/build
        run: npm run build
      - name: Engine regressions
        run: npm run test:engine
      - name: Depths regressions
        run: npm run test:depths
      - name: Player coverage
        run: npm run test:player
      - name: Rebuild browser worker
        run: npx --no-install esbuild src/browser-worker.ts --bundle --format=iife --platform=browser --target=es2020 --minify --outfile=browser/depths-worker.js
      - name: Commit tracing completion
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/engine/battle-v2.ts browser/depths-worker.js
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
          else
            git commit -m "Complete battle ability interaction tracing"
            git push
          fi
