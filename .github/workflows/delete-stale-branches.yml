name: Delete Stale Temporary Branches

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/delete-stale-branches.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Delete stale temporary branches
        shell: bash
        run: |
          for branch in \
            ci-cleanup-temp \
            debug-stall-983450096 \
            fix-beyond-grave-loop \
            pair-fix-temp \
            pair-fix-v2 \
            remove-live-battle-cap \
            restore-ci-after-pair
          do
            if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
              git push origin --delete "$branch"
            fi
          done
