name: Use observed Depth range capped at 10 percent

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/depth-range-capped-observed.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Patch Depth range logic
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p=Path('src/engine/simulation.ts')
          s=p.read_text()
          s=s.replace("import { auraPackRangeForMedian } from './depths-rewards'", "import { auraPacksForDepth } from './depths-rewards'")

          anchor="""  const estimate = auraPackRangeForMedian(medianFloor)
"""
          replacement="""  const observedMinFloor = floors[0]
  const observedMaxFloor = floors[floors.length - 1]
  const medianDepth = Math.max(1, Math.round(medianFloor))
  const tenPercentLow = Math.max(1, Math.round(medianFloor * 0.9))
  const tenPercentHigh = Math.max(1, Math.round(medianFloor * 1.1))
  const estimatedFloorLow = Math.max(observedMinFloor, tenPercentLow)
  const estimatedFloorHigh = Math.min(observedMaxFloor, tenPercentHigh)
  const estimate = {
    low: estimatedFloorLow,
    high: estimatedFloorHigh,
    medianDepth,
    auraPackLow: auraPacksForDepth(estimatedFloorLow),
    auraPackMedian: auraPacksForDepth(medianDepth),
    auraPackHigh: auraPacksForDepth(estimatedFloorHigh),
  }
"""
          if anchor not in s:
              raise SystemExit('Depth estimate anchor missing')
          s=s.replace(anchor,replacement,1)

          insert_anchor="""export type DepthsProgressCallback = (floor: number, battleTurn?: number, enemyNames?: string[]) => void
"""
          helper="""

export function cappedObservedDepthRange(
  observedMinFloor: number,
  observedMaxFloor: number,
  medianFloor: number,
  cap = 0.10,
): { low: number; high: number } {
  const median = Math.max(1, Number(medianFloor) || 1)
  const safeCap = Math.max(0, Number(cap) || 0)
  const minFloor = Math.max(1, Math.round(Number(observedMinFloor) || 1))
  const maxFloor = Math.max(minFloor, Math.round(Number(observedMaxFloor) || minFloor))
  const capLow = Math.max(1, Math.round(median * (1 - safeCap)))
  const capHigh = Math.max(1, Math.round(median * (1 + safeCap)))
  return {
    low: Math.max(minFloor, capLow),
    high: Math.min(maxFloor, capHigh),
  }
}
"""
          if 'export function cappedObservedDepthRange(' not in s:
              if insert_anchor not in s:
                  raise SystemExit('helper insertion anchor missing')
              s=s.replace(insert_anchor,insert_anchor+helper,1)

          # Use the helper in the batch logic so the tested rule is the production rule.
          old="""  const observedMinFloor = floors[0]
  const observedMaxFloor = floors[floors.length - 1]
  const medianDepth = Math.max(1, Math.round(medianFloor))
  const tenPercentLow = Math.max(1, Math.round(medianFloor * 0.9))
  const tenPercentHigh = Math.max(1, Math.round(medianFloor * 1.1))
  const estimatedFloorLow = Math.max(observedMinFloor, tenPercentLow)
  const estimatedFloorHigh = Math.min(observedMaxFloor, tenPercentHigh)
"""
          new="""  const observedMinFloor = floors[0]
  const observedMaxFloor = floors[floors.length - 1]
  const medianDepth = Math.max(1, Math.round(medianFloor))
  const cappedRange = cappedObservedDepthRange(observedMinFloor, observedMaxFloor, medianFloor, 0.10)
  const estimatedFloorLow = cappedRange.low
  const estimatedFloorHigh = cappedRange.high
"""
          if old not in s:
              raise SystemExit('helper usage anchor missing')
          s=s.replace(old,new,1)
          p.write_text(s)

          test=Path('scripts/depth-range-regression.ts')
          test.write_text("""import { cappedObservedDepthRange } from '../src/engine/simulation'\n\nfunction assert(condition: unknown, message: string): asserts condition {\n  if (!condition) throw new Error(message)\n}\n\n{\n  const range = cappedObservedDepthRange(42_100, 48_300, 45_000)\n  assert(range.low === 42_100 && range.high === 48_300, `Expected natural observed range, got ${range.low}-${range.high}`)\n}\n\n{\n  const range = cappedObservedDepthRange(29_000, 48_300, 45_000)\n  assert(range.low === 40_500 && range.high === 48_300, `Expected low side capped at -10%, got ${range.low}-${range.high}`)\n}\n\n{\n  const range = cappedObservedDepthRange(29_000, 60_000, 45_000)\n  assert(range.low === 40_500 && range.high === 49_500, `Expected both sides capped at ±10%, got ${range.low}-${range.high}`)\n}\n\n{\n  const range = cappedObservedDepthRange(44_100, 45_700, 45_000)\n  assert(range.low === 44_100 && range.high === 45_700, `Expected tight observed range unchanged, got ${range.low}-${range.high}`)\n}\n\nconsole.log('Capped observed Depth range regression passed.')\n""")

          pkg=Path('package.json')
          ps=pkg.read_text()
          old='tsx scripts/watchdog-heartbeat-regression.ts'
          new='tsx scripts/watchdog-heartbeat-regression.ts && tsx scripts/depth-range-regression.ts'
          if new not in ps:
              if old not in ps:
                  raise SystemExit('package test anchor missing')
              ps=ps.replace(old,new,1)
          pkg.write_text(ps)

          Path('site-version.json').write_text('{"version":"20260907-depth-range-observed-cap10"}\n')
          PY
      - name: Validate and build
        run: |
          npm run check
          npm run test:video-game
          npm run build:workers
          grep -q "cappedObservedDepthRange(observedMinFloor, observedMaxFloor, medianFloor, 0.10)" src/engine/simulation.ts
          grep -q "Capped observed Depth range regression passed" scripts/depth-range-regression.ts
      - name: Publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/depth-range-capped-observed.yml
          git add -A
          git commit -m "Use observed Depth range capped at 10 percent"
          git pull --rebase origin main
          git push origin HEAD:main
