name: Diagnose Decapitate scaling

on:
  push:
    paths:
      - 'scripts/diagnose-decapitate.mjs'

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: node scripts/diagnose-decapitate.mjs
      - run: npx --no-install tsx scripts/diagnose-decapitate.ts
