name: Diagnose Shuten v2

on:
  push:
    paths:
      - 'scripts/diagnose-shuten-v2.mjs'

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: node scripts/diagnose-shuten-v2.mjs
