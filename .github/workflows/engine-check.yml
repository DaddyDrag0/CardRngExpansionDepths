name: Engine Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref_name }}
      - name: Apply and publish daily potion display
        if: github.event_name == 'pull_request'
        run: |
          if [ ! -f scripts/apply-potion-daily-display.py ]; then
            echo "Patch already applied."
            exit 0
          fi
          python3 scripts/apply-potion-daily-display.py
          printf '{"version":"%s"}\n' "$(date -u +%Y%m%d-%H%M%SZ)" > site-version.json
          rm -f .github/workflows/apply-potion-daily-display.yml scripts/apply-potion-daily-display.py .daily-potion-trigger
          git show 1e06d1e92818357f26cc4fd7904abff6ee0e0c0a:.github/workflows/engine-check.yml > .github/workflows/engine-check.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Show daily potion reward estimates"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
