name: Engine Check

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply faster Tower search update
        run: python3 scripts/apply-faster-tower-search.py
      - run: npm ci
      - run: npm run check
      - name: Build browser workers
        run: npm run build:workers
      - name: Publish tested Tower search update
        run: |
          printf '{"version":"%s"}\n' "$(date -u +%Y%m%d-%H%M%SZ)" > site-version.json
          rm -f scripts/apply-faster-tower-search.py
          git show origin/main:.github/workflows/engine-check.yml > .github/workflows/engine-check.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Speed up intensive Tower search and add custom card pool"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
