name: Engine Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Build browser workers
        run: npm run build:workers
      - name: Apply one-time Scarlet droplet correction
        if: github.event_name == 'push'
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import datetime, json

          css_path = Path('src/styles.css')
          css = css_path.read_text()
          marker = '/* SCARLET BLOOD RAIN V2 */'
          if marker not in css:
              raise SystemExit('Could not locate Scarlet V2 rain block')

          css = css.split(marker, 1)[0].rstrip() + r'''

/* SCARLET BLOOD DROPLETS V3 */
html[data-theme="scarlet"] body::before{
  content:"";
  position:fixed;
  inset:-220px -80px -220px;
  z-index:0;
  pointer-events:none;
  opacity:.72;
  background-image:
    radial-gradient(ellipse at 50% 42%,rgba(202,16,49,.92) 0 4px,rgba(118,0,23,.8) 4.5px,transparent 6px),
    radial-gradient(ellipse at 50% 44%,rgba(157,2,31,.88) 0 3px,rgba(104,0,19,.75) 3.5px,transparent 5px),
    radial-gradient(ellipse at 50% 40%,rgba(223,30,60,.85) 0 5px,rgba(126,0,26,.74) 5.5px,transparent 7px),
    radial-gradient(ellipse at 50% 43%,rgba(177,6,38,.9) 0 3.5px,rgba(109,0,20,.76) 4px,transparent 5.5px),
    radial-gradient(ellipse at 50% 41%,rgba(193,10,44,.87) 0 4.5px,rgba(117,0,22,.76) 5px,transparent 6.5px),
    radial-gradient(ellipse at 50% 45%,rgba(149,0,28,.88) 0 3px,rgba(94,0,17,.74) 3.5px,transparent 5px),
    radial-gradient(ellipse at 50% 40%,rgba(214,22,55,.88) 0 5px,rgba(124,0,24,.74) 5.5px,transparent 7px),
    radial-gradient(ellipse at 50% 43%,rgba(168,4,35,.9) 0 3.5px,rgba(103,0,19,.75) 4px,transparent 5.5px),
    radial-gradient(ellipse at 50% 42%,rgba(188,8,42,.88) 0 4px,rgba(112,0,21,.74) 4.5px,transparent 6px),
    radial-gradient(ellipse at 50% 41%,rgba(227,34,65,.82) 0 5.5px,rgba(132,0,27,.72) 6px,transparent 7.5px);
  background-size:83px 137px,127px 191px,173px 229px,109px 163px,149px 211px,197px 263px,137px 181px,229px 307px,101px 151px,181px 241px;
  background-position:11px -43px,57px -121px,103px -177px,31px -79px,88px -149px,144px -217px,69px -101px,176px -263px,22px -61px,119px -189px;
  filter:drop-shadow(0 0 3px rgba(98,0,18,.38));
  animation:blood-droplets-a 7.4s linear infinite;
}
html[data-theme="scarlet"] body::after{
  content:"";
  position:fixed;
  inset:-260px -100px -260px;
  z-index:0;
  pointer-events:none;
  opacity:.58;
  background-image:
    radial-gradient(ellipse at 50% 43%,rgba(137,0,24,.9) 0 3px,rgba(86,0,15,.72) 3.5px,transparent 5px),
    radial-gradient(ellipse at 50% 41%,rgba(199,13,47,.86) 0 4.5px,rgba(113,0,22,.72) 5px,transparent 6.5px),
    radial-gradient(ellipse at 50% 45%,rgba(158,2,31,.88) 0 3.5px,rgba(96,0,18,.72) 4px,transparent 5.5px),
    radial-gradient(ellipse at 50% 40%,rgba(219,26,59,.82) 0 5px,rgba(126,0,25,.7) 5.5px,transparent 7px),
    radial-gradient(ellipse at 50% 44%,rgba(146,0,27,.9) 0 3px,rgba(90,0,16,.73) 3.5px,transparent 5px),
    radial-gradient(ellipse at 50% 42%,rgba(185,8,40,.87) 0 4px,rgba(108,0,20,.72) 4.5px,transparent 6px),
    radial-gradient(ellipse at 50% 41%,rgba(207,17,51,.84) 0 5px,rgba(119,0,23,.7) 5.5px,transparent 7px),
    radial-gradient(ellipse at 50% 44%,rgba(151,0,29,.89) 0 3.5px,rgba(93,0,17,.72) 4px,transparent 5.5px),
    radial-gradient(ellipse at 50% 40%,rgba(193,11,44,.86) 0 4px,rgba(112,0,21,.7) 4.5px,transparent 6px),
    radial-gradient(ellipse at 50% 43%,rgba(226,31,64,.8) 0 5px,rgba(130,0,26,.68) 5.5px,transparent 7px);
  background-size:113px 173px,157px 223px,89px 149px,211px 281px,139px 197px,181px 251px,101px 163px,239px 331px,167px 233px,127px 187px;
  background-position:43px -103px,91px -171px,17px -67px,163px -237px,66px -131px,124px -199px,29px -89px,197px -291px,81px -157px,51px -113px;
  animation:blood-droplets-b 10.6s linear infinite;
}
@keyframes blood-droplets-a{
  from{background-position:11px -43px,57px -121px,103px -177px,31px -79px,88px -149px,144px -217px,69px -101px,176px -263px,22px -61px,119px -189px}
  to{background-position:37px 731px,19px 807px,146px 695px,-12px 781px,127px 723px,96px 849px,111px 759px,132px 683px,55px 821px,81px 747px}
}
@keyframes blood-droplets-b{
  from{background-position:43px -103px,91px -171px,17px -67px,163px -237px,66px -131px,124px -199px,29px -89px,197px -291px,81px -157px,51px -113px}
  to{background-position:7px 843px,139px 757px,54px 891px,118px 709px,102px 811px,77px 739px,63px 867px,151px 681px,126px 793px,18px 829px}
}
@media(prefers-reduced-motion:reduce){
  html[data-theme="scarlet"] body::before,
  html[data-theme="scarlet"] body::after{animation:none}
}
''' + '\n'
          css_path.write_text(css)

          version = datetime.datetime.now(datetime.timezone.utc).strftime('%Y%m%d-%H%M%SZ')
          Path('site-version.json').write_text(json.dumps({'version': version}, separators=(',', ':')) + '\n')
          PY
      - name: Verify worker bundles on pull requests
        if: github.event_name == 'pull_request'
        run: git diff --exit-code -- browser/depths-worker.js browser/tower-worker.js
      - name: Commit one-time update and restore workflow
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git show HEAD^:.github/workflows/engine-check.yml > .github/workflows/engine-check.yml
          rm -f .github/workflows/update-scarlet-random-droplets.yml
          git add src/styles.css site-version.json .github/workflows/engine-check.yml .github/workflows/update-scarlet-random-droplets.yml browser/depths-worker.js browser/tower-worker.js
          git commit -m "Make Scarlet rain use scattered blood droplets"
          git pull --rebase origin main
          git push origin HEAD:main
