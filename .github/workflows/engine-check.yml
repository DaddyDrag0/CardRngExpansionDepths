name: Engine Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Guard Beyond The Grave resurrection loops
        if: github.event_name == 'push'
        run: |
          python <<'PY'
          from pathlib import Path
          p = Path('src/engine/battle-v2.ts')
          lines = p.read_text().splitlines()
          if any('beyondGraveChain' in line for line in lines):
              print('Beyond The Grave loop guard already present.')
          else:
              start = next((i for i, line in enumerate(lines) if line.strip() == 'for (const revenant of revenants) {'), None)
              if start is None:
                  raise SystemExit('Beyond The Grave loop start missing')
              end = next((i for i in range(start + 1, len(lines)) if lines[i].strip() == '}'), None)
              if end is None or not any('runtime.state.teams[team].unshift(revenant)' in line for line in lines[start:end + 1]):
                  raise SystemExit('Beyond The Grave loop end missing')
              indent = lines[start][:-len(lines[start].lstrip())]
              inner = indent + '  '
              replacement = [
                  indent + 'for (const revenant of revenants) {',
                  inner + '// Two Beyond The Grave cards can otherwise revive each other forever.',
                  inner + '// Carry a chain counter only when one Beyond The Grave holder revives another;',
                  inner + '// unrelated ally deaths reset the chain. Resolve the pathological cycle at',
                  inner + '// the same 150-turn scale used by the source battle timeout.',
                  inner + "const beyondGraveChain = abilityNames(card).includes('Beyond The Grave')",
                  inner + '  ? (card.counters.beyondGraveChain || 0) + 1',
                  inner + '  : 1',
                  inner + 'if (beyondGraveChain >= 150) continue',
                  inner + 'const fallenIndex = runtime.state.fallen[team].indexOf(revenant)',
                  inner + 'if (fallenIndex >= 0) runtime.state.fallen[team].splice(fallenIndex, 1)',
                  inner + 'revenant.dead = false',
                  inner + 'revenant.hp = revenant.maxHp * 0.5',
                  inner + 'revenant.entered = false',
                  inner + 'revenant.counters.beyondGraveChain = beyondGraveChain',
                  inner + 'runtime.state.teams[team].unshift(revenant)',
                  indent + '}',
              ]
              p.write_text('\n'.join(lines[:start] + replacement + lines[end + 1:]) + '\n')
              print('Applied Beyond The Grave loop guard.')
          PY
      - run: npm install
      - run: npm run build
      - run: npm run test:engine
      - run: npm run test:depths
      - run: npm run test:player
      - name: Validate live page JavaScript
        run: |
          node <<'NODE'
          const fs = require('fs')
          const html = fs.readFileSync('index.html', 'utf8')
          const scripts = [...html.matchAll(/<script>([\s\S]*?)<\/script>/g)].map((match) => match[1])
          if (!scripts.length) throw new Error('No inline live-page script found')
          for (const script of scripts) new Function(script)
          const requiredUiHooks = ["new Worker('./browser/depths-worker.js')", 'CRE1-', 'Most common losing-floor enemies', 'crypto.getRandomValues', 'Fresh random enemies every test']
          for (const hook of requiredUiHooks) if (!html.includes(hook)) throw new Error(`Missing live-page hook: ${hook}`)
          for (const removedHook of ['data-library-mode="bans"', 'data-library-mode="pool"', 'id="seedInput"']) if (html.includes(removedHook)) throw new Error(`Removed calculator-only control returned: ${removedHook}`)
          const workerSource = fs.readFileSync('src/browser-worker.ts', 'utf8')
          for (const removedField of ['excludedCardNames', 'selectedCardNames']) if (workerSource.includes(removedField)) throw new Error(`Removed calculator-only field returned: ${removedField}`)
          const battle = fs.readFileSync('src/engine/battle-v2.ts', 'utf8')
          if (!battle.includes('let turnsWithoutDeaths = 0')) throw new Error('Turns-without-deaths timeout state missing')
          if (!battle.includes('attacker !== lastMover && attacker !== lastTarget')) throw new Error('Source-aligned attacker timeout reset missing')
          if (!battle.includes('defender !== lastMover && defender !== lastTarget')) throw new Error('Source-aligned target timeout reset missing')
          if (!battle.includes('turnsWithoutDeaths >= 150')) throw new Error('Expansion 150-turn timeout missing')
          if (battle.includes('pairTurns[')) throw new Error('Incorrect per-attacker timeout counter returned')
          if (!battle.includes('beyondGraveChain')) throw new Error('Beyond The Grave loop guard missing')
          const styles = fs.readFileSync('src/styles.css', 'utf8')
          if (styles.includes('.aura-exact b{display:none!important}')) throw new Error('Resolved aura values are hidden')
          console.log(`Live page JavaScript parsed successfully (${scripts.length} inline script).`)
          NODE
      - name: Bundle browser simulation worker
        if: github.event_name == 'push'
        run: npx esbuild src/browser-worker.ts --bundle --platform=browser --format=iife --target=es2020 --minify --outfile=browser/depths-worker.js
      - name: Commit browser simulation bundle and validated engine fix
        if: github.event_name == 'push'
        run: |
          git config user.name "Drago"
          git config user.email "dragoidc3@gmail.com"
          git add browser/depths-worker.js src/engine/battle-v2.ts
          if git diff --cached --quiet; then
            echo "Browser bundle and engine unchanged."
            exit 0
          fi
          git commit -m "Prevent Beyond The Grave resurrection loops"
          git push
