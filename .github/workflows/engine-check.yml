name: Engine Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Build browser workers
        run: npm run build:workers
      - name: Apply one-time Scarlet blood rain update
        if: github.event_name == 'push'
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import datetime, json

          css_path = Path('src/styles.css')
          css = css_path.read_text()
          start_marker = 'html[data-theme="scarlet"] body::before{'
          end_marker = '@media(prefers-reduced-motion:reduce){html[data-theme="scarlet"] body::before{animation:none}}'
          start = css.find(start_marker)
          end_start = css.find(end_marker, start)
          if start < 0 or end_start < 0:
              raise SystemExit('Could not locate existing Scarlet droplet animation block')
          end = end_start + len(end_marker)

          rain = '''html[data-theme="scarlet"] body::before{content:"";position:fixed;inset:-260px 0 0;z-index:0;pointer-events:none;opacity:.78;background:linear-gradient(180deg,rgba(154,0,25,0) 0%,rgba(182,6,36,.42) 22%,rgba(135,0,23,.86) 72%,rgba(86,0,16,.98) 100%) 2% -210px/2px 240px repeat-y,linear-gradient(180deg,rgba(190,8,40,0) 0%,rgba(204,14,48,.48) 24%,rgba(139,0,26,.9) 76%,rgba(92,0,17,.98) 100%) 7% -80px/3px 190px repeat-y,linear-gradient(180deg,rgba(138,0,21,0) 0%,rgba(167,4,31,.45) 20%,rgba(118,0,21,.88) 70%,rgba(78,0,14,.96) 100%) 12% -170px/2px 210px repeat-y,linear-gradient(180deg,rgba(214,20,52,0) 0%,rgba(219,22,55,.45) 24%,rgba(147,0,28,.9) 74%,rgba(94,0,18,.98) 100%) 17% -120px/4px 260px repeat-y,linear-gradient(180deg,rgba(150,0,23,0) 0%,rgba(177,5,34,.42) 20%,rgba(121,0,22,.86) 72%,rgba(82,0,15,.96) 100%) 23% -240px/2px 220px repeat-y,linear-gradient(180deg,rgba(198,10,43,0) 0%,rgba(211,17,50,.46) 24%,rgba(143,0,26,.9) 72%,rgba(92,0,17,.98) 100%) 29% -90px/3px 205px repeat-y,linear-gradient(180deg,rgba(144,0,22,0) 0%,rgba(170,4,32,.44) 21%,rgba(119,0,21,.88) 72%,rgba(80,0,14,.97) 100%) 35% -185px/2px 235px repeat-y,linear-gradient(180deg,rgba(209,16,49,0) 0%,rgba(221,24,58,.46) 24%,rgba(150,0,29,.91) 74%,rgba(95,0,18,.98) 100%) 41% -130px/4px 270px repeat-y,linear-gradient(180deg,rgba(158,0,25,0) 0%,rgba(186,7,36,.43) 22%,rgba(126,0,23,.88) 72%,rgba(83,0,15,.97) 100%) 48% -225px/2px 215px repeat-y,linear-gradient(180deg,rgba(194,8,41,0) 0%,rgba(208,15,49,.46) 24%,rgba(140,0,26,.89) 74%,rgba(91,0,17,.98) 100%) 54% -105px/3px 200px repeat-y,linear-gradient(180deg,rgba(148,0,22,0) 0%,rgba(176,5,34,.44) 21%,rgba(121,0,22,.88) 72%,rgba(80,0,15,.97) 100%) 61% -255px/2px 245px repeat-y,linear-gradient(180deg,rgba(218,22,54,0) 0%,rgba(227,28,62,.46) 24%,rgba(152,0,29,.91) 74%,rgba(97,0,19,.98) 100%) 67% -140px/4px 280px repeat-y,linear-gradient(180deg,rgba(153,0,24,0) 0%,rgba(181,6,35,.43) 21%,rgba(124,0,23,.88) 72%,rgba(82,0,15,.97) 100%) 74% -205px/2px 225px repeat-y,linear-gradient(180deg,rgba(200,11,44,0) 0%,rgba(214,18,52,.46) 24%,rgba(144,0,27,.9) 74%,rgba(93,0,18,.98) 100%) 81% -115px/3px 210px repeat-y,linear-gradient(180deg,rgba(142,0,21,0) 0%,rgba(169,4,32,.44) 21%,rgba(117,0,21,.87) 72%,rgba(78,0,14,.97) 100%) 88% -235px/2px 240px repeat-y,linear-gradient(180deg,rgba(216,20,53,0) 0%,rgba(225,26,60,.45) 24%,rgba(150,0,29,.9) 74%,rgba(96,0,19,.98) 100%) 94% -100px/4px 265px repeat-y,linear-gradient(180deg,rgba(159,0,25,0) 0%,rgba(186,7,36,.43) 22%,rgba(126,0,23,.88) 72%,rgba(83,0,15,.97) 100%) 98% -190px/2px 220px repeat-y;filter:drop-shadow(0 0 3px rgba(120,0,18,.38));animation:blood-rain-fall 6.2s linear infinite}
html[data-theme="scarlet"] body::after{content:"";position:fixed;inset:-220px 0 0;z-index:0;pointer-events:none;opacity:.64;background-image:radial-gradient(ellipse at 3% 12%,rgba(142,0,22,.95) 0 3px,transparent 4px),radial-gradient(ellipse at 8% 34%,rgba(181,7,37,.92) 0 5px,transparent 6px),radial-gradient(ellipse at 15% 19%,rgba(151,0,24,.95) 0 4px,transparent 5px),radial-gradient(ellipse at 21% 47%,rgba(201,13,44,.9) 0 6px,transparent 7px),radial-gradient(ellipse at 28% 24%,rgba(133,0,20,.94) 0 5px,transparent 6px),radial-gradient(ellipse at 34% 39%,rgba(187,8,39,.92) 0 4px,transparent 5px),radial-gradient(ellipse at 42% 16%,rgba(158,0,26,.95) 0 6px,transparent 7px),radial-gradient(ellipse at 49% 51%,rgba(210,16,48,.9) 0 5px,transparent 6px),radial-gradient(ellipse at 57% 28%,rgba(141,0,22,.94) 0 4px,transparent 5px),radial-gradient(ellipse at 64% 43%,rgba(192,10,41,.92) 0 6px,transparent 7px),radial-gradient(ellipse at 72% 20%,rgba(151,0,24,.95) 0 5px,transparent 6px),radial-gradient(ellipse at 79% 48%,rgba(205,14,46,.9) 0 4px,transparent 5px),radial-gradient(ellipse at 86% 31%,rgba(136,0,21,.95) 0 6px,transparent 7px),radial-gradient(ellipse at 92% 14%,rgba(193,10,40,.92) 0 5px,transparent 6px),radial-gradient(ellipse at 97% 45%,rgba(156,0,25,.94) 0 4px,transparent 5px);background-size:100% 360px;animation:blood-rain-drops 4.8s linear infinite}
@keyframes blood-rain-fall{from{transform:translateY(-260px)}to{transform:translateY(260px)}}
@keyframes blood-rain-drops{from{transform:translateY(-220px)}to{transform:translateY(380px)}}
@media(prefers-reduced-motion:reduce){html[data-theme="scarlet"] body::before,html[data-theme="scarlet"] body::after{animation:none}}'''

          css_path.write_text(css[:start] + rain + css[end:])
          version = datetime.datetime.now(datetime.timezone.utc).strftime('%Y%m%d-%H%M%SZ')
          Path('site-version.json').write_text(json.dumps({'version': version}, separators=(',', ':')) + '\n')
          print('Scarlet blood rain applied; version', version)
          PY
      - name: Verify worker bundles on pull requests
        if: github.event_name == 'pull_request'
        run: git diff --exit-code -- browser/depths-worker.js browser/tower-worker.js
      - name: Commit one-time update and restore workflow
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git show HEAD^:.github/workflows/engine-check.yml > .github/workflows/engine-check.yml
          git add src/styles.css site-version.json .github/workflows/engine-check.yml browser/depths-worker.js browser/tower-worker.js
          if git diff --cached --quiet; then
            echo "Nothing changed."
            exit 0
          fi
          git commit -m "Make Scarlet theme use falling blood rain"
          git pull --rebase origin main
          git push origin HEAD:main
