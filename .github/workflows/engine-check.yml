name: Engine Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply daily potion display patch on PR
        if: github.event_name == 'pull_request'
        run: |
          if [ -f scripts/apply-potion-daily-display.py ]; then
            python3 scripts/apply-potion-daily-display.py
          else
            echo "Potion patch already applied."
          fi
      - run: npm ci
      - run: npm run check
      - name: Build browser workers
        run: npm run build:workers
      - name: Publish patch to PR branch
        if: github.event_name == 'pull_request'
        run: |
          if [ ! -f scripts/apply-potion-daily-display.py ]; then
            echo "Patch already published."
            exit 0
          fi
          printf '{"version":"%s"}\n' "$(date -u +%Y%m%d-%H%M%SZ)" > site-version.json
          rm -f .github/workflows/apply-potion-daily-display.yml scripts/apply-potion-daily-display.py .daily-potion-trigger
          git show 1e06d1e92818357f26cc4fd7904abff6ee0e0c0a:.github/workflows/engine-check.yml > .github/workflows/engine-check.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Show daily potion reward estimates"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
      - name: Commit worker bundles on main
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add browser/depths-worker.js browser/tower-worker.js
          if git diff --cached --quiet; then
            echo "Browser bundles unchanged."
            exit 0
          fi
          git commit -m "Build browser worker bundles"
          git push
