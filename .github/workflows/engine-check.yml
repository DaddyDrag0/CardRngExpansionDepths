name: Engine Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && 'main' || 'end-times-toggle' }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply End Times ownership toggle
        run: python3 scripts/apply-end-times-toggle.py
      - run: npm ci
      - run: npm run check
      - name: Build browser workers
        run: npm run build:workers
      - name: Bump site version
        run: python3 - <<'PY'
          import json
          from datetime import datetime, timezone
          with open('site-version.json','w') as f:
              json.dump({'version': datetime.now(timezone.utc).strftime('%Y%m%d-%H%M%SZ')}, f)
              f.write('\n')
          PY
      - name: Publish tested End Times toggle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "${{ github.event_name }}" = "push" ]; then
            git show HEAD^1:.github/workflows/engine-check.yml > .github/workflows/engine-check.yml
            git rm scripts/apply-end-times-toggle.py .github/workflows/end-times-toggle.yml
            git add index.html src/engine/tower.ts src/tower-worker.ts scripts/tower-cheese-search-regression.ts browser/tower-worker.js site-version.json .github/workflows/engine-check.yml
            git commit -m "Add End Times ownership toggle"
            git push origin HEAD:main
          else
            echo "PR check only; publish happens after merge to main."
          fi
