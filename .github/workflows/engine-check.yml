name: Engine Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Build browser workers
        run: npm run build:workers

      - name: Apply one-time real Scarlet rain
        if: github.event_name == 'push'
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import datetime, json, re

          js = r'''(() => {
  const THEME = 'scarlet';
  const LAYER_ID = 'bloodRainLayer';
  const MAX_DROPS = 140;
  let running = false;
  let timer = 0;
  const pending = new Set();

  const prefersReducedMotion = () => window.matchMedia?.('(prefers-reduced-motion: reduce)').matches;
  const isScarlet = () => document.documentElement.dataset.theme === THEME;

  function getLayer() {
    let layer = document.getElementById(LAYER_ID);
    if (!layer) {
      layer = document.createElement('div');
      layer.id = LAYER_ID;
      layer.className = 'blood-rain-layer';
      layer.setAttribute('aria-hidden', 'true');
      document.body.prepend(layer);
    }
    return layer;
  }

  function later(fn, delay) {
    const id = window.setTimeout(() => {
      pending.delete(id);
      fn();
    }, delay);
    pending.add(id);
    return id;
  }

  function clearRain() {
    window.clearTimeout(timer);
    timer = 0;
    for (const id of pending) window.clearTimeout(id);
    pending.clear();
    running = false;
    document.getElementById(LAYER_ID)?.replaceChildren();
  }

  function spawnDrop() {
    if (!running || !isScarlet() || prefersReducedMotion()) return;
    const layer = getLayer();
    if (layer.childElementCount >= MAX_DROPS) return;

    const drop = document.createElement('i');
    drop.className = 'blood-drop';

    const size = 4 + Math.random() * 8;
    const height = size * (1.05 + Math.random() * 0.55);
    const duration = 2.0 + Math.random() * 3.6;
    const drift = -38 + Math.random() * 76;
    const opacity = 0.38 + Math.random() * 0.56;

    drop.style.left = `${(Math.random() * 100).toFixed(3)}vw`;
    drop.style.width = `${size.toFixed(2)}px`;
    drop.style.height = `${height.toFixed(2)}px`;
    drop.style.opacity = opacity.toFixed(2);
    drop.style.setProperty('--blood-fall-time', `${duration.toFixed(2)}s`);
    drop.style.setProperty('--blood-drift', `${drift.toFixed(1)}px`);
    drop.style.setProperty('--blood-spin', `${(-10 + Math.random() * 20).toFixed(1)}deg`);

    if (Math.random() < 0.16) {
      drop.style.filter = `blur(${(0.45 + Math.random() * 0.75).toFixed(2)}px)`;
    }

    drop.addEventListener('animationend', () => drop.remove(), {once:true});
    layer.appendChild(drop);
  }

  function scheduleNext() {
    if (!running) return;
    spawnDrop();

    // Every drop receives a fresh random wait. Occasional tiny gaps create natural bursts.
    const r = Math.random();
    const delay = r < 0.18
      ? 28 + Math.random() * 70
      : r < 0.72
        ? 90 + Math.random() * 175
        : 260 + Math.random() * 360;

    timer = window.setTimeout(scheduleNext, delay);
  }

  function startRain() {
    if (running || !isScarlet() || prefersReducedMotion()) return;
    running = true;
    getLayer();

    // Scatter the initial drops in time rather than spawning a visible row.
    const initial = 8 + Math.floor(Math.random() * 9);
    for (let i = 0; i < initial; i++) {
      later(spawnDrop, 40 + Math.random() * 1200);
    }
    later(scheduleNext, 40 + Math.random() * 180);
  }

  function syncTheme() {
    if (isScarlet()) startRain();
    else clearRain();
  }

  function boot() {
    getLayer();
    new MutationObserver(syncTheme).observe(document.documentElement, {
      attributes: true,
      attributeFilter: ['data-theme']
    });
    syncTheme();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot, {once:true});
  } else {
    boot();
  }
})();
'''
          Path('src/blood-rain.js').write_text(js)

          index_path = Path('index.html')
          index = index_path.read_text()
          tag = '  <script defer src="./src/blood-rain.js?rev=5"></script>\n'
          if './src/blood-rain.js' not in index:
              needle = '  <link rel="stylesheet" href="./src/styles.css" />\n'
              if needle not in index:
                  raise SystemExit('Could not find styles.css link')
              index = index.replace(needle, tag + needle, 1)
          else:
              index = re.sub(r'  <script defer src="\.\/src\/blood-rain\.js[^\"]*"></script>\n', tag, index, count=1)
          index_path.write_text(index)

          css_path = Path('src/styles.css')
          css = css_path.read_text()
          for marker in ('/* SCARLET BLOOD DROPLETS V3 */', '/* SCARLET REAL RANDOM RAIN V4 */', '/* SCARLET REAL RANDOM RAIN V5 */'):
              if marker in css:
                  css = css.split(marker, 1)[0].rstrip()
                  break

          css += r'''

/* SCARLET REAL RANDOM RAIN V5 */
/* Kill every old pseudo-element implementation that created fixed vertical lanes. */
html[data-theme="scarlet"] body::before,
html[data-theme="scarlet"] body::after{
  content:none!important;
  display:none!important;
  background:none!important;
  animation:none!important;
}
.blood-rain-layer{
  position:fixed;
  inset:0;
  z-index:0;
  pointer-events:none;
  overflow:hidden;
}
.blood-drop{
  position:absolute;
  top:-24px;
  display:block;
  background:radial-gradient(circle at 34% 27%,rgba(255,92,110,.78) 0 10%,rgba(190,10,44,.96) 34%,rgba(101,0,22,.98) 74%,rgba(55,0,12,.98) 100%);
  border-radius:58% 58% 68% 68% / 43% 43% 78% 78%;
  box-shadow:0 0 5px rgba(132,0,27,.22);
  transform-origin:center;
  will-change:transform;
  animation:blood-real-fall var(--blood-fall-time,3s) linear forwards;
}
.blood-drop::before{
  content:"";
  position:absolute;
  width:34%;
  height:28%;
  top:9%;
  left:18%;
  border-radius:50%;
  background:rgba(255,150,161,.22);
}
@keyframes blood-real-fall{
  from{transform:translate3d(0,-32px,0) rotate(var(--blood-spin,0deg))}
  to{transform:translate3d(var(--blood-drift,0px),calc(100vh + 64px),0) rotate(var(--blood-spin,0deg))}
}
@media(prefers-reduced-motion:reduce){.blood-rain-layer{display:none!important}}
'''
          css_path.write_text(css + '\n')

          version = datetime.datetime.now(datetime.timezone.utc).strftime('%Y%m%d-%H%M%SZ')
          Path('site-version.json').write_text(json.dumps({'version':version}, separators=(',',':')) + '\n')
          print('Randomized blood rain version', version)
          PY

      - name: Verify worker bundles on pull requests
        if: github.event_name == 'pull_request'
        run: git diff --exit-code -- browser/depths-worker.js browser/tower-worker.js

      - name: Commit one-time Scarlet update and restore CI
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git show HEAD^:.github/workflows/engine-check.yml > .github/workflows/engine-check.yml
          rm -f .github/workflows/scarlet-real-rain.yml
          git add index.html src/styles.css src/blood-rain.js site-version.json .github/workflows/engine-check.yml .github/workflows/scarlet-real-rain.yml browser/depths-worker.js browser/tower-worker.js
          git commit -m "Make Scarlet rain spawn random blood droplets"
          git pull --rebase origin main
          git push origin HEAD:main
