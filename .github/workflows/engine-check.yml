name: Engine Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - run: npm run test:engine
      - run: npm run test:depths
      - run: npm run test:player
      - name: Validate live page JavaScript
        run: |
          node <<'NODE'
          const fs = require('fs')
          const html = fs.readFileSync('index.html', 'utf8')
          const scripts = [...html.matchAll(/<script>([\s\S]*?)<\/script>/g)].map((match) => match[1])
          if (!scripts.length) throw new Error('No inline live-page script found')
          for (const script of scripts) new Function(script)

          const requiredUiHooks = [
            "new Worker('./browser/depths-worker.js')",
            'CRE1-',
            'Most common losing-floor enemies',
          ]
          for (const hook of requiredUiHooks) {
            if (!html.includes(hook)) throw new Error(`Missing live-page hook: ${hook}`)
          }

          for (const removedHook of ['data-library-mode="bans"', 'data-library-mode="pool"']) {
            if (html.includes(removedHook)) throw new Error(`Removed calculator-only control returned: ${removedHook}`)
          }

          const workerSource = fs.readFileSync('src/browser-worker.ts', 'utf8')
          for (const removedField of ['excludedCardNames', 'selectedCardNames']) {
            if (workerSource.includes(removedField)) throw new Error(`Removed calculator-only field returned: ${removedField}`)
          }

          const styles = fs.readFileSync('src/styles.css', 'utf8')
          if (styles.includes('.aura-exact b{display:none!important}')) throw new Error('Resolved aura values are hidden')

          console.log(`Live page JavaScript parsed successfully (${scripts.length} inline script).`)
          console.log('Team codes, ending-enemy results, fixed Depths pool, and worker routing are present.')
          NODE
      - name: Bundle browser simulation worker
        if: github.event_name == 'push'
        run: npx esbuild src/browser-worker.ts --bundle --platform=browser --format=iife --target=es2020 --minify --outfile=browser/depths-worker.js
      - name: Commit browser simulation bundle
        if: github.event_name == 'push'
        run: |
          git config user.name "Drago"
          git config user.email "dragoidc3@gmail.com"
          git add browser/depths-worker.js
          if git diff --cached --quiet; then
            echo "Browser bundle unchanged."
            exit 0
          fi
          git commit -m "Build browser simulation bundle"
          git push
