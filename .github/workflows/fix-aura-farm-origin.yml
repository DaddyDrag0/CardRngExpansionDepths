name: Fix Aura Farm during Origin

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-aura-farm-origin.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Patch Aura Farm and add regression
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          battle_path = Path('src/engine/battle-v2.ts')
          battle = battle_path.read_text()
          old = """function resolveAuraFarm(runtime: Runtime, target: CombatCard, incoming: number): { target: CombatCard; damage: number } {
            if (incoming < target.hp) return { target, damage: incoming }
            const deck = runtime.state.teams[target.team]
            const piccolo = deck[1]
            if (!piccolo || piccolo.definition.name !== 'Piccolo' || piccolo.flags.farmed) return { target, damage: incoming }
            const protectedName = effectiveCardName(target) || target.definition.name
          """
          new = """function resolveAuraFarm(runtime: Runtime, target: CombatCard, incoming: number): { target: CombatCard; damage: number } {
            if (incoming < target.hp) return { target, damage: incoming }
            const deck = runtime.state.teams[target.team]
            // Aura Farm only protects the active card directly ahead of Piccolo.
            // Origin/Long Reach can hit Piccolo on the bench; Piccolo must never
            // treat itself as the card it is protecting or overwrite the front slot.
            if (deck[0] !== target) return { target, damage: incoming }
            const piccolo = deck[1]
            if (!piccolo || piccolo === target || !alive(piccolo) || piccolo.definition.name !== 'Piccolo' || piccolo.flags.farmed) return { target, damage: incoming }
            const protectedName = effectiveCardName(target) || target.definition.name
          """
          if old not in battle:
              raise SystemExit('Aura Farm patch target not found')
          battle_path.write_text(battle.replace(old, new, 1))

          test_path = Path('scripts/aura-farm-origin-regression.ts')
          test_path.write_text(r'''import cards from '../src/data/cards'
          import { simulateBattleV2 } from '../src/engine/battle-v2'
          import type { DepthsEnemy, TeamLoadout } from '../src/types'

          function assert(condition: unknown, message: string): asserts condition {
            if (!condition) throw new Error(message)
          }
          function card(name: string) {
            const found = cards.find((entry) => entry.name === name)
            if (!found) throw new Error(`Missing regression card: ${name}`)
            return found
          }

          const loadout: TeamLoadout = {
            cards: [
              { cardName: "Terra's Aria", borders: ['Galaxy'] },
              { cardName: 'Piccolo', borders: [] },
              { cardName: 'Parallax', borders: [] },
            ],
          }
          const enemies: DepthsEnemy[] = [
            { card: card('Chaos'), power: 1e30, attack: 1_000_000, health: 1e30 },
          ]

          for (let seed = 1; seed <= 300; seed++) {
            const battle = simulateBattleV2(loadout, enemies, seed, 2, true, true)
            const ids = battle.state.teams.Allies.map((entry) => entry.id)
            assert(new Set(ids).size === ids.length, `Origin/Aura Farm duplicated a player card on seed ${seed}: ${ids.join(', ')}`)
            assert(
              !battle.debug.events.some((event) => event.detail?.includes('Aura Farm protected Piccolo from a lethal hit')),
              `Piccolo incorrectly protected itself from a backline Origin hit on seed ${seed}`,
            )
            assert(
              battle.state.teams.Allies.some((entry) => entry.definition.name === "Terra's Aria") || battle.state.fallen.Allies.some((entry) => entry.definition.name === "Terra's Aria"),
              `Terra's Aria vanished from the lineup on seed ${seed}`,
            )
          }
          console.log('Aura Farm / Origin backline regression passed')
          ''')

          package_path = Path('package.json')
          package = package_path.read_text()
          old_pkg = 'tsx scripts/tower-cheese-search-regression.ts && tsx scripts/new-aura-regression.ts'
          new_pkg = 'tsx scripts/tower-cheese-search-regression.ts && tsx scripts/new-aura-regression.ts && tsx scripts/aura-farm-origin-regression.ts'
          if old_pkg not in package:
              raise SystemExit('package regression hook not found')
          package_path.write_text(package.replace(old_pkg, new_pkg, 1))
          PY
      - run: npm ci
      - run: npm run check
      - name: Build browser workers
        run: npm run build:workers
      - name: Bump site version
        run: printf '{"version":"%s"}\n' "$(date -u +%Y%m%d-%H%M%SZ)" > site-version.json
      - name: Publish tested fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/fix-aura-farm-origin.yml
          git add -A
          git commit -m "Fix Aura Farm during backline attacks"
          git pull --rebase origin main
          git push origin HEAD:main
