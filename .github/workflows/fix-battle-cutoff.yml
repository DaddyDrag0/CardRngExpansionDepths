name: Fix Battle Cutoff

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-battle-cutoff.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Fix battle cutoff workflow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/fix-battle-cutoff.mjs
      - run: npm install
      - run: npm run build
      - run: npm run test:engine
      - run: npm run test:depths
      - run: npm run test:player
      - name: Verify artificial cutoff is gone
        run: |
          if grep -q 'samePairTurns' src/engine/battle-v2.ts; then
            echo 'Artificial same-pair cutoff still exists.'
            exit 1
          fi
      - run: npx esbuild src/browser-worker.ts --bundle --platform=browser --format=iife --target=es2020 --minify --outfile=browser/depths-worker.js
      - name: Commit correction
        run: |
          rm .github/workflows/fix-battle-cutoff.yml scripts/fix-battle-cutoff.mjs
          git config user.name "Drago"
          git config user.email "dragoidc3@gmail.com"
          git add src/engine/auras.ts src/engine/battle-v2.ts scripts/engine-smoke.ts browser/depths-worker.js .github/workflows/fix-battle-cutoff.yml scripts/fix-battle-cutoff.mjs
          git commit -m "Remove artificial battle cutoff and fix Fate support"
          git push
