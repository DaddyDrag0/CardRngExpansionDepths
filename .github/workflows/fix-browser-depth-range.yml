name: Fix browser worker Depth range

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-browser-depth-range.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Patch worker summary
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/browser-worker.ts')
          s=p.read_text()
          s=s.replace("import { auraPackRangeForMedian, potionDropRangeForMedian } from './engine/depths-rewards'", "import { auraPacksForDepth, potionDropsForDepth } from './engine/depths-rewards'")
          old="""  const estimate = auraPackRangeForMedian(medianFloor)
  const potionRewards = potionDropRangeForMedian(medianFloor, 0.15, bountifulDepths)
"""
          new="""  const observedMinFloor = floors[0]
  const observedMaxFloor = floors[floors.length - 1]
  const medianDepth = Math.max(1, Math.round(medianFloor))
  const estimatedFloorLow = Math.max(observedMinFloor, Math.max(1, Math.round(medianFloor * 0.9)))
  const estimatedFloorHigh = Math.min(observedMaxFloor, Math.max(1, Math.round(medianFloor * 1.1)))
  const estimate = {
    low: estimatedFloorLow,
    high: estimatedFloorHigh,
    medianDepth,
    auraPackLow: auraPacksForDepth(estimatedFloorLow),
    auraPackMedian: auraPacksForDepth(medianDepth),
    auraPackHigh: auraPacksForDepth(estimatedFloorHigh),
  }
  const potionRewards = {
    low: potionDropsForDepth(estimatedFloorLow, bountifulDepths),
    median: potionDropsForDepth(medianDepth, bountifulDepths),
    high: potionDropsForDepth(estimatedFloorHigh, bountifulDepths),
    medianDepth,
    bountiful: bountifulDepths,
  }
"""
          if old not in s:
              raise SystemExit('old worker range block not found')
          p.write_text(s.replace(old,new,1))
          Path('site-version.json').write_text('{"version":"20260907-depth-range-browser-cap10"}\n')
          PY
      - name: Validate
        run: |
          npm run check
          npm run build:workers
          grep -q "medianFloor \* 0.9" src/browser-worker.ts
          grep -q "potionDropsForDepth(estimatedFloorLow" src/browser-worker.ts
          if grep -q "auraPackRangeForMedian(medianFloor)" src/browser-worker.ts; then exit 1; fi
          if grep -q "potionDropRangeForMedian(medianFloor, 0.15" src/browser-worker.ts; then exit 1; fi
      - name: Publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/fix-browser-depth-range.yml
          git add -A
          git commit -m "Fix live Depth range summary"
          git pull --rebase origin main
          git push origin HEAD:main
