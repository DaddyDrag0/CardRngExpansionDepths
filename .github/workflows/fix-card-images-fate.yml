name: Fix new card images and Fate duplicates

on:
  push:
    branches: [fix-card-images-fate]
    paths:
      - 'scripts/apply-image-fate-fix.py'
      - '.github/workflows/fix-card-images-fate.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-card-images-fate
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply fixes
        run: python3 scripts/apply-image-fate-fix.py
      - name: Resolve all Roblox thumbnails
        run: node scripts/resolve-thumbnails.mjs
      - name: Verify new card thumbnails exist
        run: |
          node - <<'NODE'
          const fs = require('fs')
          const thumbs = JSON.parse(fs.readFileSync('src/data/thumbnails.json','utf8'))
          for (const id of ['81556098422773','91389584710674','139426020484277']) {
            if (!thumbs[id]) throw new Error(`Missing resolved thumbnail for ${id}`)
          }
          console.log('New card thumbnails resolved.')
          NODE
      - run: npm ci
      - run: npm run check
      - name: Build browser workers
        run: npm run build:workers
      - name: Bump site version
        run: printf '{"version":"%s"}\n' "$(date -u +%Y%m%d-%H%M%SZ)" > site-version.json
      - name: Publish tested fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f scripts/apply-image-fate-fix.py .github/workflows/fix-card-images-fate.yml
          git add -A
          git commit -m "Fix new card images and Fate Seamstress duplicates"
          git push origin HEAD:fix-card-images-fate
