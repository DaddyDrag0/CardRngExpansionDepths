name: Fix Hell's Curse Tower rule

on:
  push:
    paths:
      - '.github/workflows/fix-hells-curse-tower.yml'
      - 'scripts/fix_hells_curse_tower.py'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: python scripts/fix_hells_curse_tower.py
      - name: Verify
        run: |
          python - <<'PY'
          from pathlib import Path
          html=Path('index.html').read_text()
          force=html.split('let forceEndTimes=',1)[1].split(';',1)[0]
          assert 'remove their ability on entry' not in force
          start=html.index('<script>')+len('<script>')
          end=html.rindex('</script>')
          Path('/tmp/page.js').write_text(html[start:end])
          print("Hell's Curse Tower check passed.")
          PY
          node --check /tmp/page.js
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Fix Hell's Curse Tower cheese rule"
            git push
          fi
