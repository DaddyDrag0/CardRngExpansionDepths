name: Fix JD Overcharge half damage v2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-jd-overcharge-half-damage-v2.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch source
        run: echo '' | base64 -d | python3
      - name: Install dependencies
        run: npm ci
      - name: Validate
        run: npm run check
      - name: Build workers
        run: npm run build:workers
      - name: Verify
        run: |
          grep -q "Armageddon did not carry into the next enemy" src/engine/battle-v2.ts
          grep -q "suppressArmageddonOnce" browser/tower-worker.js
          ! grep -q "50% of infinite damage is still lethal" src/engine/battle-v2.ts
      - name: Publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/engine/battle-v2.ts scripts/tower-cheese-corrections-regression.ts browser/depths-worker.js browser/tower-worker.js site-version.json
          git commit -m "Correct Judgment Day Overcharge follow-up damage"
          git push
