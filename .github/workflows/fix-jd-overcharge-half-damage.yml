name: Fix Judgment Day Overcharge half damage

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-jd-overcharge-half-damage.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Correct Judgment Day Overcharge behavior
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('src/engine/battle-v2.ts')
          s = p.read_text()

          old = """    case 'Armageddon': {
      const inheritedLethal = Boolean(attacker.flags.forceArmageddonLethal)
      attacker.flags.forceArmageddonLethal = false
      const success = inheritedLethal || rand(runtime, attacker.team) > 0.5
      attacker.flags.armageddonLethalThisHit = success
      if (success) damage = Number.POSITIVE_INFINITY
      pushAbilityDebug(runtime, attacker, inheritedLethal
        ? 'Armageddon stayed lethal through Overcharge — 50% of infinite damage is still lethal.'
        : `Armageddon ${success ? 'succeeded — this hit became lethal' : 'failed — normal attack damage only'}.`)
      break
    }"""
          new = """    case 'Armageddon': {
      if (attacker.flags.suppressArmageddonOnce) {
        attacker.flags.suppressArmageddonOnce = false
        attacker.flags.armageddonLethalThisHit = false
        pushAbilityDebug(runtime, attacker, 'Overcharge follow-up used 50% of Judgment Day card damage; Armageddon did not carry into the next enemy.')
        break
      }
      const success = rand(runtime, attacker.team) > 0.5
      attacker.flags.armageddonLethalThisHit = success
      if (success) damage = Number.POSITIVE_INFINITY
      pushAbilityDebug(runtime, attacker, `Armageddon ${success ? 'succeeded — this hit became lethal' : 'failed — normal attack damage only'}.`)
      break
    }"""
          if old not in s:
              raise SystemExit('Armageddon anchor missing')
          s = s.replace(old, new, 1)

          old = """      // Judgment Day may Overcharge after an infinite Armageddon kill. Since 50% of
      // Infinity is still Infinity, that immediate follow-up keeps the lethal damage result.
      if (stormSpirit && stormTarget && alive(attacker) && (alive(target) || armageddonLethal) && runtime.rng.next() * 100 < stormSpirit) {
        pushAbilityDebug(runtime, attacker, 'Storm Spirit triggered — immediately attacking again at 50% damage.')
        if (armageddonLethal) attacker.flags.forceArmageddonLethal = true
        const stormDamage = dealDamage(runtime, attacker, stormTarget, 0.5)"""
          new = """      // Judgment Day may still Overcharge after an Armageddon kill, but the lethal/infinite
      // result does NOT transfer. The follow-up into the next enemy is exactly 50% of JD's
      // normal card damage, so Armageddon is suppressed for that one follow-up hit.
      if (stormSpirit && stormTarget && alive(attacker) && (alive(target) || armageddonLethal) && runtime.rng.next() * 100 < stormSpirit) {
        pushAbilityDebug(runtime, attacker, 'Storm Spirit triggered — immediately attacking again at 50% damage.')
        if (armageddonLethal && !alive(target)) attacker.flags.suppressArmageddonOnce = true
        const stormDamage = dealDamage(runtime, attacker, stormTarget, 0.5)"""
          if old not in s:
              raise SystemExit('Storm Spirit anchor missing')
          s = s.replace(old, new, 1)
          p.write_text(s)

          # Update the regression that previously asserted the incorrect infinity carryover.
          r = Path('scripts/tower-cheese-corrections-regression.ts')
          if r.exists():
              t = r.read_text()
              t = t.replace("assert.match(battleSource, /50% of infinite damage is still lethal/)\n", "assert.match(battleSource, /Armageddon did not carry into the next enemy/)\n")
              start = t.find('let inheritedOvercharge = false')
              end_marker = "assert.ok(inheritedOvercharge, 'Judgment Day should be able to Overcharge an infinite Armageddon hit into the next enemy')"
              end = t.find(end_marker)
              if start != -1 and end != -1:
                  end = end + len(end_marker)
                  replacement = """let correctedOvercharge = false
for (let seed = 1; seed <= 1200 && !correctedOvercharge; seed++) {
  const battle = simulateBattleV2(loadout as any, enemies, seed, 100, true, true)
  const details = (battle.debug?.events || []).map((event) => event.detail).join('\\n')
  if (
    details.includes('Armageddon succeeded — this hit became lethal')
    && details.includes('Storm Spirit triggered')
    && details.includes('Armageddon did not carry into the next enemy')
  ) correctedOvercharge = true
}
assert.ok(correctedOvercharge, 'Judgment Day Overcharge after an Armageddon kill should use half normal card damage instead of carrying infinity')"""
                  t = t[:start] + replacement + t[end:]
              t = t.replace('Overcharge infinity, JD protection rules', 'Overcharge half-damage carryover, JD protection rules')
              r.write_text(t)

          Path('site-version.json').write_text('{"version":"20260907-jd-overcharge-half-damage-1"}\n')
          PY

      - name: Install dependencies
        run: npm ci

      - name: Validate project
        run: npm run check

      - name: Build workers
        run: npm run build:workers

      - name: Verify corrected behavior text
        run: |
          grep -q "Armageddon did not carry into the next enemy" src/engine/battle-v2.ts
          grep -q "suppressArmageddonOnce" browser/tower-worker.js
          ! grep -q "50% of infinite damage is still lethal" src/engine/battle-v2.ts

      - name: Publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/engine/battle-v2.ts scripts/tower-cheese-corrections-regression.ts browser/depths-worker.js browser/tower-worker.js site-version.json
          git commit -m "Correct Judgment Day Overcharge follow-up damage"
          git push
