name: Fix Mastermind Parallax priority

on:
  push:
    paths:
      - '.github/workflows/fix-mastermind-parallax.yml'
      - 'scripts/fix_mastermind_parallax.py'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: python scripts/fix_mastermind_parallax.py
      - name: Verify
        run: |
          python - <<'PY'
          from pathlib import Path
          html=Path('index.html').read_text()
          assert "'Perish','Mind Rift','Snowscape'" not in html
          assert "'Perish','Snowscape'" in html
          start=html.index('<script>')+len('<script>')
          end=html.rindex('</script>')
          Path('/tmp/page.js').write_text(html[start:end])
          print('Mastermind Parallax rule assertions passed.')
          PY
          node --check /tmp/page.js
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Reserve Parallax for hard Tower blockers"
            git push
          fi
