name: Fix Order of the Cosmos

on:
  push:
    paths:
      - 'scripts/fix-order-cosmos.mjs'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install --no-audit --no-fund
      - name: Apply source-aligned Order of the Cosmos fix
        run: node scripts/fix-order-cosmos.mjs
      - name: Build
        run: npm run build
      - name: Engine regressions
        run: npm run test:engine
      - name: Depths regressions
        run: npm run test:depths
      - name: Order regression
        run: npx --no-install tsx scripts/order-cosmos-regression.ts
      - name: Rebuild browser worker
        run: npx --no-install esbuild src/browser-worker.ts --bundle --format=iife --platform=browser --target=es2020 --minify --outfile=browser/depths-worker.js
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/engine/battle-v2.ts src/types.ts browser/depths-worker.js scripts/order-cosmos-regression.ts
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Align Order of the Cosmos with server behavior"
            git push
          fi
