name: Apply Sacred Judgment fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-sacred-judgment-resolution.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Patch Sacred Judgment
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/engine/battle-v2.ts')
          s = p.read_text()
          marker = "case 'Sacred Judgment': {"
          before, after = s.split(marker, 1)
          old = "if (!alive(card) || !alive(target)) continue"
          if old not in after:
              raise SystemExit('Sacred Judgment guard not found')
          after = after.replace(old, "if (!alive(target)) continue", 1)
          comment = "// Sacred Judgment must finish the snapshotted AoE even if Seraphim dies mid-cast.\n      "
          after = after.replace("const targets = [...runtime.state.teams[enemyTeam]]", comment + "const targets = [...runtime.state.teams[enemyTeam]]", 1)
          p.write_text(before + marker + after)
          Path('site-version.json').write_text('{"version":"20260908-sacred-judgment-full-resolution-2"}\n')
          PY
      - run: npx tsx scripts/sacred-judgment-regression.ts
      - run: npm run check
      - run: npm run build:workers
      - name: Publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/fix-sacred-judgment-resolution.yml
          git add -A
          git commit -m "Fix Seraphim Sacred Judgment full resolution"
          git pull --rebase origin main
          git push origin HEAD:main
