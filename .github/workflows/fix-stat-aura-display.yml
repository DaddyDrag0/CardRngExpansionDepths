name: Fix Stat Aura Display

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-stat-aura-display.yml
      - scripts/fix-aura-display.mjs

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/fix-aura-display.mjs
      - run: npm install
      - run: npm run build
      - run: npm run test:engine
      - run: npm run test:depths
      - run: npm run test:player
      - name: Validate live page
        run: |
          node -e "const fs=require('fs'); const html=fs.readFileSync('index.html','utf8'); const scripts=[...html.matchAll(/<script>([\\s\\S]*?)<\\/script>/g)].map(m=>m[1]); scripts.forEach(s=>new Function(s)); if(fs.readFileSync('src/styles.css','utf8').includes('.aura-exact b{display:none!important}')) throw new Error('aura values hidden'); if(!html.includes('weatherCards=state.cards.filter')) throw new Error('weather card list missing');"
      - name: Commit fix
        run: |
          rm .github/workflows/fix-stat-aura-display.yml scripts/fix-aura-display.mjs
          git config user.name "Drago"
          git config user.email "dragoidc3@gmail.com"
          git add src/styles.css index.html .github/workflows/fix-stat-aura-display.yml scripts/fix-aura-display.mjs
          git commit -m "Fix Stat Aura percentages and boosted card list"
          git push
