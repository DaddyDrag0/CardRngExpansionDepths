name: Fix simulation watchdog heartbeat

on:
  push:
    paths:
      - 'scripts/fix-watchdog-heartbeat.mjs'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --no-audit --no-fund
      - name: Apply watchdog heartbeat fix
        run: node scripts/fix-watchdog-heartbeat.mjs
      - name: Build
        run: npm run build
      - name: Engine regressions
        run: npm run test:engine
      - name: Depths regressions
        run: npm run test:depths
      - name: Player regressions
        run: npm run test:player
      - name: Watchdog heartbeat regression
        run: npx --no-install tsx scripts/watchdog-heartbeat-regression.ts
      - name: Rebuild browser worker
        run: npx --no-install esbuild src/browser-worker.ts --bundle --format=iife --platform=browser --target=es2020 --minify --outfile=browser/depths-worker.js
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src scripts/engine-smoke.ts scripts/watchdog-heartbeat-regression.ts browser/depths-worker.js
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
          else
            git commit -m "Use battle heartbeats for simulation watchdog"
            git push
          fi
