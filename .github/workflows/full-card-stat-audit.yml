name: Full Card Stat Audit

on:
  push:
    branches: [main]
    paths:
      - 'scripts/full-card-stat-audit.mjs'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Audit and correct every card stat
        run: node scripts/full-card-stat-audit.mjs
      - name: Run full checks
        run: npm run check
      - name: Rebuild browser workers
        run: npm run build:workers
      - name: Remove one-time audit files
        run: rm -f scripts/full-card-stat-audit.mjs .github/workflows/full-card-stat-audit.yml
      - name: Publish audited card stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Audit all card stats against game source"
          git push
