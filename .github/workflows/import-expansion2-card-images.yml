name: Import Expansion 2 card images

on:
  push:
    paths:
      - 'scripts/import-expansion2-card-images.mjs'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/import-expansion2-card-images.mjs
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/thumbnails.json
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Import Expansion 2 card images"
            git push
          fi
