name: Improve battle debug logs v2

on:
  push:
    paths:
      - '.github/workflows/improve-debug-logs-v2.yml'
      - 'scripts/run_debug_patch_v2.py'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: python scripts/run_debug_patch_v2.py
      - run: python scripts/improve_debug_logs.py
      - run: npm install
      - run: npm run build
      - run: npm run test:engine
      - name: Verify page JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          html=Path('index.html').read_text()
          assert 'Ability interactions:' in html
          assert 'dbg-dialog' in html
          start=html.index('<script>')+len('<script>')
          end=html.rindex('</script>')
          Path('/tmp/page.js').write_text(html[start:end])
          print('Debug UI assertions passed.')
          PY
          node --check /tmp/page.js
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/engine/battle-v2.ts scripts/engine-smoke.ts index.html
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Improve battle debug logs and ability tracing"
            git push
          fi
