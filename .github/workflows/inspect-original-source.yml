name: Inspect Original Combat Source

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/inspect-original-source.yml

permissions:
  contents: write

jobs:
  inspect:
    if: github.event.head_commit.message == 'Inspect original combat source'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install archive tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y megatools p7zip-full
      - name: Download decompiled source archive
        run: |
          mkdir -p /tmp/cardrng-download /tmp/cardrng-src
          megadl --path=/tmp/cardrng-download 'https://mega.nz/file/9ZgVmApB#q8wH37s5lzYuHpPhiJ1PgZS7kO8DOhNiIhyzL7yjp1A'
          find /tmp/cardrng-download -maxdepth 2 -type f -printf '%p %s bytes\n'
      - name: Extract archive
        run: |
          set +e
          for f in /tmp/cardrng-download/*; do
            file "$f"
            7z x -y "$f" -o/tmp/cardrng-src
          done
          set -e
          find /tmp/cardrng-src -type f | head -100
      - name: Find remaining ability mechanics
        run: |
          python - <<'PY'
          from pathlib import Path
          terms = [
            'Beyond The Grave','Constellar','Creation and Restoration','Dispel','Healing Miracle',
            'Laser Gun','Lotus Sutra','Origin','Outshine','Pandemic',"Pandora's Box",'Railgun',
            'Shiny Steal','Water Shield of Xuanwu','Chaos Destruction','Divination','Erosion',
            'Full Moon','Insatiable','Poke the Beast','The Underworld','Unholy Creature','Devilish'
          ]
          root = Path('/tmp/cardrng-src')
          files = [p for p in root.rglob('*') if p.is_file() and p.stat().st_size < 20_000_000]
          for term in terms:
            print('\n===== ' + term + ' =====')
            found = 0
            for path in files:
              try:
                text = path.read_text(errors='ignore')
              except Exception:
                continue
              pos = text.find(term)
              if pos < 0:
                continue
              found += 1
              start = max(0, pos - 1800)
              end = min(len(text), pos + len(term) + 3500)
              print('FILE:', path)
              print(text[start:end])
              if found >= 4:
                break
            if not found:
              print('NO MATCH')
          PY
      - name: Remove one-time workflow
        run: |
          rm .github/workflows/inspect-original-source.yml
          git config user.name "Drago"
          git config user.email "dragoidc3@gmail.com"
          git add .github/workflows/inspect-original-source.yml
          git commit -m "Remove original source inspection workflow"
          git push
