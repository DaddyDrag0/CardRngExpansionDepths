name: Lock Depths Cap 100k

on:
  push:
    branches: [main]
    paths:
      - 'scripts/lock-depths-cap-100k.mjs'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lock Depths cap to 100k
        run: node scripts/lock-depths-cap-100k.mjs
      - name: Run full checks
        run: npm run check
      - name: Remove one-time migration files
        run: rm -f scripts/lock-depths-cap-100k.mjs .github/workflows/lock-depths-cap-100k.yml
      - name: Publish fixed Depths cap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Lock Depths simulator cap at 100000"
          git pull --rebase origin main
          git push origin HEAD:main
