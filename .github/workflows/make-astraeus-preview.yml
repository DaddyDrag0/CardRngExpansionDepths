name: Make Astraeus Preview

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/make-astraeus-preview.yml

permissions:
  contents: write

jobs:
  preview:
    if: github.event.head_commit.message == 'Make Astraeus inspection preview'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Make compact preview
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y imagemagick
          convert debug/astraeus.png -resize 160x160 -quality 82 /tmp/astraeus.jpg
          base64 -w 0 /tmp/astraeus.jpg > debug/astraeus-preview.b64
          wc -c debug/astraeus-preview.b64
      - name: Commit preview
        run: |
          rm .github/workflows/make-astraeus-preview.yml
          git config user.name "Drago"
          git config user.email "dragoidc3@gmail.com"
          git add debug/astraeus-preview.b64 .github/workflows/make-astraeus-preview.yml
          git commit -m "Temporarily add Astraeus preview"
          git push
