name: Move theme switcher right

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/move-theme-switcher-right.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Move theme selector to top right
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from datetime import datetime, timezone
          import json

          css_path=Path('src/styles.css')
          css=css_path.read_text()
          old='.theme-switcher{position:fixed;z-index:10000;top:13px;left:14px;'
          new='.theme-switcher{position:fixed;z-index:10000;top:13px;right:14px;'
          if old not in css:
              raise SystemExit('Could not find desktop theme switcher position.')
          css=css.replace(old,new,1)
          old_mobile='@media(max-width:520px){.theme-switcher{left:8px;right:8px;justify-content:space-between}'
          new_mobile='@media(max-width:520px){.theme-switcher{left:8px;right:8px;justify-content:space-between}'
          if old_mobile not in css:
              raise SystemExit('Could not find mobile theme switcher rule.')
          css_path.write_text(css)

          Path('site-version.json').write_text(json.dumps({'version':datetime.now(timezone.utc).strftime('%Y%m%d-%H%M%SZ')},separators=(',',':'))+'\n')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/styles.css site-version.json
          git commit -m "Move theme selector to top right"
          git rm .github/workflows/move-theme-switcher-right.yml
          git commit -m "Remove temporary theme position workflow"
          git pull --rebase origin main
          git push origin HEAD:main
