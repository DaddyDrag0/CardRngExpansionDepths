name: New Blue Aura Update

on:
  push:
    branches: [aug19-new-blue-auras]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: aug19-new-blue-auras
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply NEW aura source changes
        run: python3 scripts/apply-new-auras.py
      - run: npm ci
      - run: npm run check
      - name: Build browser workers
        run: npm run build:workers
      - name: Bump site version
        run: |
          printf '{"version":"%s"}\n' "$(date -u +%Y%m%d-%H%M%SZ)" > site-version.json
      - name: Publish tested aura update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f scripts/apply-new-auras.py .github/workflows/new-blue-auras.yml
          git add -A
          git commit -m "Add new blue auras and Ruby aura border"
          git push origin HEAD:aug19-new-blue-auras
