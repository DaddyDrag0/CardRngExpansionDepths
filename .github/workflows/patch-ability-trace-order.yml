name: Patch ability trace ordering

on:
  push:
    paths:
      - 'scripts/patch-ability-trace-order.mjs'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install --no-audit --no-fund
      - name: Apply trace patch
        run: node scripts/patch-ability-trace-order.mjs
      - name: Typecheck/build
        run: npm run build
      - name: Engine regressions
        run: npm run test:engine
      - name: Depths regressions
        run: npm run test:depths
      - name: Rebuild browser worker
        run: npx --no-install esbuild src/browser-worker.ts --bundle --format=iife --platform=browser --target=es2020 --minify --outfile=browser/depths-worker.js
      - name: Commit trace fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/engine/battle-v2.ts browser/depths-worker.js
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
          else
            git commit -m "Explain Aura Farm and Chaos Destruction in battle logs"
            git push
          fi
