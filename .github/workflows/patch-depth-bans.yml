name: Patch Depth Bans

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/patch-depth-bans.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply Depth bans patch
        run: python3 scripts/patch-depth-bans.py
      - run: npm ci
      - run: npm run check
      - run: npm run build:workers
      - name: Publish tested patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/engine/depths.ts src/engine/simulation.ts src/browser-worker.ts scripts/depths-regression.ts index.html browser/depths-worker.js browser/tower-worker.js
          git commit -m "Add optional player Depth bans"
          git pull --rebase origin main
          git push origin HEAD:main
