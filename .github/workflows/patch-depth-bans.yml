name: Patch Depth Bans

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/patch-depth-bans.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Add optional Depth enemy bans
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # ---------------- src/engine/depths.ts ----------------
          path = Path('src/engine/depths.ts')
          s = path.read_text()

          old = "const HARD_EXCLUSIONS = new Set([\n  'Samurai', 'Seraphim', 'Vampire Lord', 'Loki', 'Fuxi', 'Parallax',\n  'Nán Fāng Zhū Què', 'Brachiosaurus', 'Jersey Devil',\n])"
          new = "const HARD_EXCLUSIONS = new Set([\n  'Samurai', 'Seraphim', 'Vampire Lord', 'Loki', 'Fuxi', 'Parallax',\n  'Nán Fāng Zhū Què', 'Brachiosaurus', 'Jersey Devil',\n])\n\nexport const MAX_DEPTH_BANS = 10\n\nfunction normalizeDepthBans(names: readonly string[] | undefined): string[] {\n  if (!names?.length) return []\n  const seen = new Set<string>()\n  const normalized: string[] = []\n  for (const rawName of names) {\n    const name = String(rawName || '').trim()\n    if (!name || seen.has(name)) continue\n    seen.add(name)\n    normalized.push(name)\n    if (normalized.length >= MAX_DEPTH_BANS) break\n  }\n  return normalized.sort((a, b) => a.localeCompare(b))\n}"
          if old not in s: raise SystemExit('depths hard exclusions anchor not found')
          s = s.replace(old, new, 1)

          old = "const POOL_CACHE = new Map<number, PreparedPool>()"
          new = "const POOL_CACHE = new Map<number, PreparedPool>()\nconst CUSTOM_BAN_POOL_CACHE = new Map<string, PreparedPool>()"
          if old not in s: raise SystemExit('pool cache anchor not found')
          s = s.replace(old, new, 1)

          old = "function preparedPool(floor: number): PreparedPool {\n  const tier = unlockTier(floor)\n  if (tier < 0) return { entries: [], cumulative: [], totalWeight: 0 }\n\n  const cached = POOL_CACHE.get(tier)\n  if (cached) return cached\n\n  const maxUnlockFloor = UNLOCK_FLOORS[tier]\n  const entries = PREPARED\n    .filter((entry) => entry.unlockFloor <= maxUnlockFloor)\n    .sort((a, b) => a.originalIndex - b.originalIndex)\n\n  const cumulative: number[] = []\n  let totalWeight = 0\n  for (const entry of entries) {\n    totalWeight += entry.weight\n    cumulative.push(totalWeight)\n  }\n\n  const pool = { entries, cumulative, totalWeight }\n  POOL_CACHE.set(tier, pool)\n  return pool\n}"
          new = "function preparedPool(floor: number, bannedCardNames: readonly string[] = []): PreparedPool {\n  const tier = unlockTier(floor)\n  if (tier < 0) return { entries: [], cumulative: [], totalWeight: 0 }\n\n  const bans = normalizeDepthBans(bannedCardNames)\n  const cacheKey = bans.length ? `${tier}|${bans.join('\\u0000')}` : ''\n  const cached = bans.length ? CUSTOM_BAN_POOL_CACHE.get(cacheKey) : POOL_CACHE.get(tier)\n  if (cached) return cached\n\n  const maxUnlockFloor = UNLOCK_FLOORS[tier]\n  const banned = bans.length ? new Set(bans) : null\n  const entries = PREPARED\n    .filter((entry) => entry.unlockFloor <= maxUnlockFloor && !banned?.has(entry.card.name))\n    .sort((a, b) => a.originalIndex - b.originalIndex)\n\n  const cumulative: number[] = []\n  let totalWeight = 0\n  for (const entry of entries) {\n    totalWeight += entry.weight\n    cumulative.push(totalWeight)\n  }\n\n  const pool = { entries, cumulative, totalWeight }\n  if (bans.length) CUSTOM_BAN_POOL_CACHE.set(cacheKey, pool)\n  else POOL_CACHE.set(tier, pool)\n  return pool\n}"
          if old not in s: raise SystemExit('preparedPool anchor not found')
          s = s.replace(old, new, 1)

          old = "export function getDepthsPool(floor: number) {\n  const pool = preparedPool(floor)"
          new = "export function getDepthsPool(floor: number, bannedCardNames: readonly string[] = []) {\n  const pool = preparedPool(floor, bannedCardNames)"
          if old not in s: raise SystemExit('getDepthsPool anchor not found')
          s = s.replace(old, new, 1)

          old = "export function generateDepthsTeam(floor: number, seed = floor): DepthsEnemy[] {\n  const pool = preparedPool(floor)"
          new = "export function generateDepthsTeam(floor: number, seed = floor, bannedCardNames: readonly string[] = []): DepthsEnemy[] {\n  const pool = preparedPool(floor, bannedCardNames)"
          if old not in s: raise SystemExit('generateDepthsTeam anchor not found')
          s = s.replace(old, new, 1)

          old = "  hardExclusions: [...HARD_EXCLUSIONS],\n}"
          new = "  hardExclusions: [...HARD_EXCLUSIONS],\n  maxPlayerBans: MAX_DEPTH_BANS,\n}"
          if old not in s: raise SystemExit('depths mechanics anchor not found')
          s = s.replace(old, new, 1)
          path.write_text(s)

          # ---------------- src/engine/simulation.ts ----------------
          path = Path('src/engine/simulation.ts')
          s = path.read_text()
          old = "  throwOnBattleTurnCap?: boolean\n}"
          new = "  throwOnBattleTurnCap?: boolean\n  /** Optional player-unlocked Depth bans. Default game exclusions remain active separately. */\n  bannedCardNames?: string[]\n}"
          if old not in s: raise SystemExit('simulation options anchor not found')
          s = s.replace(old, new, 1)

          old = "    const enemies = generateDepthsTeam(floor, floorSeed)"
          new = "    const enemies = generateDepthsTeam(floor, floorSeed, options.bannedCardNames)"
          if old not in s: raise SystemExit('simulation generate team anchor not found')
          s = s.replace(old, new, 1)

          old = "      battleTurnCap: options.battleTurnCap,\n    })"
          new = "      battleTurnCap: options.battleTurnCap,\n      bannedCardNames: options.bannedCardNames,\n    })"
          if old not in s: raise SystemExit('batch simulation options anchor not found')
          s = s.replace(old, new, 1)
          path.write_text(s)

          # ---------------- src/browser-worker.ts ----------------
          path = Path('src/browser-worker.ts')
          s = path.read_text()
          old = "  seed: number\n}\n\ninterface SingleRunRequest"
          new = "  seed: number\n  bannedCardNames?: string[]\n}\n\ninterface SingleRunRequest"
          if old not in s: raise SystemExit('batch request anchor not found')
          s = s.replace(old, new, 1)

          old = "  runIndex: number\n}\n\ntype SimulationRequest"
          new = "  runIndex: number\n  bannedCardNames?: string[]\n}\n\ntype SimulationRequest"
          if old not in s: raise SystemExit('single request anchor not found')
          s = s.replace(old, new, 1)

          old = "    throwOnBattleTurnCap: false,\n  }, onProgress)"
          new = "    throwOnBattleTurnCap: false,\n    bannedCardNames: request.bannedCardNames,\n  }, onProgress)"
          if old not in s: raise SystemExit('simulateOne options anchor not found')
          s = s.replace(old, new, 1)

          old = "        batchSeed: request.seed,\n        runIndex,\n      } satisfies SingleRunRequest)"
          new = "        batchSeed: request.seed,\n        runIndex,\n        bannedCardNames: request.bannedCardNames,\n      } satisfies SingleRunRequest)"
          if old not in s: raise SystemExit('child post message anchor not found')
          s = s.replace(old, new, 1)
          path.write_text(s)

          # ---------------- scripts/depths-regression.ts ----------------
          path = Path('scripts/depths-regression.ts')
          s = path.read_text()
          old = "import { generateDepthsTeam, isDepthsSourceEligible } from '../src/engine/depths'"
          new = "import { depthsMechanics, generateDepthsTeam, getDepthsPool, isDepthsSourceEligible, MAX_DEPTH_BANS } from '../src/engine/depths'"
          if old not in s: raise SystemExit('depths regression import anchor not found')
          s = s.replace(old, new, 1)

          insert_anchor = "const dummyDefinition: CardDefinition = {"
          test_block = """
// Player-unlocked Depth bans remove only additional cards from the generated pool.
// They are optional (0..10), while the game's built-in hard exclusions always stay excluded.
{
  const floor = 50_000
  const eligibleNames = getDepthsPool(floor).map((entry) => entry.card.name)
  assert(eligibleNames.length > 12, 'Expected enough Depth-eligible cards for ban regression')
  const twoBans = eligibleNames.slice(0, 2)
  const twoBanPool = getDepthsPool(floor, twoBans).map((entry) => entry.card.name)
  for (const name of twoBans) assert(!twoBanPool.includes(name), `Player Depth ban did not remove ${name}`)
  assert(twoBanPool.length < eligibleNames.length, 'Two optional Depth bans should shrink the pool')

  const elevenBans = eligibleNames.slice(0, 11)
  const cappedPool = getDepthsPool(floor, elevenBans).map((entry) => entry.card.name)
  for (const name of elevenBans.slice(0, MAX_DEPTH_BANS)) {
    assert(!cappedPool.includes(name), `Expected capped player ban to remove ${name}`)
  }
  assert(cappedPool.includes(elevenBans[MAX_DEPTH_BANS]), 'Player Depth bans must cap at 10')

  for (const name of depthsMechanics.hardExclusions) {
    assert(!getDepthsPool(floor, []).some((entry) => entry.card.name === name), `Default Depth ban ${name} must remain excluded`)
  }
}

"""
          if insert_anchor not in s: raise SystemExit('depths regression insertion anchor not found')
          s = s.replace(insert_anchor, test_block + insert_anchor, 1)
          path.write_text(s)

          # ---------------- index.html ----------------
          path = Path('index.html')
          s = path.read_text()

          old = ".simulation-body{padding:14px}.sim-note p,.sim-footnote"
          new = ".simulation-body{padding:14px}.depth-ban-box{margin-top:13px;border:1px solid #263142;background:#0a0f16;border-radius:11px;padding:10px}.depth-ban-head{display:flex;align-items:center;justify-content:space-between;gap:8px}.depth-ban-head span{color:#aab6c5;font-size:10px;font-weight:750}.depth-ban-head b{color:#87d8ca;font-size:9px}.depth-ban-box>small{display:block;color:#657487;font-size:8px;line-height:1.45;margin-top:4px}.depth-ban-chips{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}.depth-ban-chip{border:1px solid #35505a;background:#0d171d;color:#b8d8d2;border-radius:999px;padding:4px 7px;font-size:8px;cursor:pointer}.depth-ban-chip:hover{border-color:#588f86}.depth-ban-search{position:relative;margin-top:8px}.depth-ban-search input{width:100%;color:var(--text);background:#0d141d;border:1px solid #263142;border-radius:9px;padding:8px 9px;outline:none;font-size:9px}.depth-ban-suggestions{display:grid;gap:4px;margin-top:5px}.depth-ban-suggestions button{display:flex;align-items:center;justify-content:space-between;gap:8px;text-align:left;border:1px solid #202c3a;background:#0c121a;color:#aeb9c6;border-radius:8px;padding:6px 8px;font-size:8px;cursor:pointer}.depth-ban-suggestions button:hover{border-color:#477b76;color:#d7f2ed}.depth-ban-suggestions small{color:#647286;font-size:7px}.depth-ban-clear{border:0;background:transparent;color:#788697;font-size:8px;cursor:pointer;padding:0}.depth-ban-clear:hover{color:#bac5d1}.sim-note p,.sim-footnote"
          if old not in s: raise SystemExit('depth ban CSS anchor not found')
          s = s.replace(old, new, 1)

          old = "const AURA_CUSTOM={Berserker:[5,10,15,20],'Flame Wizard':[15,25,35,50],Shielder:[2,5,7,10],'Synth Human':[8,10,12,15]};"
          new = "const AURA_CUSTOM={Berserker:[5,10,15,20],'Flame Wizard':[15,25,35,50],Shielder:[2,5,7,10],'Synth Human':[8,10,12,15]};\n  const MAX_DEPTH_BANS=10;\n  const DEPTHS_DEFAULT_BANS=new Set(['Samurai','Seraphim','Vampire Lord','Loki','Fuxi','Parallax','Nán Fāng Zhū Què','Brachiosaurus','Jersey Devil']);\n  const depthBanEligible=c=>Boolean(c&&!c.unobtainable&&!c.expires&&!c.boss&&!DEPTHS_DEFAULT_BANS.has(c.name)&&c.pack!=='Christmas'&&c.pack!=='Halloween'&&c.pack!=='Halloween2');"
          if old not in s: raise SystemExit('index constants anchor not found')
          s = s.replace(old, new, 1)

          old = "query:'',runs:15,cap:50000,seed:1000,running:false"
          new = "query:'',depthBans:[],depthBanQuery:'',runs:15,cap:50000,seed:1000,running:false"
          if old not in s: raise SystemExit('state anchor not found')
          s = s.replace(old, new, 1)

          old = "activeTeam:state.activeTeam,runs:state.runs,cap:state.cap,seed:state.seed}))"
          new = "activeTeam:state.activeTeam,depthBans:state.depthBans,runs:state.runs,cap:state.cap,seed:state.seed}))"
          if old not in s: raise SystemExit('persist anchor not found')
          s = s.replace(old, new, 1)

          old = "state.cap=Math.min(50000,Math.max(1,Number(s.cap)||50000));state.seed=Number(s.seed)||1000}catch(_){}"
          new = "state.cap=Math.min(50000,Math.max(1,Number(s.cap)||50000));state.seed=Number(s.seed)||1000;state.depthBans=Array.isArray(s.depthBans)?[...new Set(s.depthBans.map(String))].filter(name=>depthBanEligible(cardByName(name))).slice(0,MAX_DEPTH_BANS):[];}catch(_){}"
          if old not in s: raise SystemExit('restore anchor not found')
          s = s.replace(old, new, 1)

          old = "const team=current(),q=state.query.trim().toLowerCase(),shown="
          new = "const team=current(),q=state.query.trim().toLowerCase(),banQ=state.depthBanQuery.trim().toLowerCase(),banCandidates=state.cards.filter(depthBanEligible).filter(c=>!state.depthBans.includes(c.name)).filter(c=>banQ&&(c.name.toLowerCase().includes(banQ)||(c.ability||'').toLowerCase().includes(banQ))).sort((a,b)=>a.name.localeCompare(b.name)).slice(0,8),shown="
          if old not in s: raise SystemExit('render variable anchor not found')
          s = s.replace(old, new, 1)

          old = "</div></div><label class=\"sim-field\"><span>Floor cap</span><input id=\"capInput\" type=\"number\" min=\"1\" max=\"50000\" value=\"${state.cap}\"></label><div class=\"sim-actions\">"
          new = "</div></div><label class=\"sim-field\"><span>Floor cap</span><input id=\"capInput\" type=\"number\" min=\"1\" max=\"50000\" value=\"${state.cap}\"></label><div class=\"depth-ban-box\"><div class=\"depth-ban-head\"><span>Depth bans</span><div>${state.depthBans.length?'<button type=\"button\" class=\"depth-ban-clear\" data-depth-ban-clear>Clear</button>':''} <b>${state.depthBans.length}/${MAX_DEPTH_BANS}</b></div></div><small>Optional player ban slots. Choose anywhere from 0 to 10. The cards banned by the game by default stay banned separately and do not use these slots.</small>${state.depthBans.length?`<div class=\"depth-ban-chips\">${state.depthBans.map((name,i)=>`<button type=\"button\" class=\"depth-ban-chip\" data-depth-ban-remove=\"${i}\" title=\"Remove ${esc(name)} ban\">${esc(name)} ×</button>`).join('')}</div>`:''}<div class=\"depth-ban-search\"><input id=\"depthBanSearch\" value=\"${esc(state.depthBanQuery)}\" placeholder=\"${state.depthBans.length>=MAX_DEPTH_BANS?'10/10 bans selected':'Search a card to ban…'}\" autocomplete=\"off\" ${state.depthBans.length>=MAX_DEPTH_BANS?'disabled':''}>${banQ&&state.depthBans.length<MAX_DEPTH_BANS?`<div class=\"depth-ban-suggestions\">${banCandidates.length?banCandidates.map(c=>`<button type=\"button\" data-depth-ban-add=\"${esc(c.name)}\"><span>${esc(c.name)}</span><small>${esc(c.ability||'No ability')}</small></button>`).join(''):'<small>No eligible Depth enemies found.</small>'}</div>`:''}</div></div><div class=\"sim-actions\">"
          if old not in s: raise SystemExit('simulation UI anchor not found')
          s = s.replace(old, new, 1)

          old = "root.querySelectorAll('[data-runs]').forEach(el=>el.addEventListener('click',()=>{state.runs=Number(el.dataset.runs);persist();render()}));root.querySelector('#capInput')"
          new = "root.querySelectorAll('[data-depth-ban-add]').forEach(el=>el.addEventListener('click',()=>{if(state.depthBans.length>=MAX_DEPTH_BANS)return;const name=el.dataset.depthBanAdd,card=cardByName(name);if(!depthBanEligible(card)||state.depthBans.includes(name))return;state.depthBans=[...state.depthBans,name].slice(0,MAX_DEPTH_BANS);state.depthBanQuery='';state.teams.forEach(t=>{t.result=null;t.elapsedMs=0;t.lastError=''});persist();render()}));root.querySelectorAll('[data-depth-ban-remove]').forEach(el=>el.addEventListener('click',()=>{state.depthBans.splice(Number(el.dataset.depthBanRemove),1);state.teams.forEach(t=>{t.result=null;t.elapsedMs=0;t.lastError=''});persist();render()}));root.querySelector('[data-depth-ban-clear]')?.addEventListener('click',()=>{state.depthBans=[];state.depthBanQuery='';state.teams.forEach(t=>{t.result=null;t.elapsedMs=0;t.lastError=''});persist();render()});const banSearch=root.querySelector('#depthBanSearch');banSearch?.addEventListener('input',()=>{state.depthBanQuery=banSearch.value;render();requestAnimationFrame(()=>{const n=root.querySelector('#depthBanSearch');n?.focus();n?.setSelectionRange(n.value.length,n.value.length)})});root.querySelectorAll('[data-runs]').forEach(el=>el.addEventListener('click',()=>{state.runs=Number(el.dataset.runs);persist();render()}));root.querySelector('#capInput')"
          if old not in s: raise SystemExit('ban event anchor not found')
          s = s.replace(old, new, 1)

          old = "worker.postMessage({id,loadout:loadoutFor(t),runs:state.runs,floorCap:state.cap,seed:batchSeed>>>0})"
          new = "worker.postMessage({id,loadout:loadoutFor(t),runs:state.runs,floorCap:state.cap,seed:batchSeed>>>0,bannedCardNames:[...state.depthBans]})"
          if old not in s: raise SystemExit('worker post anchor not found')
          s = s.replace(old, new, 1)

          path.write_text(s)
          print('Added optional Depth player bans (0-10) while preserving default exclusions.')
          PY
      - run: npm ci
      - run: npm run check
      - run: npm run build:workers
      - name: Publish tested Depth bans patch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/engine/depths.ts src/engine/simulation.ts src/browser-worker.ts scripts/depths-regression.ts index.html browser/depths-worker.js browser/tower-worker.js
          git commit -m "Add optional player Depth bans"
          git pull --rebase origin main
          git push origin HEAD:main
