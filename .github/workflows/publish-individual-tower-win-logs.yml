name: Publish individual Tower win logs

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-individual-tower-win-logs.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: npm ci

      - name: Validate project and individual win logs
        run: |
          npm run check
          npm run test:video-game
          npx tsx scripts/tower-win-logs-regression.ts
          node --check src/tower-win-logs-ui.js

      - name: Build workers
        run: npm run build:workers

      - name: Verify individual battle replay bundle
        run: |
          grep -q "tower-win-debug" browser/tower-worker.js
          grep -q "winningRuns" browser/tower-worker.js
          grep -q "Every win is listed individually" src/tower-win-logs-ui.js

      - name: Publish generated worker and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/publish-individual-tower-win-logs.yml
          git add browser/tower-worker.js .github/workflows/publish-individual-tower-win-logs.yml
          git commit -m "Build individual Tower winning battle replay"
          git pull --rebase origin main
          git push origin HEAD:main
