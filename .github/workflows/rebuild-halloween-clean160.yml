name: Verify clean Halloween Tower and build workers
# Re-run after updating Christmas eligibility assertions.
on:
  push:
    branches: [halloween-clean-160-decksearch-20261025]
    paths:
      - '.github/workflows/rebuild-halloween-clean160.yml'
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: npm ci
      - run: npm run check
      - run: npm run build:workers
      - name: Update both compiled worker bundles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add browser/depths-worker.js browser/tower-worker.js
          git diff --cached --quiet && exit 0
          git commit -m "Build 160 ATK Halloween combat worker bundles"
          git fetch origin halloween-clean-160-decksearch-20261025
          git rebase origin/halloween-clean-160-decksearch-20261025
          git push origin HEAD:halloween-clean-160-decksearch-20261025
