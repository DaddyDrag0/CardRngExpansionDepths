name: Rebuild Halloween combat workers
on:
  push:
    branches: [halloween-combat-abilities-phase2-20261024]
    paths:
      - '.github/workflows/rebuild-halloween-combat-workers.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: npm ci
      - run: npx tsx scripts/halloween-combat-regression.ts
      - run: npm run build:workers
      - name: Publish generated bundles to branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add browser/depths-worker.js browser/tower-worker.js
          git commit -m "Rebuild Halloween combat worker bundles" || exit 0
          git push origin HEAD:halloween-combat-abilities-phase2-20261024
