name: Rebuild compact Halloween Tower worker
# Rerun after updating the compact 160 ATK UI assertion.
on:
  push:
    branches: [halloween-ban-abomination-copytrim-20261026]
    paths:
      - '.github/workflows/rebuild-halloween-compact-20261026.yml'
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: npm ci
      - run: npm run check
      - run: npm run build:workers
      - name: Update compiled workers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add browser/depths-worker.js browser/tower-worker.js
          git diff --cached --quiet && exit 0
          git commit -m "Build Halloween Abomination ban workers"
          git fetch origin halloween-ban-abomination-copytrim-20261026
          git rebase origin/halloween-ban-abomination-copytrim-20261026
          git push origin HEAD:halloween-ban-abomination-copytrim-20261026
