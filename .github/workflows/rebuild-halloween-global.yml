name: Build global Halloween deck search workers
# Final build: default 1qd engine model and all-card placement coverage.
on:
  push:
    branches: [halloween-global-strategy-search-20261025]
    paths:
      - '.github/workflows/rebuild-halloween-global.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: npm ci
      - run: npm run check
      - run: npm run build:workers
      - name: Commit generated workers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add browser/depths-worker.js browser/tower-worker.js
          git diff --cached --quiet && exit 0
          git commit -m "Build global Halloween optimizer workers"
          git fetch origin halloween-global-strategy-search-20261025
          git rebase origin/halloween-global-strategy-search-20261025
          git push origin HEAD:halloween-global-strategy-search-20261025
