name: Build adaptive Halloween Tower labels and workers
on:
  push:
    branches: [halloween-adaptive-tablebase-availability-20261025]
    paths:
      - '.github/workflows/rebuild-halloween-learning.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: npm ci
      - run: npm run check
      - name: Check training label generator
        run: |
          npm run halloween:labels -- --rows 3 --runs 4 --seed 123 --out /tmp/halloween-training-test.jsonl
          node --input-type=module -e "import fs from 'node:fs';const a=fs.readFileSync('/tmp/halloween-training-test.jsonl','utf8').trim().split('\n').map(JSON.parse);if(a.length!==3||!a.every(x=>x.estimated&&x.rulesFingerprint&&x.winInterval&&new Set(x.allies).size===4))process.exit(1);console.log('Valid versioned Halloween training rows:',a.length)"
      - run: npm run build:workers
      - name: Publish compiled simulator workers on review branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add browser/depths-worker.js browser/tower-worker.js
          git diff --cached --quiet && exit 0
          git commit -m "Compile adaptive Halloween Tower worker bundles"
          git fetch origin halloween-adaptive-tablebase-availability-20261025
          git rebase origin/halloween-adaptive-tablebase-availability-20261025
          git push origin HEAD:halloween-adaptive-tablebase-availability-20261025
