name: Rebuild Halloween phase 4 combat workers
on:
  push:
    branches: [halloween-cross-card-regression-phase4-20261024]
    paths:
      - '.github/workflows/rebuild-halloween-phase4.yml'
permissions:
  contents: write
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: npm ci
      - run: npm run check
      - run: npm run build:workers
      - name: Publish generated worker bundles on review branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add browser/depths-worker.js browser/tower-worker.js
          git diff --cached --quiet && exit 0
          git commit -m "Rebuild Halloween phase 4 browser workers"
          git fetch origin halloween-cross-card-regression-phase4-20261024
          git rebase origin/halloween-cross-card-regression-phase4-20261024
          git push origin HEAD:halloween-cross-card-regression-phase4-20261024
