name: Build Halloween Tower calculator workers
on:
  push:
    branches: [halloween-tower-mode-20261024]
    paths:
      - '.github/workflows/rebuild-halloween-tower.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: npm ci
      - run: npm run check
      - run: npm run build:workers
      - name: Commit generated workers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add browser/depths-worker.js browser/tower-worker.js
          git diff --cached --quiet && exit 0
          git commit -m "Build Halloween Tower browser worker bundles"
          git fetch origin halloween-tower-mode-20261024
          git rebase origin/halloween-tower-mode-20261024
          git push origin HEAD:halloween-tower-mode-20261024
