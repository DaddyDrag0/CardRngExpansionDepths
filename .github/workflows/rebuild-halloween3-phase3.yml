name: Rebuild Halloween3 phase 3 workers
on:
  push:
    branches: [halloween3-combat-seven-phase3-20261024]
    paths:
      - '.github/workflows/rebuild-halloween3-phase3.yml'
      - 'scripts/halloween-combat-regression.ts'
      - 'src/engine/battle-v2.ts'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: npm ci
      - run: npm run check
      - run: npm run build:workers
      - name: Publish browser bundles to feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add browser/depths-worker.js browser/tower-worker.js
          git diff --cached --quiet && exit 0
          git commit -m "Rebuild Halloween3 phase 3 browser workers"
          git fetch origin halloween3-combat-seven-phase3-20261024
          git rebase origin/halloween3-combat-seven-phase3-20261024
          git push origin HEAD:halloween3-combat-seven-phase3-20261024
