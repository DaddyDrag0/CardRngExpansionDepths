name: Verify Horseman Infinite preview and build workers
# Retry after type-narrowing fix for Infinite mode.
on:
  push:
    branches: [horseman-halloween-infinite-source-20261026]
    paths:
      - '.github/workflows/rebuild-horseman-20261026.yml'
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: npm ci
      - run: npm run check
      - run: npm run build:workers
      - name: Commit built workers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add browser/depths-worker.js browser/tower-worker.js
          git diff --cached --quiet && exit 0
          git commit -m "Rebuild Horseman source-derived workers"
          git fetch origin horseman-halloween-infinite-source-20261026
          git rebase origin/horseman-halloween-infinite-source-20261026
          git push origin HEAD:horseman-halloween-infinite-source-20261026
