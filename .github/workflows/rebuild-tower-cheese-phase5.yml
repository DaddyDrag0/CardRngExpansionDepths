name: Rebuild Tower Cheese phase 5 workers
on:
  push:
    branches: [tower-cheese-fair-seeds-phase5-20261024]
    paths:
      - '.github/workflows/rebuild-tower-cheese-phase5.yml'
permissions:
  contents: write
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: npm ci
      - run: npm run check
      - run: npm run build:workers
      - name: Commit generated review-branch workers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add browser/depths-worker.js browser/tower-worker.js
          git diff --cached --quiet && exit 0
          git commit -m "Rebuild Tower Cheese phase 5 browser workers"
          git fetch origin tower-cheese-fair-seeds-phase5-20261024
          git rebase origin/tower-cheese-fair-seeds-phase5-20261024
          git push origin HEAD:tower-cheese-fair-seeds-phase5-20261024
