name: Remove cheese log sorters v2
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/remove-cheese-log-sorters-v2.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch UI
        run: echo '' | base64 -d | python3
      - name: Validate
        run: |
          node --check src/tower-win-logs-ui.js
          test "$(grep -c 'data-win-sort' src/tower-win-logs-ui.js || true)" = "0"
          test "$(grep -c 'sortMode' src/tower-win-logs-ui.js || true)" = "0"
          test "$(grep -c 'Fastest wins' src/tower-win-logs-ui.js || true)" = "0"
          test "$(grep -c 'Slowest wins' src/tower-win-logs-ui.js || true)" = "0"
          test "$(grep -c 'Outcome pattern' src/tower-win-logs-ui.js || true)" = "0"
          grep -q 'fallen:' src/tower-win-logs-ui.js
          grep -q 'tower-win-logs-ui.js?rev=4' index.html
      - name: Publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/remove-cheese-log-sorters.yml .github/workflows/remove-cheese-log-sorters-v2.yml
          git add -A
          git commit -m "Simplify cheese winning battle logs"
          git pull --rebase origin main
          git push origin HEAD:main
