name: Remove Ruby Aura Borders

on:
  push:
    branches: [remove-ruby-auras]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: remove-ruby-auras
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Remove Ruby from Aura borders
        run: python3 scripts/remove-ruby-auras.py
      - run: npm ci
      - run: npm run check
      - name: Build browser workers
        run: npm run build:workers
      - name: Bump site version
        run: |
          printf '{"version":"%s"}\n' "$(date -u +%Y%m%d-%H%M%SZ)" > site-version.json
      - name: Publish correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f scripts/remove-ruby-auras.py .github/workflows/remove-ruby-auras.yml
          git add -A
          git commit -m "Remove Ruby aura borders"
          git push origin HEAD:remove-ruby-auras
