name: Remove True Prophet from cheese finder

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/remove-true-prophet-cheese.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Remove True Prophet from cheese options
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # Engine search pool: True Prophet is no longer a valid cheese-search card.
          p = Path('src/engine/tower.ts')
          s = p.read_text()
          s = s.replace("const SINGLE_COPY_CHEESE_CARDS = new Set(['Parallax', 'Fate Seamstress'])\n", "const SINGLE_COPY_CHEESE_CARDS = new Set(['Parallax', 'Fate Seamstress'])\nconst DISABLED_CHEESE_CARDS = new Set(['True Prophet'])\n", 1)
          s = s.replace("  'Noveau Riche',\n  'True Prophet',\n] as const", "  'Noveau Riche',\n] as const", 1)
          s = s.replace("    .filter((card) => Boolean(card && !card.unobtainable))", "    .filter((card) => Boolean(card && !card.unobtainable && !DISABLED_CHEESE_CARDS.has(card.name)))", 1)
          s = s.replace("  return [...new Set([...resolved, ...added])].filter((name) => !excluded.has(name))", "  return [...new Set([...resolved, ...added])].filter((name) => !excluded.has(name) && !DISABLED_CHEESE_CARDS.has(name))", 1)
          p.write_text(s)

          # Browser UI + quick deterministic chooser: hide and reject True Prophet.
          p = Path('index-base.html')
          s = p.read_text()
          old_defaults = "const TOWER_DEFAULT_CHEESE_CARDS=['Judgment Day','Robin Hood','Parallax','Pandora','Kuchisake-onna','Fate Seamstress','Kira','Surtr','Control Freak',\"Hell's Army\",'Noveau Riche','True Prophet'];"
          new_defaults = "const TOWER_DEFAULT_CHEESE_CARDS=['Judgment Day','Robin Hood','Parallax','Pandora','Kuchisake-onna','Fate Seamstress','Kira','Surtr','Control Freak',\"Hell's Army\",'Noveau Riche'];\n  const TOWER_DISABLED_CHEESE_CARDS=new Set(['True Prophet']);"
          if old_defaults not in s:
              raise SystemExit('default cheese card list not found')
          s = s.replace(old_defaults, new_defaults, 1)
          s = s.replace("const TOWER_TRUE_PROPHET_BRIDGES=new Set(['Limitless']);", "const TOWER_TRUE_PROPHET_BRIDGES=new Set();", 1)
          old_render = "activePool=[...new Set([...defaultPool,...state.towerAddedCards])].filter(name=>!state.towerExcludedCards.includes(name)),poolQ=state.towerPoolQuery.trim().toLowerCase(),poolSuggestions=poolQ?towerAutocompleteCards(poolQ,false).filter(card=>!defaultPool.includes(card.name)&&!state.towerAddedCards.includes(card.name)).slice(0,8):[];"
          new_render = "activePool=[...new Set([...defaultPool,...state.towerAddedCards])].filter(name=>!state.towerExcludedCards.includes(name)&&!TOWER_DISABLED_CHEESE_CARDS.has(name)),poolQ=state.towerPoolQuery.trim().toLowerCase(),poolSuggestions=poolQ?towerAutocompleteCards(poolQ,false).filter(card=>!TOWER_DISABLED_CHEESE_CARDS.has(card.name)&&!defaultPool.includes(card.name)&&!state.towerAddedCards.includes(card.name)).slice(0,8):[];"
          if old_render not in s:
              raise SystemExit('tower pool render expression not found')
          s = s.replace(old_render, new_render, 1)
          s = s.replace("${state.towerAddedCards.map(name=>`<button type=\"button\" class=\"tower-pool-chip added\"", "${state.towerAddedCards.filter(name=>!TOWER_DISABLED_CHEESE_CARDS.has(name)).map(name=>`<button type=\"button\" class=\"tower-pool-chip added\"", 1)
          old_add = "if(!card||card.unobtainable||TOWER_DEFAULT_CHEESE_CARDS.includes(name)||state.towerAddedCards.includes(name))return;"
          new_add = "if(!card||card.unobtainable||TOWER_DISABLED_CHEESE_CARDS.has(name)||TOWER_DEFAULT_CHEESE_CARDS.includes(name)||state.towerAddedCards.includes(name))return;"
          if old_add not in s:
              raise SystemExit('tower pool add guard not found')
          s = s.replace(old_add, new_add, 1)
          p.write_text(s)

          # Regression: make sure Prophet cannot return through defaults or user-added cards.
          p = Path('scripts/tower-cheese-search-regression.ts')
          s = p.read_text()
          s = s.replace(", 'Noveau Riche', 'True Prophet'])", ", 'Noveau Riche'])", 1)
          anchor = "assert.equal(customPool.includes('Behemoth'), true, 'User-added cards must be included in the cheese search pool')\n"
          if anchor not in s:
              raise SystemExit('cheese regression anchor not found')
          extra = "assert.equal(pool.includes('True Prophet'), false, 'True Prophet must not be offered by the cheese finder')\nconst prophetAddPool = towerCheeseCandidatePool({ addedCards: ['True Prophet'] })\nassert.equal(prophetAddPool.includes('True Prophet'), false, 'True Prophet must stay disabled even if present in saved/custom cheese cards')\n"
          s = s.replace(anchor, anchor + extra, 1)
          p.write_text(s)

          Path('site-version.json').write_text('{"version":"20260909-remove-true-prophet-cheese-1"}\n')
          PY
      - name: Validate
        run: npm run check
      - name: Build browser workers
        run: npm run build:workers
      - name: Verify removal
        run: |
          ! grep -q "'True Prophet',$" src/engine/tower.ts
          grep -q "DISABLED_CHEESE_CARDS = new Set(\['True Prophet'\])" src/engine/tower.ts
          grep -q "TOWER_DISABLED_CHEESE_CARDS=new Set(\['True Prophet'\])" index-base.html
          grep -q "True Prophet must not be offered" scripts/tower-cheese-search-regression.ts
      - name: Publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/remove-true-prophet-cheese.yml
          git add -A
          git commit -m "Remove True Prophet from Tower cheese finder"
          git pull --rebase origin main
          git push origin HEAD:main
