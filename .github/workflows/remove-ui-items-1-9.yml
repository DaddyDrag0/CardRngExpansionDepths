name: Remove UI items 1-9

on:
  push:
    paths:
      - 'scripts/remove-ui-items-1-9.mjs'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/remove-ui-items-1-9.mjs
      - run: npm install
      - run: npm run build
      - run: npm run test:engine
      - run: npm run test:depths
      - run: npm run test:player
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/engine-check.yml
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Remove AI-style UI elements"
            git push
          fi
