name: Repository Cleanup

on:
  push:
    branches: [main]
    paths:
      - scripts/repo-cleanup.py
      - .github/workflows/repo-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Repair support-set duplicate parser
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/repo-cleanup.py')
          s = p.read_text()
          old = '''items = re.findall(r"['\\\"]([^'\\\"]+)['\\\"]", match.group(1))\nset_dupes = sorted({name for name in items if items.count(name) > 1})'''
          new = '''literal_pattern = re.compile(r"'((?:\\\\.|[^'\\\\])*)'|\\\"((?:\\\\.|[^\\\"\\\\])*)\\\"")\nitems = [single or double for single, double in literal_pattern.findall(match.group(1))]\nset_dupes = sorted({name for name in items if items.count(name) > 1})'''
          if old not in s:
              raise SystemExit('FULLY_SUPPORTED parser anchor not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Apply structural cleanup
        run: python3 scripts/repo-cleanup.py
      - name: Repair generated cleanup files
        shell: bash
        run: |
          cat > src/data/cards.ts <<'TS'
          import batch1 from './cards-1.json'
          import batch2 from './cards-2.json'
          import batch3 from './cards-3.json'
          import batch4 from './cards-4.json'
          import batch5 from './cards-5.json'
          import batch6 from './cards-6.json'
          import batch7 from './cards-7.json'
          import type { CardDefinition } from '../types'

          export const cards = [
            ...batch1,
            ...batch2,
            ...batch3,
            ...batch4,
            ...batch5,
            ...batch6,
            ...batch7,
          ] as CardDefinition[]

          export default cards
          TS
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/data-integrity.ts')
          s = p.read_text()
          old = "  assert(Number.isFinite(card.rarity) && card.rarity > 0, `${card.name} has invalid rarity`)"
          new = "  assert(Number.isFinite(card.rarity) && card.rarity >= 0, `${card.name} has invalid rarity`)"
          if old not in s:
              raise SystemExit('rarity integrity anchor not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Refresh package lock
        run: npm install --package-lock-only
      - name: Install cleaned dependencies
        run: npm ci
      - name: Run full repository checks
        run: npm run check
      - name: Build both browser workers
        run: npm run build:workers
      - name: Verify repository cleanliness
        shell: bash
        run: |
          git diff --check
          test ! -e src/App.tsx
          test ! -e src/main.tsx
          test ! -e src/engine/battle.ts
          test ! -e scripts/apply-current-fixes.mjs
          test -e .github/workflows/engine-check.yml
          test -e .github/workflows/resolve-thumbnails.yml
          node -e "const p=require('./package.json'); if(p.dependencies) throw new Error('runtime dependencies should be empty'); if(!p.devDependencies.esbuild) throw new Error('esbuild must be direct dev dependency')"
      - name: Commit cleaned repository
        shell: bash
        run: |
          rm scripts/repo-cleanup.py .github/workflows/repo-cleanup.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Clean repository structure and enforce data integrity"
          git push
