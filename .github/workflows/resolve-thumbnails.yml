name: Cache Roblox thumbnails

on:
  push:
    paths:
      - 'src/data/cards-*.json'
      - 'src/data/auras-*.json'
      - 'scripts/resolve-thumbnails.mjs'
      - '.github/workflows/resolve-thumbnails.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Resolve thumbnails
        run: node scripts/resolve-thumbnails.mjs
      - name: Commit thumbnail cache
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/thumbnails.json
          if ! git diff --cached --quiet; then
            git commit -m "Update Roblox thumbnail cache"
            git push
          fi
