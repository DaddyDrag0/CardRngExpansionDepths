name: Set Tower 10,000 runs

on:
  push:
    paths:
      - '.github/workflows/set-tower-10000-runs.yml'
      - 'scripts/set_tower_10000_runs.py'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: python scripts/set_tower_10000_runs.py
      - name: Verify
        run: |
          python - <<'PY'
          from pathlib import Path
          html=Path('index.html').read_text()
          assert 'towerRuns:10000' in html
          assert 'towerRuns:1000,' not in html
          assert 'Very low success rate.' in html
          assert 'sim.wins<50' in html
          assert '!fixed' in html
          start=html.index('<script>')+len('<script>')
          end=html.rindex('</script>')
          Path('/tmp/page.js').write_text(html[start:end])
          print('Tower 10,000-run assertions passed.')
          PY
          node --check /tmp/page.js
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Run Tower cheese simulations 10,000 times"
            git push
          fi
