name: Show Rare Weather average

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/show-rare-weather-average.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 scripts/show-rare-weather-average.py
      - name: Publish display update
        run: |
          rm .github/workflows/show-rare-weather-average.yml scripts/show-rare-weather-average.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Show Rare Weather average amount"
          git pull --rebase origin main
          git push origin HEAD:main
