name: Simplify potion rewards UI

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/simplify-potion-rewards-ui.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 scripts/simplify-potion-rewards-ui.py
      - name: Publish cleanup
        run: |
          rm .github/workflows/simplify-potion-rewards-ui.yml scripts/simplify-potion-rewards-ui.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Simplify Depths potion reward display"
          git pull --rebase origin main
          git push origin HEAD:main
