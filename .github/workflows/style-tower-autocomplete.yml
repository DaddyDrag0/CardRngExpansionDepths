name: Style Tower autocomplete

on:
  push:
    paths:
      - '.github/workflows/style-tower-autocomplete.yml'
      - 'scripts/style_tower_autocomplete.py'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: python scripts/style_tower_autocomplete.py
      - name: Verify
        run: |
          python - <<'PY'
          from pathlib import Path
          html=Path('index.html').read_text()
          assert 'bindTowerAutocomplete' in html
          assert 'tower-suggestions' in html
          assert 'Search any card...' in html
          assert 'list="towerCards"' not in html
          assert '<datalist id="towerCards">' not in html
          start=html.index('<script>')+len('<script>')
          end=html.rindex('</script>')
          Path('/tmp/page.js').write_text(html[start:end])
          print('Themed Tower autocomplete assertions passed.')
          PY
          node --check /tmp/page.js
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Replace Tower native dropdowns with themed autocomplete"
            git push
          fi
