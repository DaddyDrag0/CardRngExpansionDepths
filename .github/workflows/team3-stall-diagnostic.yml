name: Team 3 stall diagnostic

on:
  push:
    paths:
      - 'scripts/team3-stall-diagnostic.ts'

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx --no-install tsx scripts/team3-stall-diagnostic.ts
