name: Temporary Amaterasu ban test
on:
  push:
    branches: [tmp-amat-test-20261008]
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install
      - run: npx tsx scripts/temp-amat-test.ts
