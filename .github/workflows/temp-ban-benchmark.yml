name: Temporary ban benchmark
on:
  push:
    branches: [tmp-ban-benchmark-20261008]
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install
      - run: npx tsx scripts/temp-ban-benchmark.ts
