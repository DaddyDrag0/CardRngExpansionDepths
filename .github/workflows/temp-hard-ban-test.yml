name: Temporary hard-mode ban test
on:
  push:
    branches: [tmp-hard-ban-test-20261008]
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install
      - run: npx tsx scripts/temp-hard-ban-test.ts
