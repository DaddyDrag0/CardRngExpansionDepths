name: Tower Cheese Search

on:
  push:
    branches: [agent/tower-cheese-search]
    paths:
      - scripts/apply-tower-cheese-ui.py
      - .github/workflows/tower-cheese-search.yml
      - src/engine/tower.ts
      - src/tower-worker.ts
      - scripts/tower-cheese-search-regression.ts
      - package.json

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/tower-cheese-search
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply Tower cheese UI
        run: python scripts/apply-tower-cheese-ui.py
      - name: Build browser workers
        run: npm run build:workers
      - name: Verify search wiring
        run: |
          grep -q "tower-cheese-search" src/tower-worker.ts
          grep -q "Sable The Envious" src/engine/tower.ts
          grep -q "Noveau Riche" src/engine/tower.ts
          grep -q "Search Cheese Decks" index.html
          grep -q "Recommended cheese decks" index.html
          grep -q "Load &amp; Simulate" index.html
          grep -q "tower-cheese-search" browser/tower-worker.js
      - name: Verify full project
        run: npm run check
      - name: Remove temporary files
        run: |
          rm scripts/apply-tower-cheese-ui.py
          rm .github/workflows/tower-cheese-search.yml
      - name: Commit tested update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add simulated Tower cheese search"
          git push origin HEAD:agent/tower-cheese-search
