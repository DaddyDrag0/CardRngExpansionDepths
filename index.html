  function persist(){try{localStorage.setItem(STORAGE,JSON.stringify({teams:state.teams.map(t=>({cards:t.cards,statAura:t.statAura,statAuraBorder:t.statAuraBorder,abilityAura:t.abilityAura,abilityAuraBorder:t.abilityAuraBorder})),activeTeam:state.activeTeam,runs:state.runs,cap:state.cap,seed:state.seed}))}catch(_){}}

  function render(){if(state.view==='tower')return renderTower();const team=current(),q=state.query.trim().toLowerCase(),shown=state.cards.filter(c=>!c.unobtainable).filter(c=>!q||c.name.toLowerCase().includes(q)||(c.ability||'').toLowerCase().includes(q)).sort((a,b)=>b.rarity-a.rarity).slice(0,100),ready=state.teams.filter(complete).length,results=state.teams.map(resultCard).filter(Boolean).join('');root.innerHTML=`<main class="shell"><header class="topbar"><div><p class="kicker">CARD RNG EXPANSION</p><h1>Depths Calculator</h1></div></header><div class="team-tabs">${state.teams.map((t,i)=>`<button data-team-tab="${i}" class="${i===state.activeTeam?'on':''}"><span>Team ${i+1}</span><i>${t.result?`Range ${compact(t.result.estimatedFloorLow)}–${compact(t.result.estimatedFloorHigh)}`:complete(t)?'Ready':'Empty'}</i></button>`).join('')}<button data-tower-tab class="tower-tab"><span>Tower</span><i>Cheese maker</i></button><button data-duplicate class="tab-action">Duplicate</button></div><section class="workspace"><article class="panel loadout"><div class="panel-head"><div><span class="kicker">LOADOUT</span><h3>Team ${state.activeTeam+1}</h3></div><div class="panel-actions"><button class="text-button" data-copy-team>Copy code</button><button class="text-button" data-import-team>Import code</button><button class="text-button danger-lite" data-clear-team>Clear team</button></div></div><div class="team-list">${team.cards.map((slot,index)=>{const card=cardByName(slot.cardName);if(!card)return `<button class="team-row empty-team-card ${state.activeSlot===index?'active':''}" data-slot="${index}"><span class="slot">0${index+1}</span>${portrait(null,'portrait')}<span class="card-copy"><span class="name-line"><b>Select a card</b></span><span class="numbers">Choose from the library</span></span></button>`;const hp=getHealth(card,slot.borders),atk=getAttack(card,slot.borders);return `<button class="team-row ${state.activeSlot===index?'active':''}" data-slot="${index}" data-tooltip-card="${esc(card.name)}"><span class="slot">0${index+1}</span>${portrait(card,'portrait')}<span class="card-copy"><span class="name-line"><b>${esc(card.name)}</b><em>${esc(card.ability||'No ability')}</em></span><span class="numbers"><i><b>${compact(hp)}</b> HP</i><i><b>${compact(atk)}</b> ATK</i></span><span class="border-pills">${CARD_BORDERS.map(b=>`<label class="${slot.borders.includes(b)?'on':''}" data-border="${b}" data-border-slot="${index}">${b}</label>`).join('')}</span></span></button>`}).join('')}</div><div class="aura-grid">${auraBlock('Stat','Stat Aura','statAura','statAuraBorder')}${auraBlock('Skill','Ability Aura','abilityAura','abilityAuraBorder')}</div></article><article class="panel library"><div class="panel-head"><div><span class="kicker">Cards</span><h3>Team ${state.activeSlot+1}</h3></div><small>${shown.length} shown</small></div><input class="search" id="cardSearch" value="${esc(state.query)}" placeholder="Search card or ability…" autocomplete="off"><div class="library-list">${shown.length?shown.map(card=>`<button data-card="${esc(card.name)}" data-tooltip-card="${esc(card.name)}" class="${team.cards[state.activeSlot]?.cardName===card.name?'selected':''}">${portrait(card)}<span><b>${esc(card.name)}</b><small>${esc(card.ability||'No ability')}</small></span><em>1 / ${compact(card.rarity)}</em></button>`).join(''):'<div class="empty-state">No matching cards.</div>'}</div></article><article class="panel simulation"><div class="panel-head"><div><span class="kicker">DEPTHS TEST</span><h3>Run simulator</h3></div><small>${ready}/5 teams ready</small></div><div class="simulation-body"><div class="sim-field"><span>Runs per team</span><div class="run-options">${[1,3,8,15,30,50].map(n=>`<button data-runs="${n}" class="${state.runs===n?'on':''}">${n}</button>`).join('')}</div></div><label class="sim-field"><span>Floor cap</span><input id="capInput" type="number" min="1" max="50000" value="${state.cap}"></label><div class="sim-actions">${state.running?`<button class="secondary-run" disabled>${esc(state.runningLabel||'Starting simulation…')}</button><button class="sim-run" data-cancel-run>Cancel simulation</button>`:`<button class="secondary-run" data-run-active ${!complete(team)?'disabled':''}>Test Team ${state.activeTeam+1}</button><button class="sim-run" data-run-ready ${ready===0?'disabled':''}>Test ${ready} Ready Team${ready===1?'':'s'}</button>`}</div>${state.running?`<p class="sim-footnote">Runs execute in parallel. Long battles show the exact enemy lineup; 150-turn no-progress matchups resolve using the previous behavior; any battle that reaches 10,000 total turns ends as a loss instead of hanging.</p>`:''}</div></article></section><section class="results-panel"><div class="results-title"><div><span class="kicker">DEPTHS TEST RESULTS</span><h3>${results?'Team comparison':'No simulations yet'}</h3></div>${results?'<button class="text-button" data-clear-results>Clear results</button>':''}</div>${results?`<div class="result-grid">${results}</div>`:'<div class="results-empty">Build a complete four-card team, choose any auras you use, then run a test.</div>'}</section><footer><span>Card RNG Expansion Depths Calculator</span></footer></main>`;bindEvents();bindTooltips()}
  function bindEvents(){root.querySelector('[data-tower-tab]')?.addEventListener('click',()=>{state.view='tower';state.towerResult=null;render()});root.querySelectorAll('[data-debug-run]').forEach(el=>{const open=()=>showRunDebug(Number(el.dataset.debugTeam),Number(el.dataset.debugRun));el.addEventListener('click',open);el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();open()}})});root.querySelectorAll('[data-team-tab]').forEach(el=>el.addEventListener('click',()=>{state.activeTeam=Number(el.dataset.teamTab);state.activeSlot=0;persist();render()}));root.querySelector('[data-duplicate]')?.addEventListener('click',()=>{const dst=(state.activeTeam+1)%5,src=current();state.teams[dst]={...blankTeam(),cards:src.cards.map(s=>({cardName:s.cardName,borders:[...s.borders]})),statAura:src.statAura,statAuraBorder:src.statAuraBorder,abilityAura:src.abilityAura,abilityAuraBorder:src.abilityAuraBorder};state.activeTeam=dst;state.activeSlot=0;persist();render()});root.querySelector('[data-copy-team]')?.addEventListener('click',async()=>{const code=encodeTeam(current());try{await navigator.clipboard.writeText(code);const button=root.querySelector('[data-copy-team]');if(button){button.textContent='Copied!';setTimeout(()=>{if(button.isConnected)button.textContent='Copy code'},900)}}catch(_){prompt('Copy this team code:',code)}});root.querySelector('[data-import-team]')?.addEventListener('click',()=>{const code=prompt('Paste a CRE1 team code:');if(!code)return;try{state.teams[state.activeTeam]=decodeTeam(code);state.activeSlot=0;persist();render()}catch(error){alert(`Could not import team: ${error.message||error}`)}});root.querySelector('[data-clear-team]')?.addEventListener('click',()=>{state.teams[state.activeTeam]=blankTeam();state.activeSlot=0;persist();render()});root.querySelector('[data-clear-results]')?.addEventListener('click',()=>{state.teams.forEach(t=>{t.result=null;t.elapsedMs=0;t.lastError=''});render()});root.querySelectorAll('[data-slot]').forEach(el=>el.addEventListener('click',e=>{if(e.target.closest('[data-border]'))return;state.activeSlot=Number(el.dataset.slot);render()}));root.querySelectorAll('[data-border]').forEach(el=>el.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();const slot=current().cards[Number(el.dataset.borderSlot)],b=el.dataset.border;slot.borders=slot.borders.includes(b)?slot.borders.filter(x=>x!==b):[...slot.borders,b];current().result=null;persist();render()}));root.querySelectorAll('[data-card]').forEach(el=>el.addEventListener('click',()=>{current().cards[state.activeSlot].cardName=el.dataset.card;current().result=null;persist();render()}));const search=root.querySelector('#cardSearch');search?.addEventListener('input',()=>{state.query=search.value;render();requestAnimationFrame(()=>{const n=root.querySelector('#cardSearch');n?.focus();n?.setSelectionRange(n.value.length,n.value.length)})});root.querySelectorAll('[data-aura-select]').forEach(el=>el.addEventListener('change',()=>{current()[el.dataset.auraSelect]=el.value;current().result=null;persist();render()}));root.querySelectorAll('[data-aura-border]').forEach(el=>el.addEventListener('click',()=>{current()[el.dataset.auraBorderKey]=el.dataset.auraBorder;current().result=null;persist();render()}));root.querySelectorAll('[data-runs]').forEach(el=>el.addEventListener('click',()=>{state.runs=Number(el.dataset.runs);persist();render()}));root.querySelector('#capInput')?.addEventListener('change',e=>{state.cap=Math.min(50000,Math.max(1,Number(e.target.value)||50000));persist();render()});root.querySelector('[data-run-active]')?.addEventListener('click',()=>runTeams([state.activeTeam]));root.querySelector('[data-run-ready]')?.addEventListener('click',()=>runTeams(state.teams.map((t,i)=>complete(t)?i:-1).filter(i=>i>=0)));root.querySelector('[data-cancel-run]')?.addEventListener('click',cancelSimulation)}
function bindTooltips(){const show=el=>{const card=cardByName(el.dataset.tooltipCard);if(!card)return;const desc=state.abilities[card.ability]||'No ability description found.';tooltip.innerHTML=`<div class="tip-name">${esc(card.name)}</div><div class="tip-ability">${esc(card.ability||'No ability')}</div><div class="tip-desc">${esc(desc)}</div><div class="tip-rarity">Base rarity: 1 / ${Number(card.rarity||0).toLocaleString('en-US')}</div>`;tooltip.classList.add('show');const r=el.getBoundingClientRect(),w=Math.min(320,window.innerWidth-24);let left=r.right+10;if(left+w>window.innerWidth-12)left=Math.max(12,r.left-w-10);tooltip.style.left=`${left}px`;tooltip.style.top=`${Math.min(window.innerHeight-180,Math.max(12,r.top))}px`};const hide=()=>tooltip.classList.remove('show');root.querySelectorAll('[data-tooltip-card]').forEach(el=>{el.addEventListener('mouseenter',()=>show(el));el.addEventListener('mouseleave',hide);el.addEventListener('focus',()=>show(el));el.addEventListener('blur',hide)})}
  let towerWorker=null,towerRequestId=0,towerPendingId=0;
  function startTowerWorker(){
    try{
      towerWorker=new Worker('./browser/tower-worker.js');
      towerWorker.onmessage=e=>{
        if(e.data?.id!==towerPendingId)return;
        if(e.data.kind==='tower-progress'){
          state.towerSimLabel=`${full(e.data.completed||0)} / ${full(e.data.total||state.towerRuns)}`;
          render();
          return;
        }
        state.towerSimRunning=false;state.towerSimLabel='';towerPendingId=0;
        if(e.data.ok)state.towerSim={...e.data.result,elapsedMs:e.data.elapsedMs};
        else state.towerSim={error:e.data.error||'Tower simulation failed.'};
        render();
      };
      towerWorker.onerror=e=>{state.towerSimRunning=false;state.towerSimLabel='';towerPendingId=0;state.towerSim={error:e.message||'Tower simulation worker failed.'};render()};
    }catch(_){towerWorker=null}
  }
  function towerLoadout(){
    const result=state.towerResult;if(!result?.picks)return null;
    return {cards:result.picks.map((p,i)=>({cardName:state.towerOverrides[i]||p.pick,borders:[]})),statAura:null,abilityAura:result.endTimesNeeded?{auraName:'End Times',border:null}:null};
  }
  function runTowerSimulation(){
    if(state.towerSimRunning||!state.towerResult?.picks)return;
    if(!towerWorker)startTowerWorker();
    if(!towerWorker){state.towerSim={error:'Tower simulation worker is unavailable. Refresh and try again.'};render();return}
    const loadout=towerLoadout();if(!loadout)return;
    const seedWords=new Uint32Array(1);crypto.getRandomValues(seedWords);const seed=seedWords[0]||((Date.now()^Math.floor(performance.now()*1000))>>>0);
    const id=++towerRequestId;towerPendingId=id;state.towerSimRunning=true;state.towerSim=null;state.towerSimLabel=`0 / ${full(state.towerRuns)}`;render();
    towerWorker.postMessage({id,kind:'tower-batch',loadout,enemyNames:[...state.towerEnemies],floor:state.towerFloor,difficulty:state.towerDifficulty,runs:state.towerRuns,seed});
  }
  let worker=null,requestId=0;const pending=new Map();
  function startWorker(){try{worker=new Worker('./browser/depths-worker.js');worker.onmessage=e=>{const p=pending.get(e.data.id);if(!p)return;if(e.data.kind==='progress'){const now=performance.now(),done=e.data.completedRuns||0,total=e.data.totalRuns||state.runs,active=Number(e.data.activeRuns)||1,min=Number(e.data.minActiveFloor)||Number(e.data.floor)||1,max=Number(e.data.maxActiveFloor)||min,range=min===max?`Floor ${full(min)}`:`Floors ${full(min)}–${full(max)}`,turn=Number(e.data.battleTurn)||0,enemies=Array.isArray(e.data.enemies)?e.data.enemies:[],matchup=turn>=150&&enemies.length?` · vs ${enemies.join(' / ')}`:'';state.runningLabel=`Team ${p.teamIndex+1} · ${done}/${total} runs done · ${active} active · ${range}${turn?` · current T${turn}`:''}${matchup}`;if(now-state.lastProgressRender>250){state.lastProgressRender=now;render()}return}pending.delete(e.data.id);e.data.ok?p.resolve(e.data):p.reject(new Error(e.data.error||'Simulation failed'))};worker.onerror=e=>{for(const p of pending.values())p.reject(new Error(e.message||'Simulation worker failed'));pending.clear();state.workerReady=false};state.workerReady=true}catch(_){state.workerReady=false}}
  function cancelSimulation(){if(worker)worker.terminate();const error=new Error('Simulation cancelled');for(const p of pending.values())p.reject(error);pending.clear();state.workerReady=false;state.running=false;state.runningLabel='';startWorker();render()}
  function loadoutFor(team){return{cards:team.cards.map(s=>({cardName:s.cardName,borders:[...s.borders]})),statAura:team.statAura?{auraName:team.statAura,border:team.statAuraBorder||null}:null,abilityAura:team.abilityAura?{auraName:team.abilityAura,border:team.abilityAuraBorder||null}:null}}
  function askWorker(index,batchSeed){if(!worker||!state.workerReady)return Promise.reject(new Error('Simulation worker is unavailable. Refresh and try again.'));const id=++requestId,t=state.teams[index];return new Promise((resolve,reject)=>{pending.set(id,{resolve,reject,teamIndex:index});worker.postMessage({id,loadout:loadoutFor(t),runs:state.runs,floorCap:state.cap,seed:batchSeed>>>0})})}
  async function runTeams(indices){if(state.running||!indices.length)return;state.running=true;state.lastProgressRender=0;const seedWords=new Uint32Array(1);crypto.getRandomValues(seedWords);const batchSeed=seedWords[0]||((Date.now()^Math.floor(performance.now()*1000))>>>0);try{for(let order=0;order<indices.length;order++){const index=indices[order];state.runningLabel=`Starting Team ${index+1} · ${order+1}/${indices.length}`;render();try{const response=await askWorker(index,batchSeed);state.teams[index].lastSeed=batchSeed;state.teams[index].result=response.result;state.teams[index].elapsedMs=response.elapsedMs;state.teams[index].lastError=''}catch(error){if((error.message||String(error))==='Simulation cancelled')return;state.teams[index].result=null;state.teams[index].lastError=error.message||String(error);throw error}}}catch(error){console.error(error)}finally{state.running=false;state.runningLabel='';render()}}
  async function liveThumbs(){const missing=[...new Set([...state.cards,...state.auras].map(x=>x.imageAssetId).filter(id=>id&&!state.thumbs[String(id)]).map(String))];if(!missing.length)return;try{for(let i=0;i<missing.length;i+=20){const chunk=missing.slice(i,i+20),p=new URLSearchParams({assetIds:chunk.join(','),size:'420x420',format:'Png',isCircular:'false'}),r=await fetch(`https://thumbnails.roblox.com/v1/assets?${p}`,{credentials:'omit'});if(!r.ok)continue;const j=await r.json();for(const item of j.data||[])if(item.imageUrl)state.thumbs[String(item.targetId)]=item.imageUrl}render()}catch(_){}}
  async function load(){try{const cardFiles=[1,2,3,4,5,6,7].map(i=>fetch(`./src/data/cards-${i}.json`).then(r=>r.json())),auraFiles=[1,2].map(i=>fetch(`./src/data/auras-${i}.json`).then(r=>r.json())),abilityFiles=[1,2,3,4].map(i=>fetch(`./src/data/abilities-${i}.json`).then(r=>r.json())),thumbPromise=fetch('./src/data/thumbnails.json',{cache:'no-store'}).then(r=>r.ok?r.json():{}).catch(()=>({}));const[cardSets,auraSets,abilitySets,thumbs]=await Promise.all([Promise.all(cardFiles),Promise.all(auraFiles),Promise.all(abilityFiles),thumbPromise]);state.cards=cardSets.flat();state.auras=auraSets.flat();state.abilities=Object.assign({},...abilitySets);state.thumbs=thumbs||{};restore();startWorker();startTowerWorker();render();liveThumbs()}catch(err){console.error(err);root.innerHTML=`<div class="error-box"><b>Calculator failed to load.</b><br><br>${esc(err.message)}</div>`}}
  load();
