<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#080b10" />
  <title>Card RNG Expansion · Depths Calculator</title>
  <style>html,body{margin:0;background:#080b10;color:#8693a4;font-family:Inter,system-ui,sans-serif}.boot{min-height:100vh;display:grid;place-items:center}</style>
</head>
<body>
  <div class="boot">Loading Depths calculator…</div>
  <script>
  (async()=>{
    try{
      const response=await fetch('./index-base.html?rev=5',{cache:'no-store'});
      if(!response.ok)throw new Error(`HTTP ${response.status}`);
      let html=await response.text();
      const ambienceTags='  <script defer src="./src/blood-rain.js?rev=5"></'+'script>\n'+'  <script defer src="./src/lava-ambience.js?rev=6"></'+'script>\n';
      html=html.replace('</head>',ambienceTags+'</head>');
      document.open();
      document.write(html);
      document.close();
    }catch(error){
      document.body.innerHTML='<div class="boot">Failed to load the calculator. Refresh the page.</div>';
      console.error(error);
    }
  })();
  </script>
</body>
</html>
