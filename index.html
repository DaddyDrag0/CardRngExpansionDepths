<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#080b10" />
  <title>Card RNG Expansion · Depths Calculator</title>
  <link rel="stylesheet" href="./src/styles.css" />
  <style>
    .loading{min-height:100vh;display:grid;place-items:center;background:#080b10;color:#8693a4;font:14px Inter,system-ui,sans-serif}.intro.compact{grid-template-columns:1fr;padding-bottom:22px}.intro.compact h2{max-width:900px}.library-list button{min-height:53px}.empty-state{padding:28px 16px;text-align:center;color:#647286;font-size:11px}.status-chip{color:#87d8ca;border:1px solid #355e5a;background:rgba(135,216,202,.11);border-radius:999px;font-size:9px;letter-spacing:.1em;padding:5px 8px}.error-box{margin:80px auto;max-width:620px;border:1px solid #432a2a;background:#151013;color:#d9b4b4;padding:20px;border-radius:16px;font:13px system-ui;line-height:1.55}
    .aura-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:14px;border-top:1px solid var(--line)}.aura-card{border:1px solid #202b3a;background:#0a0f16;border-radius:13px;padding:12px;min-width:0}.aura-title{display:flex;align-items:center;gap:9px;margin-bottom:10px}.aura-title .mini-portrait{flex:0 0 auto}.aura-title span:last-child{min-width:0}.aura-title b{display:block;font-size:11px}.aura-title small{display:block;color:var(--muted);font-size:9px;margin-top:2px}.aura-card label{display:block;color:var(--muted);font-size:9px;text-transform:uppercase;letter-spacing:.1em;margin:0 0 5px 2px}.aura-card select{width:100%;color:var(--text);background:#0d141d;border:1px solid #263142;border-radius:9px;padding:9px 10px;outline:none}.aura-card select:focus{border-color:#4b817b}.aura-desc{min-height:48px;color:#9aa7b7;font-size:10px;line-height:1.45;padding:9px 2px 7px}.aura-exact{margin-top:7px;border-top:1px solid #1c2633;padding-top:8px;color:#c9d4df;font-size:9px;line-height:1.55}.aura-exact b{color:#87d8ca}.aura-border-pills{display:flex;gap:5px;flex-wrap:wrap}.aura-border-pills button{border:1px solid #253142;border-radius:999px;padding:4px 7px;font-size:9px;color:#748194;background:transparent;cursor:pointer}.aura-border-pills button.on{color:#cfeee8;border-color:#477b76;background:var(--accent-soft)}.simulation-body{padding:14px}.sim-note{border:1px solid #202b3a;background:#0a0f16;border-radius:12px;padding:13px;margin-bottom:12px}.sim-note b{display:block;font-size:12px;margin-bottom:4px}.sim-note p{color:var(--muted);font-size:10px;line-height:1.5}.run-options{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}.run-options button{border:1px solid #253142;background:#0b1119;color:#8390a0;border-radius:9px;padding:8px 11px;font-size:10px;cursor:pointer}.run-options button.on{color:#d7f2ed;border-color:#477b76;background:var(--accent-soft)}.sim-field{display:block;margin-top:13px}.sim-field>span{display:block;color:var(--muted);font-size:9px;text-transform:uppercase;letter-spacing:.1em;margin:0 0 5px 2px}.sim-field input{width:100%;color:var(--text);background:#0a0f16;border:1px solid #263142;border-radius:10px;padding:11px 12px;outline:none}.team-summary{display:grid;gap:6px;margin-top:14px}.team-summary>div{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid #1c2633;padding:7px 2px;color:#7f8b9a;font-size:10px}.team-summary b{color:#d8e1ea;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sim-run{width:100%;margin-top:15px;border:1px solid #314039;background:#18251f;color:#66766f;padding:12px;border-radius:10px;cursor:not-allowed}
    .portrait,.mini-portrait{position:relative}.fallback-letter{position:absolute;inset:0;display:grid;place-items:center;color:#647286;font-weight:800}.portrait img,.mini-portrait img{position:relative;z-index:1;background:#151d28}.card-tooltip{position:fixed;z-index:9999;width:min(320px,calc(100vw - 24px));pointer-events:none;opacity:0;transform:translateY(4px);transition:opacity .1s ease,transform .1s ease;background:#080d14;border:1px solid #334255;border-radius:12px;padding:12px 13px;box-shadow:0 18px 55px rgba(0,0,0,.48)}.card-tooltip.show{opacity:1;transform:translateY(0)}.card-tooltip .tip-name{font-size:12px;font-weight:750;color:#edf1f7}.card-tooltip .tip-ability{font-size:10px;font-weight:700;color:#87d8ca;margin-top:5px}.card-tooltip .tip-desc{font-size:10px;line-height:1.5;color:#9aa7b7;margin-top:4px}.card-tooltip .tip-rarity{font-size:9px;color:#5f6d7f;margin-top:8px}.team-row,.library-list button{position:relative}
    @media(max-width:760px){.aura-grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
<div id="root"><div class="loading">Loading Depths calculator…</div></div>
<div id="cardTooltip" class="card-tooltip"></div>
<script>
(() => {
  const root = document.getElementById('root');
  const tooltip = document.getElementById('cardTooltip');
  const CARD_BORDER_MULT = { Platinum:100, Crystal:10000, Ruby:100000, Galaxy:1000000 };
  const CARD_BORDERS = Object.keys(CARD_BORDER_MULT);
  const AURA_RARITY_MULT = { Platinum:10, Crystal:100, Galaxy:1000 };
  const AURA_BORDERS = Object.keys(AURA_RARITY_MULT);
  const AURA_TIER = { '':0, Platinum:1, Crystal:2, Galaxy:3 };
  const AURA_CUSTOM = {
    Berserker:[5,10,15,20],
    'Flame Wizard':[15,25,35,50],
    Shielder:[2,5,7,10],
    'Synth Human':[8,10,12,15]
  };
  const AURA_BOOSTED_PACK = {
    Neko:'Anime', Shrinemaiden:'Rising Sun', Shatbi:'Egypt', Taoist:'Immortal',
    Myhts:'Cryptid', 'Dinosaur King':'Prehistoric'
  };
  const AURA_BOOSTED_WEATHER = {
    Elohim:'Rapture', Yggdrasil:'Armageddon', Satan:'Blood Rain', 'Eclipse Chaser':'Eclipse',
    Kala:'Time Storm', Stormcaller:'Storm', Iris:'Aurora', Niflheim:'Shroud', Khione:'Snow',
    Astrologist:'Meteor Shower', Disease:'Virus'
  };
  const preferred = ['Mastermind','Piccolo','Yamato no Orochi','Kuchisake-onna'];
  const state = {
    cards:[], auras:[], abilities:{}, thumbs:{}, team:[], activeSlot:0, query:'',
    statAura:'', statAuraBorder:'', abilityAura:'', abilityAuraBorder:'', runs:30, cap:50000
  };

  const esc = (v='') => String(v).replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
  const compact = n => Intl.NumberFormat('en-US',{notation:'compact',maximumFractionDigits:2}).format(n);
  const pct = n => Number.isInteger(n) ? String(n) : Number(n.toFixed(2)).toString();
  const imageUrl = id => id ? (state.thumbs[String(id)] || '') : '';
  const portrait = (item, cls='mini-portrait') => {
    if (!item) return `<span class="${cls}"><span class="fallback-letter">?</span></span>`;
    const url=imageUrl(item.imageAssetId), letter=esc(item.name?.[0]||'?');
    return `<span class="${cls}"><span class="fallback-letter">${letter}</span>${url?`<img src="${esc(url)}" alt="" loading="lazy" onerror="this.remove()">`:''}</span>`;
  };

  function rarityWithBorders(card,borders=[]){ return borders.reduce((r,b)=>r*(CARD_BORDER_MULT[b]||1), card.rarity); }
  function getPower(card,borders=[]){ const rarity=card.name==='Ouroboros'?100000000000000:rarityWithBorders(card,borders); return rarity>0?Math.pow(2,Math.log10(rarity))*10*(card.statMultiplier||1):0; }
  function getAttack(card,borders=[]){ return getPower(card,borders)/2; }
  function getHealth(card,borders=[]){ return getPower(card,borders)*(card.hpMultiplier||1); }
  function cardByName(name){ return state.cards.find(c=>c.name===name) || state.cards[0]; }
  function auraByName(name){ return state.auras.find(a=>a.name===name); }

  function auraValue(aura,border){
    if (!aura) return 0;
    if (aura.type==='Stat') {
      const rarity=(Number(aura.rarity)||0)*(AURA_RARITY_MULT[border]||1);
      return rarity>0 ? Math.floor(Math.pow(2,Math.log10(rarity))/2) : 0;
    }
    const tier=AURA_TIER[border]||0;
    const custom=AURA_CUSTOM[aura.name];
    if (custom) return custom[tier];
    return (Number(aura.base)||0)+(Number(aura.perLevel)||0)*tier;
  }

  function resolveStatText(text,value){
    return String(text||'').replace(/(\d+(?:\.\d+)?)?STAT/g,(_,coef)=>pct((coef?Number(coef):1)*value));
  }

  function auraExactSummary(aura,border){
    if (!aura) return '';
    const value=auraValue(aura,border);
    if (aura.type==='Skill') return resolveStatText(aura.description,value);
    if (aura.name==='General Sun Tzu') return `All allied cards: <b>+${pct(value)}% HP</b>.`;

    const boostMult=Number(aura.boostMult)||0;
    const pack=AURA_BOOSTED_PACK[aura.name];
    const weather=AURA_BOOSTED_WEATHER[aura.name];
    const listed=(aura.boostedCards||[]).filter(Boolean);
    let out=`All allied cards: <b>+${pct(value)}% HP & ATK</b>.`;
    if (boostMult) {
      const scopes=[];
      if (pack) scopes.push(`${pack} Pack cards`);
      if (weather) scopes.push(`${weather} cards`);
      if (listed.length) scopes.push(listed.length<=3?listed.join(', '):`${listed.length} specifically boosted cards`);
      if (scopes.length) out+=` ${scopes.join(' + ')}: <b>+${pct(value*boostMult)}% HP & ATK</b>.`;
    }
    return out;
  }

  function auraBlock(type,label,auraKey,borderKey){
    const choices=state.auras.filter(a=>!a.unobtainable&&a.type===type).sort((a,b)=>a.name.localeCompare(b.name));
    const selected=auraByName(state[auraKey]);
    const border=state[borderKey];
    const value=selected?auraValue(selected,border):0;
    return `<div class="aura-card">
      <div class="aura-title">${selected?portrait(selected):'<span class="mini-portrait"><span class="fallback-letter">◇</span></span>'}<span><b>${label}</b><small>${selected?esc(selected.skillName||selected.type):'Choose one aura'}</small></span></div>
      <label>${label}</label>
      <select data-aura-select="${auraKey}"><option value="">No ${label.toLowerCase()} selected</option>${choices.map(a=>`<option value="${esc(a.name)}" ${a.name===state[auraKey]?'selected':''}>${esc(a.name)} · ${esc(a.skillName||'')}</option>`).join('')}</select>
      <div class="aura-desc">${selected?esc(selected.description||''):`Select one ${label.toLowerCase()}.`}</div>
      <label>Aura border</label>
      <div class="aura-border-pills"><button data-aura-border="" data-aura-border-key="${borderKey}" class="${!border?'on':''}">Base</button>${AURA_BORDERS.map(b=>`<button data-aura-border="${b}" data-aura-border-key="${borderKey}" class="${border===b?'on':''}">${b}</button>`).join('')}</div>
      ${selected?`<div class="aura-exact"><b>${border||'Base'} value: ${pct(value)}${selected.type==='Stat'?'%':''}</b><br>${auraExactSummary(selected,border)}</div>`:''}
    </div>`;
  }

  function render(){
    const q=state.query.trim().toLowerCase();
    const shown=state.cards.filter(c=>!c.unobtainable).filter(c=>!q||c.name.toLowerCase().includes(q)||(c.ability||'').toLowerCase().includes(q)).sort((a,b)=>b.rarity-a.rarity).slice(0,90);
    const statAura=auraByName(state.statAura), abilityAura=auraByName(state.abilityAura);

    root.innerHTML=`<main class="shell">
      <header class="topbar"><div><p class="kicker">CARD RNG EXPANSION</p><h1>Depths Calculator</h1></div><span class="status-chip">DEPTHS TOOL</span></header>
      <section class="intro compact"><div><span class="kicker">TEAM BUILDER</span><h2>Build your Depths team and compare runs.</h2><p>Choose four cards, one Stat aura, and one Ability aura.</p></div></section>
      <section class="workspace">
        <article class="panel loadout">
          <div class="panel-head"><div><span class="kicker">LOADOUT</span><h3>Four-card team</h3></div><small>Hover a card to see its ability</small></div>
          <div class="team-list">${state.team.map((slot,index)=>{const card=cardByName(slot.cardName),hp=getHealth(card,slot.borders),atk=getAttack(card,slot.borders);return `<button class="team-row ${state.activeSlot===index?'active':''}" data-slot="${index}" data-tooltip-card="${esc(card.name)}"><span class="slot">0${index+1}</span>${portrait(card,'portrait')}<span class="card-copy"><span class="name-line"><b>${esc(card.name)}</b><em>${esc(card.ability||'No ability')}</em></span><span class="numbers"><i><b>${compact(hp)}</b> HP</i><i><b>${compact(atk)}</b> ATK</i></span><span class="border-pills">${CARD_BORDERS.map(b=>`<label class="${slot.borders.includes(b)?'on':''}" data-border="${b}" data-border-slot="${index}">${b}</label>`).join('')}</span></span></button>`}).join('')}</div>
          <div class="aura-grid">${auraBlock('Stat','Stat Aura','statAura','statAuraBorder')}${auraBlock('Skill','Ability Aura','abilityAura','abilityAuraBorder')}</div>
        </article>
        <article class="panel library">
          <div class="panel-head"><div><span class="kicker">CARD LIBRARY</span><h3>Slot ${state.activeSlot+1}</h3></div><small>${shown.length} shown</small></div>
          <input class="search" id="cardSearch" value="${esc(state.query)}" placeholder="Search card or ability…" />
          <div class="library-list">${shown.length?shown.map(card=>`<button data-card="${esc(card.name)}" data-tooltip-card="${esc(card.name)}" class="${state.team[state.activeSlot]?.cardName===card.name?'selected':''}">${portrait(card)}<span><b>${esc(card.name)}</b><small>${esc(card.ability||'No ability')}</small></span><em>1 / ${compact(card.rarity)}</em></button>`).join(''):'<div class="empty-state">No matching cards.</div>'}</div>
        </article>
        <article class="panel simulation">
          <div class="panel-head"><div><span class="kicker">SIMULATION</span><h3>Depths run</h3></div><small>Team testing</small></div>
          <div class="simulation-body"><div class="sim-note"><b>Run settings</b><p>Choose how many attempts the calculator should test once the combat engine is enabled.</p></div><div class="sim-field"><span>Runs</span><div class="run-options">${[15,30,50,100].map(n=>`<button data-runs="${n}" class="${state.runs===n?'on':''}">${n}</button>`).join('')}</div></div><label class="sim-field"><span>Floor cap</span><input id="capInput" type="number" min="1" value="${state.cap}"></label><div class="team-summary">${state.team.map((slot,i)=>`<div><span>Card ${i+1}</span><b>${esc(slot.cardName)}</b></div>`).join('')}<div><span>Stat Aura</span><b>${statAura?`${esc(statAura.name)}${state.statAuraBorder?` · ${state.statAuraBorder}`:''}`:'None'}</b></div><div><span>Ability Aura</span><b>${abilityAura?`${esc(abilityAura.name)}${state.abilityAuraBorder?` · ${state.abilityAuraBorder}`:''}`:'None'}</b></div></div><button class="sim-run" disabled>Run Depths simulation</button></div>
        </article>
      </section>
      <footer><span>Card RNG Expansion Depths Calculator</span><span>Card borders: Platinum · Crystal · Ruby · Galaxy</span></footer>
    </main>`;

    root.querySelectorAll('[data-slot]').forEach(el=>el.addEventListener('click',e=>{if(e.target.closest('[data-border]'))return;state.activeSlot=Number(el.dataset.slot);render()}));
    root.querySelectorAll('[data-border]').forEach(el=>el.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();const i=Number(el.dataset.borderSlot),b=el.dataset.border,list=state.team[i].borders;state.team[i].borders=list.includes(b)?list.filter(x=>x!==b):[...list,b];render()}));
    root.querySelectorAll('[data-card]').forEach(el=>el.addEventListener('click',()=>{state.team[state.activeSlot].cardName=el.dataset.card;render()}));
    const search=root.querySelector('#cardSearch');search.addEventListener('input',()=>{state.query=search.value;render();requestAnimationFrame(()=>{const n=root.querySelector('#cardSearch');n.focus();n.setSelectionRange(n.value.length,n.value.length)})});
    root.querySelectorAll('[data-aura-select]').forEach(el=>el.addEventListener('change',()=>{state[el.dataset.auraSelect]=el.value;render()}));
    root.querySelectorAll('[data-aura-border]').forEach(el=>el.addEventListener('click',()=>{state[el.dataset.auraBorderKey]=el.dataset.auraBorder;render()}));
    root.querySelectorAll('[data-runs]').forEach(el=>el.addEventListener('click',()=>{state.runs=Number(el.dataset.runs);render()}));
    root.querySelector('#capInput').addEventListener('change',e=>{state.cap=Math.max(1,Number(e.target.value)||50000);render()});
    bindTooltips();
  }

  function bindTooltips(){
    const show=(el)=>{const card=cardByName(el.dataset.tooltipCard);if(!card)return;const desc=state.abilities[card.ability]||'No ability description found.';tooltip.innerHTML=`<div class="tip-name">${esc(card.name)}</div><div class="tip-ability">${esc(card.ability||'No ability')}</div><div class="tip-desc">${esc(desc)}</div><div class="tip-rarity">Base rarity: 1 / ${Number(card.rarity||0).toLocaleString('en-US')}</div>`;tooltip.classList.add('show');placeTooltip(el)};
    const hide=()=>tooltip.classList.remove('show');
    root.querySelectorAll('[data-tooltip-card]').forEach(el=>{el.addEventListener('mouseenter',()=>show(el));el.addEventListener('mouseleave',hide);el.addEventListener('focus',()=>show(el));el.addEventListener('blur',hide)});
  }
  function placeTooltip(el){const r=el.getBoundingClientRect(),w=Math.min(320,window.innerWidth-24),left=Math.min(window.innerWidth-w-12,Math.max(12,r.right+10)),altLeft=Math.max(12,r.left-w-10);tooltip.style.left=`${left+w>window.innerWidth-2?altLeft:left}px`;tooltip.style.top=`${Math.min(window.innerHeight-180,Math.max(12,r.top))}px`}

  async function loadLiveThumbnails(){
    const missing=[...new Set([...state.cards,...state.auras].map(x=>x.imageAssetId).filter(id=>id&&!state.thumbs[String(id)]).map(String))];
    if(!missing.length)return;
    try{
      for(let i=0;i<missing.length;i+=20){const chunk=missing.slice(i,i+20);const p=new URLSearchParams({assetIds:chunk.join(','),size:'420x420',format:'Png',isCircular:'false'});const r=await fetch(`https://thumbnails.roblox.com/v1/assets?${p}`,{credentials:'omit'});if(!r.ok)continue;const j=await r.json();for(const item of j.data||[])if(item.imageUrl)state.thumbs[String(item.targetId)]=item.imageUrl}
      render();
    }catch(_){ }
  }

  async function load(){
    try{
      const cardFiles=[1,2,3,4,5,6].map(i=>fetch(`./src/data/cards-${i}.json`).then(r=>r.json()));
      const auraFiles=[1,2].map(i=>fetch(`./src/data/auras-${i}.json`).then(r=>r.json()));
      const abilityFiles=[1,2,3].map(i=>fetch(`./src/data/abilities-${i}.json`).then(r=>r.json()));
      const thumbPromise=fetch('./src/data/thumbnails.json',{cache:'no-store'}).then(r=>r.ok?r.json():{}).catch(()=>({}));
      const [cardSets,auraSets,abilitySets,thumbs]=await Promise.all([Promise.all(cardFiles),Promise.all(auraFiles),Promise.all(abilityFiles),thumbPromise]);
      state.cards=cardSets.flat();state.auras=auraSets.flat();state.abilities=Object.assign({},...abilitySets);state.thumbs=thumbs||{};
      const available=preferred.filter(n=>state.cards.some(c=>c.name===n));const fallback=state.cards.filter(c=>!c.unobtainable).slice(0,4).map(c=>c.name);state.team=[0,1,2,3].map(i=>({cardName:available[i]||fallback[i]||state.cards[0].name,borders:[]}));
      render();loadLiveThumbnails();
    }catch(err){console.error(err);root.innerHTML=`<div class="error-box"><b>Calculator failed to load.</b><br><br>${esc(err.message)}</div>`}
  }
  load();
})();
</script>
</body>
</html>
