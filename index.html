<body>
<div id="root"><div class="loading">Loading Depths calculator…</div></div>
<div id="cardTooltip" class="card-tooltip"></div>
<script>
(() => {
  const root=document.getElementById('root'),tooltip=document.getElementById('cardTooltip');
  const CARD_BORDER_MULT={Platinum:100,Crystal:10000,Ruby:100000,Galaxy:1000000},CARD_BORDERS=Object.keys(CARD_BORDER_MULT);
  const AURA_RARITY_MULT={Platinum:10,Crystal:100,Galaxy:1000},AURA_BORDERS=Object.keys(AURA_RARITY_MULT),AURA_TIER={'':0,Platinum:1,Crystal:2,Galaxy:3};
  const AURA_CUSTOM={Berserker:[5,10,15,20],'Flame Wizard':[15,25,35,50],Shielder:[2,5,7,10],'Synth Human':[8,10,12,15]};
  const AURA_PACK={Neko:'Anime',Shrinemaiden:'Rising Sun',Shatbi:'Egypt',Taoist:'Immortal',Myhts:'Cryptid','Dinosaur King':'Prehistoric'};
  const AURA_WEATHER={Elohim:'Rapture',Yggdrasil:'Armageddon',Satan:'Blood Rain','Eclipse Chaser':'Eclipse',Kala:'Time Storm',Stormcaller:'Storm',Iris:'Aurora',Niflheim:'Shroud',Khione:'Snow',Astrologist:'Meteor Shower',Disease:'Virus'};
  const STORAGE='card-rng-expansion-depths-v2';
  const blankTeam=()=>({cards:Array.from({length:4},()=>({cardName:'',borders:[]})),statAura:'',statAuraBorder:'',abilityAura:'',abilityAuraBorder:'',result:null,elapsedMs:0,lastError:''});
  const state={cards:[],auras:[],abilities:{},thumbs:{},teams:Array.from({length:5},blankTeam),activeTeam:0,activeSlot:0,query:'',runs:15,cap:50000,seed:1000,running:false,runningLabel:'',workerReady:false,lastProgressRender:0};
  const esc=(v='')=>String(v).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
  const compact=n=>Intl.NumberFormat('en-US',{notation:'compact',maximumFractionDigits:2}).format(n),full=n=>Math.round(n).toLocaleString('en-US'),one=n=>Number(n).toLocaleString('en-US',{maximumFractionDigits:1}),pct=n=>Number.isInteger(n)?String(n):Number(n.toFixed(2)).toString();
  const duration=s=>{const n=Math.max(0,Math.round(Number(s)||0)),h=Math.floor(n/3600),m=Math.floor(n%3600/60),sec=n%60;if(h)return `${h}h ${m}m`;if(m)return `${m}m ${sec}s`;return `${sec}s`};
  const current=()=>state.teams[state.activeTeam],imageUrl=id=>id?(state.thumbs[String(id)]||''):'',cardByName=name=>state.cards.find(c=>c.name===name)||null,auraByName=name=>state.auras.find(a=>a.name===name)||null;
  function portrait(item,cls='mini-portrait'){if(!item)return `<span class="${cls}"><span class="fallback-letter">+</span></span>`;const url=imageUrl(item.imageAssetId),letter=esc(item.name?.[0]||'?');return `<span class="${cls}"><span class="fallback-letter">${letter}</span>${url?`<img src="${esc(url)}" alt="" loading="lazy" onerror="this.remove()">`:''}</span>`}
  function rarityWithBorders(card,borders=[]){return borders.reduce((r,b)=>r*(CARD_BORDER_MULT[b]||1),card.rarity)}
  function getPower(card,borders=[]){if(!card)return 0;const rarity=card.name==='Ouroboros'?100000000000000:rarityWithBorders(card,borders);return rarity>0?Math.pow(2,Math.log10(rarity))*10*(card.statMultiplier||1):0}
  const getAttack=(card,borders=[])=>getPower(card,borders)/2,getHealth=(card,borders=[])=>getPower(card,borders)*(card?.hpMultiplier||1);
  function auraValue(aura,border){if(!aura)return 0;if(aura.type==='Stat'){const rarity=(Number(aura.rarity)||0)*(AURA_RARITY_MULT[border]||1);return rarity>0?Math.floor(Math.pow(2,Math.log10(rarity))/2):0}const tier=AURA_TIER[border]||0,custom=AURA_CUSTOM[aura.name];return custom?custom[tier]:(Number(aura.base)||0)+(Number(aura.perLevel)||0)*tier}
  function resolveStatText(text,value){return String(text||'').replace(/(\d+(?:\.\d+)?)?STAT/g,(_,coef)=>pct((coef?Number(coef):1)*value))}
  function auraSummary(aura,border){
  if(!aura)return '';
  const value=auraValue(aura,border);
  if(aura.type==='Skill')return resolveStatText(aura.description,value);
  if(aura.name==='General Sun Tzu')return `<div class="aura-stat-grid"><div class="aura-stat"><span>All allied cards</span><b>+${pct(value)}%</b><small>HP</small></div></div>`;
  const boost=Number(aura.boostMult)||0,pack=AURA_PACK[aura.name],weather=AURA_WEATHER[aura.name],listed=(aura.boostedCards||[]).filter(Boolean),scopes=[];
  if(pack)scopes.push(`${pack} Pack`);
  if(weather){
    const weatherCards=state.cards.filter(card=>!card.unobtainable&&card.weather===weather).map(card=>card.name).sort((a,b)=>a.localeCompare(b));
    if(weatherCards.length)scopes.push(...weatherCards);
    else scopes.push(`${weather} cards`);
  }
  for(const name of listed)if(!scopes.includes(name))scopes.push(name);
  let out=`<div class="aura-stat-grid"><div class="aura-stat"><span>All allied cards</span><b>+${pct(value)}%</b><small>HP & ATK</small></div>`;
  if(boost&&scopes.length)out+=`<div class="aura-stat boosted"><span>Extra boost group</span><b>+${pct(value*boost)}%</b><small>HP & ATK</small></div>`;
  out+='</div>';
  if(boost&&scopes.length)out+=`<div class="aura-scope"><span>Extra stat buff applies to</span><b>${scopes.map(esc).join(' · ')}</b></div>`;
  return out;
}
  function auraBlock(type,label,auraKey,borderKey){const team=current(),choices=state.auras.filter(a=>!a.unobtainable&&a.type===type).sort((a,b)=>a.name.localeCompare(b.name)),selected=auraByName(team[auraKey]),border=team[borderKey];return `<div class="aura-card"><div class="aura-title">${selected?portrait(selected):'<span class="mini-portrait"><span class="fallback-letter">◇</span></span>'}<span><b>${label}</b><small>${selected?esc(selected.skillName||selected.type):'Choose one aura'}</small></span></div><select data-aura-select="${auraKey}"><option value="">No ${label.toLowerCase()}</option>${choices.map(a=>`<option value="${esc(a.name)}" ${a.name===team[auraKey]?'selected':''}>${esc(a.name)} · ${esc(a.skillName||'')}</option>`).join('')}</select><div class="aura-border-pills"><button data-aura-border="" data-aura-border-key="${borderKey}" class="${!border?'on':''}">Base</button>${AURA_BORDERS.map(b=>`<button data-aura-border="${b}" data-aura-border-key="${borderKey}" class="${border===b?'on':''}">${b}</button>`).join('')}</div>${selected?`<div class="aura-exact">${auraSummary(selected,border)}</div>`:''}</div>`}
  const complete=team=>team.cards.length===4&&team.cards.every(slot=>Boolean(slot.cardName));
function encodeTeam(team){
  const payload={v:1,c:team.cards.map(slot=>[slot.cardName,[...slot.borders]]),s:[team.statAura,team.statAuraBorder],a:[team.abilityAura,team.abilityAuraBorder]};
  const bytes=new TextEncoder().encode(JSON.stringify(payload));
  let binary='';for(const byte of bytes)binary+=String.fromCharCode(byte);
  return 'CRE1-'+btoa(binary).replace(/=+$/,'').replace(/\+/g,'-').replace(/\//g,'_');
}
function decodeTeam(code){
  const clean=String(code||'').trim();if(!clean.startsWith('CRE1-'))throw new Error('Not a CRE1 team code');
  let raw=clean.slice(5).replace(/-/g,'+').replace(/_/g,'/');while(raw.length%4)raw+='=';
  const binary=atob(raw),bytes=Uint8Array.from(binary,ch=>ch.charCodeAt(0)),payload=JSON.parse(new TextDecoder().decode(bytes));
  if(payload.v!==1||!Array.isArray(payload.c)||payload.c.length!==4)throw new Error('Unsupported team code');
  const team=blankTeam();
  team.cards=payload.c.map(slot=>({cardName:String(slot?.[0]||''),borders:Array.isArray(slot?.[1])?slot[1].filter(border=>CARD_BORDERS.includes(border)):[]}));
  team.statAura=String(payload.s?.[0]||'');team.statAuraBorder=AURA_BORDERS.includes(payload.s?.[1])?payload.s[1]:'';
  team.abilityAura=String(payload.a?.[0]||'');team.abilityAuraBorder=AURA_BORDERS.includes(payload.a?.[1])?payload.a[1]:'';
  for(const slot of team.cards)if(slot.cardName&&!cardByName(slot.cardName))throw new Error(`Unknown card: ${slot.cardName}`);
  if(team.statAura&&!auraByName(team.statAura))throw new Error(`Unknown Stat Aura: ${team.statAura}`);
  if(team.abilityAura&&!auraByName(team.abilityAura))throw new Error(`Unknown Ability Aura: ${team.abilityAura}`);
  return team;
}
  function resultCard(team,index){
  const r=team.result;
  if(!r)return team.lastError?`<section class="result-card"><div class="result-head"><div><span class="kicker">TEAM ${index+1}</span><h4>Simulation failed</h4></div></div><div class="team-error">${esc(team.lastError)}</div></section>`:'';
  const avgTurns=r.runs.length?r.runs.reduce((s,x)=>s+x.totalTurns,0)/r.runs.length:0;
  const enemyCounts={};
  for(const run of r.runs)for(const name of (run.endingEnemies||[]))enemyCounts[name]=(enemyCounts[name]||0)+1;
  const commonEnemies=Object.entries(enemyCounts).sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0])).slice(0,6);
  const endingHtml=commonEnemies.length?`<div class="ending-enemies"><span>Most common losing-floor enemies</span><div class="enemy-chips">${commonEnemies.map(([name,count])=>`<i>${esc(name)} <b>×${count}</b></i>`).join('')}</div></div>`:'';
  const turnLimitCounts={};
  for(const run of r.runs)if(run.turnLimitEnemy)turnLimitCounts[run.turnLimitEnemy]=(turnLimitCounts[run.turnLimitEnemy]||0)+1;
  const commonTurnLimits=Object.entries(turnLimitCounts).sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0])).slice(0,6);
  const turnLimitHtml=commonTurnLimits.length?`<div class="ending-enemies"><span>Turn-limit enemies</span><div class="enemy-chips">${commonTurnLimits.map(([name,count])=>`<i>${esc(name)} <b>×${count}</b></i>`).join('')}</div></div>`:'';
  return `<section class="result-card ${index===state.activeTeam?'active-result':''}"><div class="result-head"><div><span class="kicker">TEAM ${index+1}</span></div></div><div class="result-metrics"><div><span>Estimated Depth range</span><b>${full(r.estimatedFloorLow)} – ${full(r.estimatedFloorHigh)}</b></div><div><span>Median Depth</span><b>${one(r.medianFloor)}</b></div><div title="${full(r.auraPackLow)} – ${full(r.auraPackHigh)} Aura Packs"><span>Aura Pack reward</span><b>${compact(r.auraPackLow)} – ${compact(r.auraPackHigh)}</b><small>Median: ${compact(r.auraPackMedian)} packs</small></div><div title="One Aura Pack opens one Aura Card roll"><span>Aura cards</span><b>≈${compact(r.auraPackMedian)}</b><small>${compact(r.auraPackLow)}–${compact(r.auraPackHigh)} across the range · 1 card / pack</small></div><div><span>Estimated clear time</span><b>${duration(r.estimatedSecondsMedian)}</b><small>${duration(r.estimatedSecondsLow)}–${duration(r.estimatedSecondsHigh)} · Battle Speed 3 + Chrono Shard + floor scaling</small></div><div><span>Aura cards / hour</span><b>≈${compact(r.auraCardsPerHour)}</b><small>Using the median reward and estimated median clear time</small></div></div><div class="result-meta"><span>${r.runs.length} runs</span><span>${one(avgTurns)} avg turns</span><span>${team.elapsedMs<1000?`${Math.round(team.elapsedMs)} ms`:`${(team.elapsedMs/1000).toFixed(2)} s`} compute</span></div><div class="floor-strip">${r.runs.map((run,i)=>`<span role="button" tabindex="0" style="cursor:pointer" data-debug-team="${index}" data-debug-run="${i}" title="Run ${i+1}${run.turnLimitEnemy?' · TURN LIMIT vs '+run.turnLimitEnemy:''}${run.endingEnemies?.length?' · '+run.endingEnemies.join(' / '):''} · click for debug">${full(run.deathFloor)}</span>`).join('')}</div>${endingHtml}${turnLimitHtml}${r.unsupportedAbilities?.length?`<div class="result-warning">Unsupported: ${esc(r.unsupportedAbilities.join(', '))}</div>`:''}</section>`
}
  function showRunDebug(teamIndex,runIndex){
    const run=state.teams[teamIndex]?.result?.runs?.[runIndex],d=run?.debug;if(!run)return;
    const fmt=n=>Number.isFinite(Number(n))?Math.round(Number(n)).toLocaleString('en-US'):'?';
    const cardLine=c=>`${c.name} [${c.ability||'No ability'}] HP ${fmt(c.hp)}/${fmt(c.maxHp)} | ATK ${fmt(c.damage)} | Power ${fmt(c.power)}`;
    const lines=[];
    lines.push(`Team ${teamIndex+1} | Run ${runIndex+1} | Death floor ${fmt(run.deathFloor)}`);
    lines.push(`Run seed ${run.runSeed} | Floor seed ${run.floorSeed??'?'} | Battle seed ${run.battleSeed??'?'}`);
    lines.push(`Stat Aura: ${d?.statAura?`${d.statAura.name} ${d.statAura.border||'Base'} value=${d.statAura.value??'?'}`:'none'}`);
    lines.push(`Ability Aura: ${d?.abilityAura?`${d.abilityAura.name} ${d.abilityAura.border||'Base'} value=${d.abilityAura.value??'?'}`:'none'}`);
    lines.push(`150-turn matchup resolutions: ${d?.forcedStallResolutions??0}`);
    lines.push('', 'PLAYER BATTLE-START STATS');
    for(const c of d?.initialAllies||[])lines.push(cardLine(c));
    lines.push('', 'ENEMY BATTLE-START STATS');
    for(const c of d?.initialEnemies||[])lines.push(cardLine(c));
    lines.push('', 'FINAL PLAYER SURVIVORS');
    for(const c of d?.finalAllies||[])lines.push(cardLine(c));
    lines.push('', 'FINAL ENEMY SURVIVORS');
    for(const c of d?.finalEnemies||[])lines.push(cardLine(c));
    lines.push('', 'TRACE (last 300 important/turn events)');
    for(const e of d?.events||[])lines.push(`T${e.turn} [${e.type.toUpperCase()}] ${e.team} ${e.card}: ${e.detail}`);
    const text=lines.join('\n');
    const dialog=document.createElement('dialog');dialog.style.cssText='width:min(900px,94vw);max-height:88vh;background:#080d14;color:#c7d1dc;border:1px solid #334255;border-radius:12px;padding:14px';
    const bar=document.createElement('div');bar.style.cssText='display:flex;gap:8px;justify-content:flex-end;margin-bottom:8px';
    const copy=document.createElement('button');copy.textContent='Copy debug';const close=document.createElement('button');close.textContent='Close';
    for(const b of [copy,close])b.style.cssText='background:#111925;color:#c7d1dc;border:1px solid #2a394a;border-radius:8px;padding:7px 10px;cursor:pointer';
    const pre=document.createElement('pre');pre.textContent=text;pre.style.cssText='white-space:pre-wrap;font:11px/1.5 ui-monospace,Consolas,monospace;margin:0';
    bar.append(copy,close);dialog.append(bar,pre);document.body.appendChild(dialog);dialog.showModal();
    close.addEventListener('click',()=>{dialog.close();dialog.remove()});
    copy.addEventListener('click',async()=>{try{await navigator.clipboard.writeText(text);copy.textContent='Copied!'}catch(_){}});
  }
  function persist(){try{localStorage.setItem(STORAGE,JSON.stringify({teams:state.teams.map(t=>({cards:t.cards,statAura:t.statAura,statAuraBorder:t.statAuraBorder,abilityAura:t.abilityAura,abilityAuraBorder:t.abilityAuraBorder})),activeTeam:state.activeTeam,runs:state.runs,cap:state.cap,seed:state.seed}))}catch(_){}}
  function restore(){try{const s=JSON.parse(localStorage.getItem(STORAGE)||'null');if(!s)return;if(Array.isArray(s.teams))state.teams=Array.from({length:5},(_,i)=>{const src=s.teams[i],t=blankTeam();if(!src)return t;t.cards=Array.from({length:4},(_,j)=>({cardName:src.cards?.[j]?.cardName||'',borders:Array.isArray(src.cards?.[j]?.borders)?src.cards[j].borders.filter(b=>CARD_BORDERS.includes(b)):[]}));t.statAura=src.statAura||'';t.statAuraBorder=AURA_BORDERS.includes(src.statAuraBorder)?src.statAuraBorder:'';t.abilityAura=src.abilityAura||'';t.abilityAuraBorder=AURA_BORDERS.includes(src.abilityAuraBorder)?src.abilityAuraBorder:'';return t});state.activeTeam=Math.min(4,Math.max(0,Number(s.activeTeam)||0));state.runs=[1,3,8,15,30,50].includes(Number(s.runs))?Number(s.runs):15;state.cap=Math.min(50000,Math.max(1,Number(s.cap)||50000));state.seed=Number(s.seed)||1000}catch(_){}}
  function render(){const team=current(),q=state.query.trim().toLowerCase(),shown=state.cards.filter(c=>!c.unobtainable).filter(c=>!q||c.name.toLowerCase().includes(q)||(c.ability||'').toLowerCase().includes(q)).sort((a,b)=>b.rarity-a.rarity).slice(0,100),ready=state.teams.filter(complete).length,results=state.teams.map(resultCard).filter(Boolean).join('');root.innerHTML=`<main class="shell"><header class="topbar"><div><p class="kicker">CARD RNG EXPANSION</p><h1>Depths Calculator</h1></div></header><div class="team-tabs">${state.teams.map((t,i)=>`<button data-team-tab="${i}" class="${i===state.activeTeam?'on':''}"><span>Team ${i+1}</span><i>${t.result?`Range ${compact(t.result.estimatedFloorLow)}–${compact(t.result.estimatedFloorHigh)}`:complete(t)?'Ready':'Empty'}</i></button>`).join('')}<button data-duplicate class="tab-action">Duplicate</button></div><section class="workspace"><article class="panel loadout"><div class="panel-head"><div><span class="kicker">LOADOUT</span><h3>Team ${state.activeTeam+1}</h3></div><div class="panel-actions"><button class="text-button" data-copy-team>Copy code</button><button class="text-button" data-import-team>Import code</button><button class="text-button danger-lite" data-clear-team>Clear team</button></div></div><div class="team-list">${team.cards.map((slot,index)=>{const card=cardByName(slot.cardName);if(!card)return `<button class="team-row empty-team-card ${state.activeSlot===index?'active':''}" data-slot="${index}"><span class="slot">0${index+1}</span>${portrait(null,'portrait')}<span class="card-copy"><span class="name-line"><b>Select a card</b></span><span class="numbers">Choose from the library</span></span></button>`;const hp=getHealth(card,slot.borders),atk=getAttack(card,slot.borders);return `<button class="team-row ${state.activeSlot===index?'active':''}" data-slot="${index}" data-tooltip-card="${esc(card.name)}"><span class="slot">0${index+1}</span>${portrait(card,'portrait')}<span class="card-copy"><span class="name-line"><b>${esc(card.name)}</b><em>${esc(card.ability||'No ability')}</em></span><span class="numbers"><i><b>${compact(hp)}</b> HP</i><i><b>${compact(atk)}</b> ATK</i></span><span class="border-pills">${CARD_BORDERS.map(b=>`<label class="${slot.borders.includes(b)?'on':''}" data-border="${b}" data-border-slot="${index}">${b}</label>`).join('')}</span></span></button>`}).join('')}</div><div class="aura-grid">${auraBlock('Stat','Stat Aura','statAura','statAuraBorder')}${auraBlock('Skill','Ability Aura','abilityAura','abilityAuraBorder')}</div></article><article class="panel library"><div class="panel-head"><div><span class="kicker">Cards</span><h3>Team ${state.activeSlot+1}</h3></div><small>${shown.length} shown</small></div><input class="search" id="cardSearch" value="${esc(state.query)}" placeholder="Search card or ability…" autocomplete="off"><div class="library-list">${shown.length?shown.map(card=>`<button data-card="${esc(card.name)}" data-tooltip-card="${esc(card.name)}" class="${team.cards[state.activeSlot]?.cardName===card.name?'selected':''}">${portrait(card)}<span><b>${esc(card.name)}</b><small>${esc(card.ability||'No ability')}</small></span><em>1 / ${compact(card.rarity)}</em></button>`).join(''):'<div class="empty-state">No matching cards.</div>'}</div></article><article class="panel simulation"><div class="panel-head"><div><span class="kicker">DEPTHS TEST</span><h3>Run simulator</h3></div><small>${ready}/5 teams ready</small></div><div class="simulation-body"><div class="sim-field"><span>Runs per team</span><div class="run-options">${[1,3,8,15,30,50].map(n=>`<button data-runs="${n}" class="${state.runs===n?'on':''}">${n}</button>`).join('')}</div></div><label class="sim-field"><span>Floor cap</span><input id="capInput" type="number" min="1" max="50000" value="${state.cap}"></label><div class="sim-actions">${state.running?`<button class="secondary-run" disabled>${esc(state.runningLabel||'Starting simulation…')}</button><button class="sim-run" data-cancel-run>Cancel simulation</button>`:`<button class="secondary-run" data-run-active ${!complete(team)?'disabled':''}>Test Team ${state.activeTeam+1}</button><button class="sim-run" data-run-ready ${ready===0?'disabled':''}>Test ${ready} Ready Team${ready===1?'':'s'}</button>`}</div>${state.running?`<p class="sim-footnote">Runs execute in parallel. Long battles show the exact enemy lineup; 150-turn no-progress matchups resolve using the previous behavior; any battle that reaches 10,000 total turns ends as a loss instead of hanging.</p>`:''}</div></article></section><section class="results-panel"><div class="results-title"><div><span class="kicker">DEPTHS TEST RESULTS</span><h3>${results?'Team comparison':'No simulations yet'}</h3></div>${results?'<button class="text-button" data-clear-results>Clear results</button>':''}</div>${results?`<div class="result-grid">${results}</div>`:'<div class="results-empty">Build a complete four-card team, choose any auras you use, then run a test.</div>'}</section><footer><span>Card RNG Expansion Depths Calculator</span></footer></main>`;bindEvents();bindTooltips()}
  function bindEvents(){root.querySelectorAll('[data-debug-run]').forEach(el=>{const open=()=>showRunDebug(Number(el.dataset.debugTeam),Number(el.dataset.debugRun));el.addEventListener('click',open);el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();open()}})});root.querySelectorAll('[data-team-tab]').forEach(el=>el.addEventListener('click',()=>{state.activeTeam=Number(el.dataset.teamTab);state.activeSlot=0;persist();render()}));root.querySelector('[data-duplicate]')?.addEventListener('click',()=>{const dst=(state.activeTeam+1)%5,src=current();state.teams[dst]={...blankTeam(),cards:src.cards.map(s=>({cardName:s.cardName,borders:[...s.borders]})),statAura:src.statAura,statAuraBorder:src.statAuraBorder,abilityAura:src.abilityAura,abilityAuraBorder:src.abilityAuraBorder};state.activeTeam=dst;state.activeSlot=0;persist();render()});root.querySelector('[data-copy-team]')?.addEventListener('click',async()=>{const code=encodeTeam(current());try{await navigator.clipboard.writeText(code);const button=root.querySelector('[data-copy-team]');if(button){button.textContent='Copied!';setTimeout(()=>{if(button.isConnected)button.textContent='Copy code'},900)}}catch(_){prompt('Copy this team code:',code)}});root.querySelector('[data-import-team]')?.addEventListener('click',()=>{const code=prompt('Paste a CRE1 team code:');if(!code)return;try{state.teams[state.activeTeam]=decodeTeam(code);state.activeSlot=0;persist();render()}catch(error){alert(`Could not import team: ${error.message||error}`)}});root.querySelector('[data-clear-team]')?.addEventListener('click',()=>{state.teams[state.activeTeam]=blankTeam();state.activeSlot=0;persist();render()});root.querySelector('[data-clear-results]')?.addEventListener('click',()=>{state.teams.forEach(t=>{t.result=null;t.elapsedMs=0;t.lastError=''});render()});root.querySelectorAll('[data-slot]').forEach(el=>el.addEventListener('click',e=>{if(e.target.closest('[data-border]'))return;state.activeSlot=Number(el.dataset.slot);render()}));root.querySelectorAll('[data-border]').forEach(el=>el.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();const slot=current().cards[Number(el.dataset.borderSlot)],b=el.dataset.border;slot.borders=slot.borders.includes(b)?slot.borders.filter(x=>x!==b):[...slot.borders,b];current().result=null;persist();render()}));root.querySelectorAll('[data-card]').forEach(el=>el.addEventListener('click',()=>{current().cards[state.activeSlot].cardName=el.dataset.card;current().result=null;persist();render()}));const search=root.querySelector('#cardSearch');search?.addEventListener('input',()=>{state.query=search.value;render();requestAnimationFrame(()=>{const n=root.querySelector('#cardSearch');n?.focus();n?.setSelectionRange(n.value.length,n.value.length)})});root.querySelectorAll('[data-aura-select]').forEach(el=>el.addEventListener('change',()=>{current()[el.dataset.auraSelect]=el.value;current().result=null;persist();render()}));root.querySelectorAll('[data-aura-border]').forEach(el=>el.addEventListener('click',()=>{current()[el.dataset.auraBorderKey]=el.dataset.auraBorder;current().result=null;persist();render()}));root.querySelectorAll('[data-runs]').forEach(el=>el.addEventListener('click',()=>{state.runs=Number(el.dataset.runs);persist();render()}));root.querySelector('#capInput')?.addEventListener('change',e=>{state.cap=Math.min(50000,Math.max(1,Number(e.target.value)||50000));persist();render()});root.querySelector('[data-run-active]')?.addEventListener('click',()=>runTeams([state.activeTeam]));root.querySelector('[data-run-ready]')?.addEventListener('click',()=>runTeams(state.teams.map((t,i)=>complete(t)?i:-1).filter(i=>i>=0)));root.querySelector('[data-cancel-run]')?.addEventListener('click',cancelSimulation)}
function bindTooltips(){const show=el=>{const card=cardByName(el.dataset.tooltipCard);if(!card)return;const desc=state.abilities[card.ability]||'No ability description found.';tooltip.innerHTML=`<div class="tip-name">${esc(card.name)}</div><div class="tip-ability">${esc(card.ability||'No ability')}</div><div class="tip-desc">${esc(desc)}</div><div class="tip-rarity">Base rarity: 1 / ${Number(card.rarity||0).toLocaleString('en-US')}</div>`;tooltip.classList.add('show');const r=el.getBoundingClientRect(),w=Math.min(320,window.innerWidth-24);let left=r.right+10;if(left+w>window.innerWidth-12)left=Math.max(12,r.left-w-10);tooltip.style.left=`${left}px`;tooltip.style.top=`${Math.min(window.innerHeight-180,Math.max(12,r.top))}px`};const hide=()=>tooltip.classList.remove('show');root.querySelectorAll('[data-tooltip-card]').forEach(el=>{el.addEventListener('mouseenter',()=>show(el));el.addEventListener('mouseleave',hide);el.addEventListener('focus',()=>show(el));el.addEventListener('blur',hide)})}
  let worker=null,requestId=0;const pending=new Map();
  function startWorker(){try{worker=new Worker('./browser/depths-worker.js');worker.onmessage=e=>{const p=pending.get(e.data.id);if(!p)return;if(e.data.kind==='progress'){const now=performance.now(),done=e.data.completedRuns||0,total=e.data.totalRuns||state.runs,active=Number(e.data.activeRuns)||1,min=Number(e.data.minActiveFloor)||Number(e.data.floor)||1,max=Number(e.data.maxActiveFloor)||min,range=min===max?`Floor ${full(min)}`:`Floors ${full(min)}–${full(max)}`,turn=Number(e.data.battleTurn)||0,enemies=Array.isArray(e.data.enemies)?e.data.enemies:[],matchup=turn>=150&&enemies.length?` · vs ${enemies.join(' / ')}`:'';state.runningLabel=`Team ${p.teamIndex+1} · ${done}/${total} runs done · ${active} active · ${range}${turn?` · current T${turn}`:''}${matchup}`;if(now-state.lastProgressRender>250){state.lastProgressRender=now;render()}return}pending.delete(e.data.id);e.data.ok?p.resolve(e.data):p.reject(new Error(e.data.error||'Simulation failed'))};worker.onerror=e=>{for(const p of pending.values())p.reject(new Error(e.message||'Simulation worker failed'));pending.clear();state.workerReady=false};state.workerReady=true}catch(_){state.workerReady=false}}
  function cancelSimulation(){if(worker)worker.terminate();const error=new Error('Simulation cancelled');for(const p of pending.values())p.reject(error);pending.clear();state.workerReady=false;state.running=false;state.runningLabel='';startWorker();render()}
  function loadoutFor(team){return{cards:team.cards.map(s=>({cardName:s.cardName,borders:[...s.borders]})),statAura:team.statAura?{auraName:team.statAura,border:team.statAuraBorder||null}:null,abilityAura:team.abilityAura?{auraName:team.abilityAura,border:team.abilityAuraBorder||null}:null}}
  function askWorker(index,batchSeed){if(!worker||!state.workerReady)return Promise.reject(new Error('Simulation worker is unavailable. Refresh and try again.'));const id=++requestId,t=state.teams[index];return new Promise((resolve,reject)=>{pending.set(id,{resolve,reject,teamIndex:index});worker.postMessage({id,loadout:loadoutFor(t),runs:state.runs,floorCap:state.cap,seed:batchSeed>>>0})})}
  async function runTeams(indices){if(state.running||!indices.length)return;state.running=true;state.lastProgressRender=0;const seedWords=new Uint32Array(1);crypto.getRandomValues(seedWords);const batchSeed=seedWords[0]||((Date.now()^Math.floor(performance.now()*1000))>>>0);try{for(let order=0;order<indices.length;order++){const index=indices[order];state.runningLabel=`Starting Team ${index+1} · ${order+1}/${indices.length}`;render();try{const response=await askWorker(index,batchSeed);state.teams[index].lastSeed=batchSeed;state.teams[index].result=response.result;state.teams[index].elapsedMs=response.elapsedMs;state.teams[index].lastError=''}catch(error){if((error.message||String(error))==='Simulation cancelled')return;state.teams[index].result=null;state.teams[index].lastError=error.message||String(error);throw error}}}catch(error){console.error(error)}finally{state.running=false;state.runningLabel='';render()}}
  async function liveThumbs(){const missing=[...new Set([...state.cards,...state.auras].map(x=>x.imageAssetId).filter(id=>id&&!state.thumbs[String(id)]).map(String))];if(!missing.length)return;try{for(let i=0;i<missing.length;i+=20){const chunk=missing.slice(i,i+20),p=new URLSearchParams({assetIds:chunk.join(','),size:'420x420',format:'Png',isCircular:'false'}),r=await fetch(`https://thumbnails.roblox.com/v1/assets?${p}`,{credentials:'omit'});if(!r.ok)continue;const j=await r.json();for(const item of j.data||[])if(item.imageUrl)state.thumbs[String(item.targetId)]=item.imageUrl}render()}catch(_){}}
  async function load(){try{const cardFiles=[1,2,3,4,5,6].map(i=>fetch(`./src/data/cards-${i}.json`).then(r=>r.json())),auraFiles=[1,2].map(i=>fetch(`./src/data/auras-${i}.json`).then(r=>r.json())),abilityFiles=[1,2,3].map(i=>fetch(`./src/data/abilities-${i}.json`).then(r=>r.json())),thumbPromise=fetch('./src/data/thumbnails.json',{cache:'no-store'}).then(r=>r.ok?r.json():{}).catch(()=>({}));const[cardSets,auraSets,abilitySets,thumbs]=await Promise.all([Promise.all(cardFiles),Promise.all(auraFiles),Promise.all(abilityFiles),thumbPromise]);state.cards=cardSets.flat();state.auras=auraSets.flat();state.abilities=Object.assign({},...abilitySets);state.thumbs=thumbs||{};restore();startWorker();render();liveThumbs()}catch(err){console.error(err);root.innerHTML=`<div class="error-box"><b>Calculator failed to load.</b><br><br>${esc(err.message)}</div>`}}
  load();
})();
