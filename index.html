<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#080b10" />
  <title>Card RNG Expansion · Depths Calculator</title>
  <link rel="stylesheet" href="./src/styles.css" />
  <style>
    .loading{min-height:100vh;display:grid;place-items:center;background:#080b10;color:#8693a4;font:14px Inter,system-ui,sans-serif}.status-chip{color:#87d8ca;border:1px solid #355e5a;background:rgba(135,216,202,.11);border-radius:999px;font-size:9px;letter-spacing:.1em;padding:6px 9px}.error-box{margin:80px auto;max-width:620px;border:1px solid #432a2a;background:#151013;color:#d9b4b4;padding:20px;border-radius:16px;font:13px system-ui;line-height:1.55}.empty-state{padding:28px 16px;text-align:center;color:#647286;font-size:11px}
    .team-tabs{display:flex;gap:7px;align-items:stretch;padding:18px 2px 12px;overflow-x:auto}.team-tabs button{min-width:105px;border:1px solid #202b3a;border-radius:11px;background:#0b1119;color:#7f8c9d;padding:9px 11px;text-align:left;cursor:pointer}.team-tabs button span{display:block;font-size:11px;font-weight:700;color:#b2bdca}.team-tabs button i{display:block;font-style:normal;font-size:8px;margin-top:3px;color:#647286}.team-tabs button.on{border-color:#477b76;background:rgba(135,216,202,.1)}.team-tabs button.on span{color:#e1f3f0}.team-tabs .tab-action{min-width:auto;margin-left:auto;text-align:center;color:#a7b4c4}.text-button{border:0;background:transparent;color:#7e8c9e;font-size:10px;cursor:pointer;padding:4px}.text-button:hover{color:#c8d3df}
    .aura-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:14px;border-top:1px solid var(--line)}.aura-card{border:1px solid #202b3a;background:#0a0f16;border-radius:13px;padding:12px;min-width:0}.aura-title{display:flex;align-items:center;gap:9px;margin-bottom:9px}.aura-title .mini-portrait{flex:0 0 auto}.aura-title b{display:block;font-size:11px}.aura-title small{display:block;color:var(--muted);font-size:9px;margin-top:2px}.aura-card select{width:100%;color:var(--text);background:#0d141d;border:1px solid #263142;border-radius:9px;padding:9px 10px;outline:none}.aura-border-pills{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}.aura-border-pills button{border:1px solid #253142;border-radius:999px;padding:4px 7px;font-size:9px;color:#748194;background:transparent;cursor:pointer}.aura-border-pills button.on{color:#cfeee8;border-color:#477b76;background:var(--accent-soft)}.aura-exact{margin-top:9px;border-top:1px solid #1c2633;padding-top:8px;color:#9aa7b7;font-size:9px;line-height:1.5}.aura-exact b{color:#cfeee8}
    .portrait,.mini-portrait{position:relative}.fallback-letter{position:absolute;inset:0;display:grid;place-items:center;color:#647286;font-weight:800}.portrait img,.mini-portrait img{position:relative;z-index:1;background:#151d28}.team-row,.library-list button{position:relative}.empty-team-card{color:#758397}.empty-team-card .name-line b{color:#9aa7b7}.empty-team-card .portrait{border-style:dashed;background:#0d141d}.empty-team-card .fallback-letter{font-size:22px;font-weight:500}.library-list button{min-height:53px}.card-tooltip{position:fixed;z-index:9999;width:min(320px,calc(100vw - 24px));pointer-events:none;opacity:0;transform:translateY(4px);transition:opacity .1s ease,transform .1s ease;background:#080d14;border:1px solid #334255;border-radius:12px;padding:12px 13px;box-shadow:0 18px 55px rgba(0,0,0,.48)}.card-tooltip.show{opacity:1;transform:translateY(0)}.card-tooltip .tip-name{font-size:12px;font-weight:750;color:#edf1f7}.card-tooltip .tip-ability{font-size:10px;font-weight:700;color:#87d8ca;margin-top:5px}.card-tooltip .tip-desc{font-size:10px;line-height:1.5;color:#9aa7b7;margin-top:4px}.card-tooltip .tip-rarity{font-size:9px;color:#5f6d7f;margin-top:8px}
    .simulation-body{padding:14px}.sim-note{border:1px solid #202b3a;background:#0a0f16;border-radius:12px;padding:13px;margin-bottom:12px}.sim-note b{display:block;font-size:12px;margin-bottom:4px}.sim-note p,.sim-footnote{color:var(--muted);font-size:10px;line-height:1.5}.sim-field{display:block;margin-top:13px}.sim-field>span{display:block;color:var(--muted);font-size:9px;text-transform:uppercase;letter-spacing:.1em;margin:0 0 5px 2px}.sim-field input{width:100%;color:var(--text);background:#0a0f16;border:1px solid #263142;border-radius:10px;padding:11px 12px;outline:none}.run-options{display:flex;gap:6px;flex-wrap:wrap}.run-options button{border:1px solid #253142;background:#0b1119;color:#8390a0;border-radius:9px;padding:8px 11px;font-size:10px;cursor:pointer}.run-options button.on{color:#d7f2ed;border-color:#477b76;background:var(--accent-soft)}.sim-actions{display:grid;grid-template-columns:.8fr 1.2fr;gap:8px;margin-top:15px}.sim-actions button{border-radius:10px;padding:12px 10px;font-size:11px;cursor:pointer}.secondary-run{border:1px solid #2a394a;background:#111925;color:#a5b2c2}.sim-run{border:1px solid #477b76;background:#17302d;color:#d6f1ec;font-weight:700}.sim-actions button:disabled{opacity:.42;cursor:not-allowed}.sim-footnote{margin-top:9px}
    .results-panel{margin-top:14px;border:1px solid var(--line);border-radius:18px;background:linear-gradient(180deg,rgba(17,24,36,.96),rgba(12,17,25,.96));overflow:hidden}.results-title{display:flex;justify-content:space-between;align-items:flex-end;padding:18px 20px;border-bottom:1px solid var(--line)}.results-title h3{font-size:18px;margin:5px 0 0}.results-empty{padding:35px 20px;color:#677589;font-size:11px;text-align:center}.result-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px;padding:12px}.result-card{border:1px solid #202b3a;background:#0a0f16;border-radius:13px;padding:13px}.result-card.active-result{border-color:#355e5a}.result-head{display:flex;justify-content:space-between;align-items:center}.result-head h4{font-size:12px;margin:3px 0 0}.trust{font-size:8px;letter-spacing:.08em;border:1px solid;padding:4px 6px;border-radius:999px}.trust.ok{color:#87d8ca;border-color:#355e5a}.trust.warn{color:#d9b76e;border-color:#5f5234}.result-metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:12px}.result-metrics div{background:#0d141d;border:1px solid #1e2937;border-radius:9px;padding:8px}.result-metrics span{display:block;color:#687789;font-size:8px;text-transform:uppercase}.result-metrics b{display:block;margin-top:3px;font-size:15px}.result-meta{display:flex;gap:10px;flex-wrap:wrap;color:#758397;font-size:9px;margin-top:9px}.floor-strip{display:flex;gap:5px;flex-wrap:wrap;margin-top:10px;max-height:68px;overflow:auto}.floor-strip span{border:1px solid #243141;border-radius:7px;padding:4px 6px;color:#9eabba;font-size:8px}.result-warning{margin-top:8px;color:#d0a96c;font-size:9px}.team-error{margin-top:8px;color:#d29a9a;font-size:9px}
    @media(max-width:760px){.aura-grid{grid-template-columns:1fr}.team-tabs .tab-action{margin-left:0}.sim-actions{grid-template-columns:1fr}.result-metrics{grid-template-columns:1fr 1fr}}
  </style>
</head>
<body>
<div id="root"><div class="loading">Loading Depths calculator…</div></div>
<div id="cardTooltip" class="card-tooltip"></div>
<script>
(() => {
  const root=document.getElementById('root'),tooltip=document.getElementById('cardTooltip');
  const CARD_BORDER_MULT={Platinum:100,Crystal:10000,Ruby:100000,Galaxy:1000000},CARD_BORDERS=Object.keys(CARD_BORDER_MULT);
  const AURA_RARITY_MULT={Platinum:10,Crystal:100,Galaxy:1000},AURA_BORDERS=Object.keys(AURA_RARITY_MULT),AURA_TIER={'':0,Platinum:1,Crystal:2,Galaxy:3};
  const AURA_CUSTOM={Berserker:[5,10,15,20],'Flame Wizard':[15,25,35,50],Shielder:[2,5,7,10],'Synth Human':[8,10,12,15]};
  const AURA_PACK={Neko:'Anime',Shrinemaiden:'Rising Sun',Shatbi:'Egypt',Taoist:'Immortal',Myhts:'Cryptid','Dinosaur King':'Prehistoric'};
  const AURA_WEATHER={Elohim:'Rapture',Yggdrasil:'Armageddon',Satan:'Blood Rain','Eclipse Chaser':'Eclipse',Kala:'Time Storm',Stormcaller:'Storm',Iris:'Aurora',Niflheim:'Shroud',Khione:'Snow',Astrologist:'Meteor Shower',Disease:'Virus'};
  const STORAGE='card-rng-expansion-depths-v2';
  const blankTeam=()=>({cards:Array.from({length:4},()=>({cardName:'',borders:[]})),statAura:'',statAuraBorder:'',abilityAura:'',abilityAuraBorder:'',result:null,elapsedMs:0,lastError:''});
  const state={cards:[],auras:[],abilities:{},thumbs:{},teams:Array.from({length:5},blankTeam),activeTeam:0,activeSlot:0,query:'',runs:15,cap:50000,seed:1000,running:false,runningLabel:'',workerReady:false};
  const esc=(v='')=>String(v).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
  const compact=n=>Intl.NumberFormat('en-US',{notation:'compact',maximumFractionDigits:2}).format(n),full=n=>Math.round(n).toLocaleString('en-US'),one=n=>Number(n).toLocaleString('en-US',{maximumFractionDigits:1}),pct=n=>Number.isInteger(n)?String(n):Number(n.toFixed(2)).toString();
  const current=()=>state.teams[state.activeTeam],imageUrl=id=>id?(state.thumbs[String(id)]||''):'',cardByName=name=>state.cards.find(c=>c.name===name)||null,auraByName=name=>state.auras.find(a=>a.name===name)||null;
  function portrait(item,cls='mini-portrait'){if(!item)return `<span class="${cls}"><span class="fallback-letter">+</span></span>`;const url=imageUrl(item.imageAssetId),letter=esc(item.name?.[0]||'?');return `<span class="${cls}"><span class="fallback-letter">${letter}</span>${url?`<img src="${esc(url)}" alt="" loading="lazy" onerror="this.remove()">`:''}</span>`}
  function rarityWithBorders(card,borders=[]){return borders.reduce((r,b)=>r*(CARD_BORDER_MULT[b]||1),card.rarity)}
  function getPower(card,borders=[]){if(!card)return 0;const rarity=card.name==='Ouroboros'?100000000000000:rarityWithBorders(card,borders);return rarity>0?Math.pow(2,Math.log10(rarity))*10*(card.statMultiplier||1):0}
  const getAttack=(card,borders=[])=>getPower(card,borders)/2,getHealth=(card,borders=[])=>getPower(card,borders)*(card?.hpMultiplier||1);
  function auraValue(aura,border){if(!aura)return 0;if(aura.type==='Stat'){const rarity=(Number(aura.rarity)||0)*(AURA_RARITY_MULT[border]||1);return rarity>0?Math.floor(Math.pow(2,Math.log10(rarity))/2):0}const tier=AURA_TIER[border]||0,custom=AURA_CUSTOM[aura.name];return custom?custom[tier]:(Number(aura.base)||0)+(Number(aura.perLevel)||0)*tier}
  function resolveStatText(text,value){return String(text||'').replace(/(\d+(?:\.\d+)?)?STAT/g,(_,coef)=>pct((coef?Number(coef):1)*value))}
  function auraSummary(aura,border){if(!aura)return '';const value=auraValue(aura,border);if(aura.type==='Skill')return resolveStatText(aura.description,value);if(aura.name==='General Sun Tzu')return `All allied cards: <b>+${pct(value)}% HP</b>.`;const boost=Number(aura.boostMult)||0,pack=AURA_PACK[aura.name],weather=AURA_WEATHER[aura.name],listed=(aura.boostedCards||[]).filter(Boolean);let out=`All allied cards: <b>+${pct(value)}% HP & ATK</b>.`;if(boost){const scopes=[];if(pack)scopes.push(`${pack} Pack cards`);if(weather)scopes.push(`${weather} cards`);if(listed.length)scopes.push(listed.length<=3?listed.join(', '):`${listed.length} specifically boosted cards`);if(scopes.length)out+=` ${scopes.join(' + ')}: <b>+${pct(value*boost)}% HP & ATK</b>.`}return out}
  function auraBlock(type,label,auraKey,borderKey){const team=current(),choices=state.auras.filter(a=>!a.unobtainable&&a.type===type).sort((a,b)=>a.name.localeCompare(b.name)),selected=auraByName(team[auraKey]),border=team[borderKey];return `<div class="aura-card"><div class="aura-title">${selected?portrait(selected):'<span class="mini-portrait"><span class="fallback-letter">◇</span></span>'}<span><b>${label}</b><small>${selected?esc(selected.skillName||selected.type):'Choose one aura'}</small></span></div><select data-aura-select="${auraKey}"><option value="">No ${label.toLowerCase()}</option>${choices.map(a=>`<option value="${esc(a.name)}" ${a.name===team[auraKey]?'selected':''}>${esc(a.name)} · ${esc(a.skillName||'')}</option>`).join('')}</select><div class="aura-border-pills"><button data-aura-border="" data-aura-border-key="${borderKey}" class="${!border?'on':''}">Base</button>${AURA_BORDERS.map(b=>`<button data-aura-border="${b}" data-aura-border-key="${borderKey}" class="${border===b?'on':''}">${b}</button>`).join('')}</div>${selected?`<div class="aura-exact">${auraSummary(selected,border)}</div>`:''}</div>`}
  const complete=team=>team.cards.length===4&&team.cards.every(slot=>Boolean(slot.cardName));
  function resultCard(team,index){const r=team.result;if(!r)return team.lastError?`<section class="result-card"><div class="result-head"><div><span class="kicker">TEAM ${index+1}</span><h4>Simulation failed</h4></div></div><div class="team-error">${esc(team.lastError)}</div></section>`:'';const avgTurns=r.runs.length?r.runs.reduce((s,x)=>s+x.totalTurns,0)/r.runs.length:0;return `<section class="result-card ${index===state.activeTeam?'active-result':''}"><div class="result-head"><div><span class="kicker">TEAM ${index+1}</span><h4>${r.trusted?'Verified simulation':'Simulation warning'}</h4></div><span class="trust ${r.trusted?'ok':'warn'}">${r.trusted?'TRUSTED':'CHECK'}</span></div><div class="result-metrics"><div><span>Average</span><b>${one(r.averageFloor)}</b></div><div><span>Median</span><b>${one(r.medianFloor)}</b></div><div><span>Peak</span><b>${full(r.maxFloor)}</b></div><div><span>Low</span><b>${full(r.minFloor)}</b></div></div><div class="result-meta"><span>${r.runs.length} runs</span><span>${one(avgTurns)} avg turns</span><span>${team.elapsedMs<1000?`${Math.round(team.elapsedMs)} ms`:`${(team.elapsedMs/1000).toFixed(2)} s`} compute</span></div><div class="floor-strip">${r.runs.map((run,i)=>`<span title="Run ${i+1}">${full(run.deathFloor)}</span>`).join('')}</div>${r.unsupportedAbilities?.length?`<div class="result-warning">Unsupported: ${esc(r.unsupportedAbilities.join(', '))}</div>`:''}</section>`}
  function persist(){try{localStorage.setItem(STORAGE,JSON.stringify({teams:state.teams.map(t=>({cards:t.cards,statAura:t.statAura,statAuraBorder:t.statAuraBorder,abilityAura:t.abilityAura,abilityAuraBorder:t.abilityAuraBorder})),activeTeam:state.activeTeam,runs:state.runs,cap:state.cap,seed:state.seed}))}catch(_){}}
  function restore(){try{const s=JSON.parse(localStorage.getItem(STORAGE)||'null');if(!s)return;if(Array.isArray(s.teams))state.teams=Array.from({length:5},(_,i)=>{const src=s.teams[i],t=blankTeam();if(!src)return t;t.cards=Array.from({length:4},(_,j)=>({cardName:src.cards?.[j]?.cardName||'',borders:Array.isArray(src.cards?.[j]?.borders)?src.cards[j].borders.filter(b=>CARD_BORDERS.includes(b)):[]}));t.statAura=src.statAura||'';t.statAuraBorder=AURA_BORDERS.includes(src.statAuraBorder)?src.statAuraBorder:'';t.abilityAura=src.abilityAura||'';t.abilityAuraBorder=AURA_BORDERS.includes(src.abilityAuraBorder)?src.abilityAuraBorder:'';return t});state.activeTeam=Math.min(4,Math.max(0,Number(s.activeTeam)||0));state.runs=[3,8,15,30,50].includes(Number(s.runs))?Number(s.runs):15;state.cap=Math.min(50000,Math.max(1,Number(s.cap)||50000));state.seed=Number(s.seed)||1000}catch(_){}}
  function render(){const team=current(),q=state.query.trim().toLowerCase(),shown=state.cards.filter(c=>!c.unobtainable).filter(c=>!q||c.name.toLowerCase().includes(q)||(c.ability||'').toLowerCase().includes(q)).sort((a,b)=>b.rarity-a.rarity).slice(0,100),ready=state.teams.filter(complete).length,results=state.teams.map(resultCard).filter(Boolean).join('');root.innerHTML=`<main class="shell"><header class="topbar"><div><p class="kicker">CARD RNG EXPANSION</p><h1>Depths Calculator</h1></div><span class="status-chip">ENGINE VERIFIED · 267 ABILITIES</span></header><div class="team-tabs">${state.teams.map((t,i)=>`<button data-team-tab="${i}" class="${i===state.activeTeam?'on':''}"><span>Team ${i+1}</span><i>${t.result?`Avg ${one(t.result.averageFloor)}`:complete(t)?'Ready':'Empty'}</i></button>`).join('')}<button data-duplicate class="tab-action">Duplicate</button></div><section class="workspace"><article class="panel loadout"><div class="panel-head"><div><span class="kicker">LOADOUT</span><h3>Team ${state.activeTeam+1}</h3></div><button class="text-button" data-clear-team>Clear team</button></div><div class="team-list">${team.cards.map((slot,index)=>{const card=cardByName(slot.cardName);if(!card)return `<button class="team-row empty-team-card ${state.activeSlot===index?'active':''}" data-slot="${index}"><span class="slot">0${index+1}</span>${portrait(null,'portrait')}<span class="card-copy"><span class="name-line"><b>Select a card</b></span><span class="numbers">Choose from the library</span></span></button>`;const hp=getHealth(card,slot.borders),atk=getAttack(card,slot.borders);return `<button class="team-row ${state.activeSlot===index?'active':''}" data-slot="${index}" data-tooltip-card="${esc(card.name)}"><span class="slot">0${index+1}</span>${portrait(card,'portrait')}<span class="card-copy"><span class="name-line"><b>${esc(card.name)}</b><em>${esc(card.ability||'No ability')}</em></span><span class="numbers"><i><b>${compact(hp)}</b> HP</i><i><b>${compact(atk)}</b> ATK</i></span><span class="border-pills">${CARD_BORDERS.map(b=>`<label class="${slot.borders.includes(b)?'on':''}" data-border="${b}" data-border-slot="${index}">${b}</label>`).join('')}</span></span></button>`}).join('')}</div><div class="aura-grid">${auraBlock('Stat','Stat Aura','statAura','statAuraBorder')}${auraBlock('Skill','Ability Aura','abilityAura','abilityAuraBorder')}</div></article><article class="panel library"><div class="panel-head"><div><span class="kicker">CARD LIBRARY</span><h3>Slot ${state.activeSlot+1}</h3></div><small>${shown.length} shown</small></div><input class="search" id="cardSearch" value="${esc(state.query)}" placeholder="Search card or ability…" autocomplete="off"><div class="library-list">${shown.length?shown.map(card=>`<button data-card="${esc(card.name)}" data-tooltip-card="${esc(card.name)}" class="${team.cards[state.activeSlot]?.cardName===card.name?'selected':''}">${portrait(card)}<span><b>${esc(card.name)}</b><small>${esc(card.ability||'No ability')}</small></span><em>1 / ${compact(card.rarity)}</em></button>`).join(''):'<div class="empty-state">No matching cards.</div>'}</div></article><article class="panel simulation"><div class="panel-head"><div><span class="kicker">DEPTHS TEST</span><h3>Run simulator</h3></div><small>${ready}/5 teams ready</small></div><div class="simulation-body"><div class="sim-note"><b>Source-aligned combat engine</b><p>Depths enemies, all selectable player abilities, card borders, Stat auras, and Ability auras are simulated in a background worker.</p></div><div class="sim-field"><span>Runs per team</span><div class="run-options">${[3,8,15,30,50].map(n=>`<button data-runs="${n}" class="${state.runs===n?'on':''}">${n}</button>`).join('')}</div></div><label class="sim-field"><span>Floor cap</span><input id="capInput" type="number" min="1" max="50000" value="${state.cap}"></label><label class="sim-field"><span>Seed</span><input id="seedInput" type="number" value="${state.seed}"></label><div class="sim-actions"><button class="secondary-run" data-run-active ${state.running||!complete(team)?'disabled':''}>Test Team ${state.activeTeam+1}</button><button class="sim-run" data-run-ready ${state.running||ready===0?'disabled':''}>${state.running?esc(state.runningLabel||'Running…'):`Test ${ready} Ready Team${ready===1?'':'s'}`}</button></div><p class="sim-footnote">30–50 runs at very high floors can take longer. The page remains responsive while the worker calculates.</p></div></article></section><section class="results-panel"><div class="results-title"><div><span class="kicker">DEPTHS TEST RESULTS</span><h3>${results?'Team comparison':'No simulations yet'}</h3></div>${results?'<button class="text-button" data-clear-results>Clear results</button>':''}</div>${results?`<div class="result-grid">${results}</div>`:'<div class="results-empty">Build a complete four-card team, choose any auras you use, then run a test.</div>'}</section><footer><span>Card RNG Expansion Depths Calculator</span><span>Great · Mighty · Almighty intentionally excluded</span></footer></main>`;bindEvents();bindTooltips()}
  function bindEvents(){root.querySelectorAll('[data-team-tab]').forEach(el=>el.addEventListener('click',()=>{state.activeTeam=Number(el.dataset.teamTab);state.activeSlot=0;persist();render()}));root.querySelector('[data-duplicate]')?.addEventListener('click',()=>{const dst=(state.activeTeam+1)%5,src=current();state.teams[dst]={...blankTeam(),cards:src.cards.map(s=>({cardName:s.cardName,borders:[...s.borders]})),statAura:src.statAura,statAuraBorder:src.statAuraBorder,abilityAura:src.abilityAura,abilityAuraBorder:src.abilityAuraBorder};state.activeTeam=dst;state.activeSlot=0;persist();render()});root.querySelector('[data-clear-team]')?.addEventListener('click',()=>{state.teams[state.activeTeam]=blankTeam();state.activeSlot=0;persist();render()});root.querySelector('[data-clear-results]')?.addEventListener('click',()=>{state.teams.forEach(t=>{t.result=null;t.elapsedMs=0;t.lastError=''});render()});root.querySelectorAll('[data-slot]').forEach(el=>el.addEventListener('click',e=>{if(e.target.closest('[data-border]'))return;state.activeSlot=Number(el.dataset.slot);render()}));root.querySelectorAll('[data-border]').forEach(el=>el.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();const slot=current().cards[Number(el.dataset.borderSlot)],b=el.dataset.border;slot.borders=slot.borders.includes(b)?slot.borders.filter(x=>x!==b):[...slot.borders,b];current().result=null;persist();render()}));root.querySelectorAll('[data-card]').forEach(el=>el.addEventListener('click',()=>{current().cards[state.activeSlot].cardName=el.dataset.card;current().result=null;persist();render()}));const search=root.querySelector('#cardSearch');search?.addEventListener('input',()=>{state.query=search.value;render();requestAnimationFrame(()=>{const n=root.querySelector('#cardSearch');n?.focus();n?.setSelectionRange(n.value.length,n.value.length)})});root.querySelectorAll('[data-aura-select]').forEach(el=>el.addEventListener('change',()=>{current()[el.dataset.auraSelect]=el.value;current().result=null;persist();render()}));root.querySelectorAll('[data-aura-border]').forEach(el=>el.addEventListener('click',()=>{current()[el.dataset.auraBorderKey]=el.dataset.auraBorder;current().result=null;persist();render()}));root.querySelectorAll('[data-runs]').forEach(el=>el.addEventListener('click',()=>{state.runs=Number(el.dataset.runs);persist();render()}));root.querySelector('#capInput')?.addEventListener('change',e=>{state.cap=Math.min(50000,Math.max(1,Number(e.target.value)||50000));persist();render()});root.querySelector('#seedInput')?.addEventListener('change',e=>{state.seed=Number(e.target.value)||1;persist();render()});root.querySelector('[data-run-active]')?.addEventListener('click',()=>runTeams([state.activeTeam]));root.querySelector('[data-run-ready]')?.addEventListener('click',()=>runTeams(state.teams.map((t,i)=>complete(t)?i:-1).filter(i=>i>=0)))}
  function bindTooltips(){const show=el=>{const card=cardByName(el.dataset.tooltipCard);if(!card)return;const desc=state.abilities[card.ability]||'No ability description found.';tooltip.innerHTML=`<div class="tip-name">${esc(card.name)}</div><div class="tip-ability">${esc(card.ability||'No ability')}</div><div class="tip-desc">${esc(desc)}</div><div class="tip-rarity">Base rarity: 1 / ${Number(card.rarity||0).toLocaleString('en-US')}</div>`;tooltip.classList.add('show');const r=el.getBoundingClientRect(),w=Math.min(320,window.innerWidth-24);let left=r.right+10;if(left+w>window.innerWidth-12)left=Math.max(12,r.left-w-10);tooltip.style.left=`${left}px`;tooltip.style.top=`${Math.min(window.innerHeight-180,Math.max(12,r.top))}px`};const hide=()=>tooltip.classList.remove('show');root.querySelectorAll('[data-tooltip-card]').forEach(el=>{el.addEventListener('mouseenter',()=>show(el));el.addEventListener('mouseleave',hide);el.addEventListener('focus',()=>show(el));el.addEventListener('blur',hide)})}
  let worker=null,requestId=0;const pending=new Map();
  function startWorker(){try{worker=new Worker('./browser/depths-worker.js');worker.onmessage=e=>{const p=pending.get(e.data.id);if(!p)return;pending.delete(e.data.id);e.data.ok?p.resolve(e.data):p.reject(new Error(e.data.error||'Simulation failed'))};worker.onerror=e=>{for(const p of pending.values())p.reject(new Error(e.message||'Simulation worker failed'));pending.clear();state.workerReady=false};state.workerReady=true}catch(_){state.workerReady=false}}
  function loadoutFor(team){return{cards:team.cards.map(s=>({cardName:s.cardName,borders:[...s.borders]})),statAura:team.statAura?{auraName:team.statAura,border:team.statAuraBorder||null}:null,abilityAura:team.abilityAura?{auraName:team.abilityAura,border:team.abilityAuraBorder||null}:null}}
  function askWorker(index){if(!worker||!state.workerReady)return Promise.reject(new Error('Simulation worker is unavailable. Refresh and try again.'));const id=++requestId,t=state.teams[index];return new Promise((resolve,reject)=>{pending.set(id,{resolve,reject});worker.postMessage({id,loadout:loadoutFor(t),runs:state.runs,floorCap:state.cap,seed:state.seed>>>0})})}
  async function runTeams(indices){if(state.running||!indices.length)return;state.running=true;try{for(let order=0;order<indices.length;order++){const index=indices[order];state.runningLabel=`Testing Team ${index+1} · ${order+1}/${indices.length}`;render();try{const response=await askWorker(index);state.teams[index].result=response.result;state.teams[index].elapsedMs=response.elapsedMs;state.teams[index].lastError=''}catch(error){state.teams[index].result=null;state.teams[index].lastError=error.message||String(error);throw error}}}catch(error){console.error(error)}finally{state.running=false;state.runningLabel='';render()}}
  async function liveThumbs(){const missing=[...new Set([...state.cards,...state.auras].map(x=>x.imageAssetId).filter(id=>id&&!state.thumbs[String(id)]).map(String))];if(!missing.length)return;try{for(let i=0;i<missing.length;i+=20){const chunk=missing.slice(i,i+20),p=new URLSearchParams({assetIds:chunk.join(','),size:'420x420',format:'Png',isCircular:'false'}),r=await fetch(`https://thumbnails.roblox.com/v1/assets?${p}`,{credentials:'omit'});if(!r.ok)continue;const j=await r.json();for(const item of j.data||[])if(item.imageUrl)state.thumbs[String(item.targetId)]=item.imageUrl}render()}catch(_){}}
  async function load(){try{const cardFiles=[1,2,3,4,5,6].map(i=>fetch(`./src/data/cards-${i}.json`).then(r=>r.json())),auraFiles=[1,2].map(i=>fetch(`./src/data/auras-${i}.json`).then(r=>r.json())),abilityFiles=[1,2,3].map(i=>fetch(`./src/data/abilities-${i}.json`).then(r=>r.json())),thumbPromise=fetch('./src/data/thumbnails.json',{cache:'no-store'}).then(r=>r.ok?r.json():{}).catch(()=>({}));const[cardSets,auraSets,abilitySets,thumbs]=await Promise.all([Promise.all(cardFiles),Promise.all(auraFiles),Promise.all(abilityFiles),thumbPromise]);state.cards=cardSets.flat();state.auras=auraSets.flat();state.abilities=Object.assign({},...abilitySets);state.thumbs=thumbs||{};restore();startWorker();render();liveThumbs()}catch(err){console.error(err);root.innerHTML=`<div class="error-box"><b>Calculator failed to load.</b><br><br>${esc(err.message)}</div>`}}
  load();
})();
